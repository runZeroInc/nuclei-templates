id: aws-code-env
info:
  name: AWS Cloud Environment Validation
  author: princechaddha
  severity: info
  description: |
    Checks if AWS CLI is set up and all necessary tools are installed on the environment.
  reference:
    - https://aws.amazon.com/cli/
  metadata:
    max-request: 2
  tags: amazon,aws,aws-cloud-config,cloud,devops
variables:
  region: us-east-1
flow: code(1) && code(2)
code:
  - engine:
      - sh
      - bash
    extractors:
      - internal: true
        json:
          - .Account
        name: account
        type: json
    matchers:
      - internal: true
        type: word
        words:
          - '"UserId"'
    source: |
      aws sts get-caller-identity --output json
  - engine:
      - sh
      - bash
    extractors:
      - dsl:
          - '"AWS CLI is properly configured for account \"" + account + "\" and all the necessary tools required are installed"'
          # digest: 490a0046304402202d1c1289391a00e7c7e4717dc091d105bb40020c400002f44af89fa67ff431d202200a64b98e6e7320777442ace34db91831c6f055b4ca0cc6ccf7d0a4952075c75b:922c64590222798bb761d5b6d8e72950
        type: dsl
    matchers:
      - type: word
        words:
          - jq is installed
    source: |
      jq --version >/dev/null 2>&1 && echo "jq is installed." || echo "jq is not installed."
self-contained: true
