id: cookie-injection
info:
  name: Parameter based cookie injection
  author: pdteam
  severity: info
  reference:
    - https://www.invicti.com/blog/web-security/understanding-cookie-poisoning-attacks/
    - https://docs.imperva.com/bundle/on-premises-knowledgebase-reference-guide/page/cookie_injection.htm
  metadata:
    max-request: 1
  tags: cookie,dast,injection,reflected,vuln
variables:
  first: cookie_injection
http:
  - fuzzing:
      - fuzz:
          - '{{reflection}}'
        parts:
          - query
          - body
        type: postfix
    matchers:
      - part: header
        regex:
          - (?m)(?i)(^set-cookie.*cookie_injection.*)
        # digest: 4a0a00473045022100fcc832957048d66c083e01674bdb650b1f6aac2fe924de9a40f4175d15e9fcea022003ecffde416eccf471ecabcc2fb366f2280987da6a74bc0b23ef5abdd6829ae9:922c64590222798bb761d5b6d8e72950

        type: regex
    payloads:
      reflection:
        - '{{first}}'
    pre-condition:
      - dsl:
          - method == "GET"
          - method == "POST"
          - method == "PUT"
        type: dsl
