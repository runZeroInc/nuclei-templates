id: blind-ssrf
info:
  name: Blind SSRF OAST Detection
  author: pdteam,AmirHossein Raeisi
  severity: medium
  metadata:
    max-request: 3
  tags: dast,oast,ssrf,vuln
http:
  - fuzzing:
      - fuzz:
          - https://{{ssrf}}
        mode: single
        parts:
          - query
          - body
        values:
          - https?:// # Replace HTTP URLs with alternatives
          - \./.* # Replace path parameters with ssrf payloads
    matchers:
      - part: interactsh_protocol # Confirms the HTTP Interaction
        type: word
        words:
          - http
          # digest: 4b0a00483046022100b644f92ed9d04ee20672ae22173c1967871e2101001f713aea7cbeabec3cd3fd0221008defa379d533d6d01f273767f59c0adc1cae76f5cf6c0a376b137dcbcd226e46:922c64590222798bb761d5b6d8e72950
    payloads:
      ssrf:
        - '{{interactsh-url}}'
        - '{{FQDN}}.{{interactsh-url}}'
        - '{{RDN}}.{{interactsh-url}}'
        - '{{FQDN}}@{{interactsh-url}}'
        - '{{RDN}}@{{interactsh-url}}'
    pre-condition:
      - dsl:
          - method == "GET"
          - method == "POST"
          - method == "PUT"
        type: dsl
    stop-at-first-match: true
