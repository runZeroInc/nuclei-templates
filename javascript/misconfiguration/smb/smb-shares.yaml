id: smb-shares
info:
  name: SMB Shares - Enumeration
  author: pussycat0x
  severity: low
  description: |
    Attempts to list shares using the srvsvc.NetShareEnumAll MSRPC function and retrieve more information about them using srvsvc.NetShareGetInfo. If access to those functions is denied, a list of common share names are checked.
  reference:
    - https://nmap.org/nsedoc/scripts/smb-enum-shares.html
  metadata:
    max-request: 1
    shodan-query: port:445
    verified: true
  tags: auth,enum,js,network,smb
javascript:
  - args:
      Host: '{{Host}}'
      Pass: '{{password}}'
      Port: "445"
      User: '{{username}}'
    attack: clusterbomb
    code: |
      try {
          var smb = require("nuclei/smb");
          var client = smb.SMBClient();

          var shares = client.ListShares(Host, Port, User, Pass);

          if (shares && shares.length > 0) {
              Export(shares);
          } else {
              Export([]);
          }
      } catch (e) {
          Export([]);
      }
    extractors:
      - dsl:
          - response
        # digest: 4b0a00483046022100e841dcb39531a29149cdef2b76ac5ae7dcd08253b9e122780e1c2180f030e062022100f4320fa42459105f809991e4e0dd80b30f834123ba4e40b1bc9a29e932c5817f:922c64590222798bb761d5b6d8e72950

        type: dsl
    matchers:
      - condition: and
        dsl:
          - success == true
          - response != "[]"
        type: dsl
    payloads:
      password:
        - ""
        - administrator
        - admin
        - password
        - guest
      username:
        - ""
        - administrator
        - admin
        - guest
    pre-condition: |
      isPortOpen(Host, Port);
    stop-at-first-match: true
    threads: 1
