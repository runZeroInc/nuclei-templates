id: atlantis-dashboard
info:
  name: Atlantis Dashboard - Exposure
  author: DhiyaneshDK
  severity: medium
  description: |
    Atlantis Dashboard was discovered.
  metadata:
    fofa-query: icon_hash=-1706783005
    max-request: 1
    product: atlantis
    shodan-query: http.favicon.hash:"-1706783005"
    vendor: runatlantis
    verified: true
  tags: atlantis,discovery,exposure,misconfig,runatlantis
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<span>Repository</span>"
          - "<span>Project</span>"
          - "<span>Workspace</span>"
        condition: and
      - type: status
        status:
          - 200
