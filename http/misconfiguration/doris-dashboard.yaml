id: doris-dashboard
info:
  name: Doris Dashboard - Exposed
  author: ritikchaddha
  severity: medium
  description: Unauthorized access to the Doris Dashboard.
  metadata:
    max-request: 1
    shodan-query: http.favicon.hash:24048806
    verified: true
  tags: discovery,doris,exposure,logs,misconfig,unauth
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Doris</title>'
          - 'CPU Profile</a>'
          - 'Heap Profile</a>'
        condition: and
      - type: status
        status:
          - 200
