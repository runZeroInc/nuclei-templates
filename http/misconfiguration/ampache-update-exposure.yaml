id: ampache-update-exposure
info:
  name: Ampache Update Page Exposure
  author: ritikchaddha
  severity: low
  description: Ampache update page is exposed.
  classification:
    cpe: cpe:2.3:a:ampache:ampache:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    product: ampache
    shodan-query: http.html:"Ampache Update"
    vendor: ampache
    verified: true
  tags: ampache,exposure,misconfig,vuln
http:
  - method: GET
    path:
      - "{{BaseURL}}/update.php"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Ampache Update"
        case-insensitive: true
      - type: word
        part: body
        words:
          - "No Update Needed"
          - "No updates needed"
        negative: true
      - type: status
        status:
          - 200
