id: springboot-x-application-context
info:
  name: Spring Boot `X-Application-Context` Header Exposure
  author: DhiyaneshDK
  severity: low
  description: |
    Detected the presence of the X-Application-Context header in HTTP responses, which can expose sensitive application context information.
  reference:
    - https://github.com/spring-projects/spring-boot/issues/1308
  metadata:
    max-request: 1
    shodan-query: X-Application-Context
    verified: true
  tags: exposure,misconfig,springboot
http:
  - extractors:
      - group: 1
        part: header
        regex:
          - ^X-Application-Context:\s*(\S.+)$
        # digest: 490a0046304402205f928d7cc3f30c52409036c220222d8544171c99f6fc60f06c5c72f5414b3d31022013f1afd0422012ab08293a67c557d73ff42fabe3916ccfe0767aa3ed96d99a9f:922c64590222798bb761d5b6d8e72950

        type: regex
    host-redirects: true
    matchers:
      - part: header
        type: word
        words:
          - ^X-Application-Context:\s*\S.+$
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
