id: puppetdb-dashboard
info:
  name: PuppetDB Dashboard - Detect
  author: DhiyaneshDk
  severity: info
  description: PuppetDB dashboard was detected.
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
    cpe: cpe:2.3:a:puppet:puppetdb:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    product: puppetdb
    shodan-query: 'title:"PuppetDB: Dashboard"'
    vendor: puppet
    verified: true
  tags: discovery,exposure,misconfig,puppetdb
http:
  - matchers:
      - part: body
        type: word
        words:
          - 'PuppetDB: Dashboard'
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/pdb/dashboard/index.html'
