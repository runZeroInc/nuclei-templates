id: pghero-dashboard-exposure
info:
  name: PgHero Dashboard Exposure Panel - Detect
  author: DhiyaneshDk
  severity: medium
  description: PgHero Dashboard Exposure panel was detected.
  reference:
    - https://github.com/ankane/pghero
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
    cpe: cpe:2.3:a:pghero_project:pghero:*:*:*:*:ruby:*:*:*
  metadata:
    max-request: 1
    product: pghero
    shodan-query: title:"PgHero"
    vendor: pghero_project
    verified: true
  tags: exposure,misconfig,panel,pghero,vuln
http:
  - matchers:
      - type: word
        words:
          - <title>PgHero / Connections</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/connections'
