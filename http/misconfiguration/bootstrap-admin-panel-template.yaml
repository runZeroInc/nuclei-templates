id: bootstrap-admin-panel-template
info:
  name: Bootstrap Admin Panel Template Panel - Detect
  author: tess
  severity: info
  description: Bootstrap Admin Panel Template panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
    cpe: cpe:2.3:a:teamworktec:responsive_bootstrap_admin_template:*:*:*:*:*:*:*:*
  metadata:
    # auto-generated by nuclei-sync — please review before merging
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Dashboard - Bootstrap Admin Template"})
    max-request: 1
    product: responsive_bootstrap_admin_template
    shodan-query: title:"Dashboard - Bootstrap Admin Template"
    vendor: teamworktec
    verified: true
  tags: bootstrap,exposure,misconfig,panel,vuln
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - Dashboard - Bootstrap Admin Template
          - Bootstrap Responsive Admin Template
      - part: body
        type: word
        words:
          - Bootstrap Admin Template
    matchers-condition: or
    method: GET
    path:
      - '{{BaseURL}}'
