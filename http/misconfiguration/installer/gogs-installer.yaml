id: gogs-installer
info:
  name: Gogs (Go Git Service) - Installer
  author: dhiyaneshDk
  severity: critical
  description: Go Git Service installer panel was detected.
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:H/A:H
    cvss-score: 9.4
    cwe-id: CWE-284
    cpe: cpe:2.3:a:gogs:gogs:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    product: gogs
    shodan-query: http.title:"Installation - Gogs"
    vendor: gogs
    verified: true
  tags: exposure,gogs,install,misconfig,vuln
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - General Settings
          - Database Settings
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/install'
