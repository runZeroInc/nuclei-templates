id: nopcommerce-installer
info:
  name: nopCommerce Installer - Detect
  author: DhiyaneshDk
  severity: critical
  description: nopCommerce installer panel was detected.
  reference:
    - https://www.nopcommerce.com/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:H/A:H
    cvss-score: 9.4
    cwe-id: CWE-284
    cpe: cpe:2.3:a:nopcommerce:nopcommerce:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    product: nopcommerce
    shodan-query: html:"nopCommerce Installation"
    vendor: nopcommerce
    verified: true
  tags: install,misconfig,nopcommerce,vuln
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - nopCommerce installation
          - Store information
      - part: header
        type: word
        words:
          - text/html
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/install'
