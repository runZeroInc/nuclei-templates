id: tasmota-install
info:
  name: Tasmota Installer Exposure
  author: ritikchaddha
  severity: high
  description: Tasmota is susceptible to the Installation page exposure due to misconfiguration.
  classification:
    cpe: cpe:2.3:o:tasmota_project:tasmota:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    product: tasmota
    shodan-query: title:"Tasmota"
    vendor: tasmota_project
    verified: true
  tags: exposure,install,misconfig,tasmota,vuln
http:
  - method: GET
    path:
      - "{{BaseURL}}/install/"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Install Tasmota"
          - "Tasmota Installer"
        condition: or
      - type: status
        status:
          - 200
