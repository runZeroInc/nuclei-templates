id: gibbon-installer
info:
  name: Gibbon Installer - Exposure
  author: DhiyaneshDK
  severity: high
  description: Gibbon is susceptible to the Installation page exposure due to misconfiguration.
  metadata:
    fofa-query: icon_hash="-165631681"
    max-request: 1
    product: gibbon
    shodan-query: http.favicon.hash:"-165631681"
    vendor: gibbonedu
    verified: true
  tags: exposure,gibbon,install,misconfig,vuln
http:
  - matchers:
      - part: body
        type: word
        words:
          - <title>Gibbon Installer</title>
      - part: header
        type: word
        words:
          - text/html
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/installer/install.php'
