id: openshift-installer-panel
info:
  name: OpenShift Assisted Installer Panel - Detect
  author: DhiyaneshDk
  severity: medium
  description: OpenShift Assisted Installer panel was detected.
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:H/PR:L/UI:R/S:U/C:L/I:L/A:L
    cvss-score: 4.6
    cwe-id: CWE-284
    cpe: cpe:2.3:a:redhat:openshift_assisted_installer:*:*:*:*:*:*:*:*
  metadata:
    # auto-generated by nuclei-sync — please review before merging
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)OpenShift Assisted Installer"})
    max-request: 1
    product: openshift_assisted_installer
    shodan-query: title:"OpenShift Assisted Installer"
    vendor: redhat
    verified: true
  tags: cluster,misconfig,openshift,panel,vuln
http:
  - matchers:
      - part: body
        type: word
        words:
          - OpenShift Assisted Installer
      - part: header
        type: word
        words:
          - text/html
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/clusters'
