id: circarlife-installer
info:
  name: CirCarLife - Installer
  author: geeknik
  severity: critical
  description: A CirCarLife admin panel was accessed. CirCarLife is an internet-connected electric vehicle charging station
  reference:
    - https://circontrol.com/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:H/A:H
    cvss-score: 9.4
    cwe-id: CWE-284
    cpe: cpe:2.3:h:circontrol:circarlife:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    product: circarlife
    shodan-query: title:"- setup" html:"Modem setup"
    vendor: circontrol
    verified: true
  tags: circarlife,circontrol,exposure,installer,misconfig,panel,scada,setup,vuln
http:
  - matchers:
      - part: header
        type: word
        words:
          - CirCarLife Scada
      - condition: and
        type: word
        words:
          - <title>- setup</title>
          - Network setup
          - Modem setup
          - Security setup
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/html/setup.html'
