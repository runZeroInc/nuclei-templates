id: apollo-adminservice-unauth
info:
  name: Apollo Admin Service - Unauthenticated Access
  author: j4vaovo
  severity: medium
  description: |
    ApolloAdminservice was able to be accessed without authentication.
  reference:
    - https://landgrey.me/blog/20/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:N/A:N
    cvss-score: 5.8
    cwe-id: CWE-522
    cpe: cpe:2.3:a:ctrip:apollo:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    product: apollo
    shodan-query: http.html:"apollo-adminservice"
    vendor: ctrip
    verified: true
  tags: apollo,apolloadminservice,misconfig,unauth,vuln
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - appId
          - orgName
          - ownerName
          - dataChangeCreatedBy
      - part: header
        type: word
        words:
          - application/json
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/apps'
