id: wordpress-themes-detect

info:
  name: WordPress Theme Detection
  author: 0xcrypto
  severity: info
  metadata:
    max-request: 24435
  tags: fuzz,wordpress,fuzzing

flow: http(1) && http(2)

http:
  - raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}

    matchers:
      - type: word
        words:
          - "wp-content"
          - "WordPress"
          - "wordpress"
        condition: or
        internal: true

  - raw:
  - raw:
      - |
        GET /wp-content/themes/{{themeSlug}}/readme.txt HTTP/1.1
        Host: {{Hostname}}

    payloads:
      themeSlug: helpers/wordlists/wordpress-themes.txt

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "== Description =="

