id: redmine-config
info:
  name: Redmine Configuration File - Detect
  author: DhiyaneshDK
  severity: high
  description: Redmine configuration file was detected.
  reference:
    - https://www.exploit-db.com/ghdb/5803
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-200
    cpe: cpe:2.3:a:redmine:redmine:*:*:*:*:*:*:*:*
  metadata:
    google-query: intitle:"index of" configuration.yml
    max-request: 3
    product: redmine
    vendor: redmine
    verified: true
  tags: devops,edb,exposure,files,redmine,vuln
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - user_name
          - password
          - Redmine
      - condition: and
        negative: true
        part: header
        type: word
        words:
          - application/json
          - text/html
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/configuration.yml'
      - '{{BaseURL}}/config/configuration.yml'
      - '{{BaseURL}}/redmine/config/configuration.yml'
    stop-at-first-match: true
