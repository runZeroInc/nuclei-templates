id: rails-secret-token-disclosure
info:
  name: Ruby on Rails Secret Token Disclosure
  author: dhiyaneshDk
  severity: medium
  description: Ruby on Rails Secret Token file is exposed.
  reference:
    - https://github.com/detectify/ugly-duckling/blob/master/modules/crowdsourced/ruby-on-rails-secret-token-disclosure.json
  metadata:
    max-request: 1
  tags: exposure,files,rails,ruby,token,vuln
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - secret_key_base =
          - config.secret_token =
      - negative: true
        part: header
        type: word
        words:
          - text/html
      - status:
          - 200
        # digest: 4a0a004730450221008f9acaa1082fadd847c4c06d5878653b311cb3fcecc898f20522dc7ca2d2adaf022053ada9331ba806330ae85827d137814f67f9c8e3b976a7223b1b643ca50a3dfc:922c64590222798bb761d5b6d8e72950

        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/config/initializers/secret_token.rb'
