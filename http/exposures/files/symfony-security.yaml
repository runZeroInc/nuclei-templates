id: symfony-security
info:
  name: Symfony security.yml File Disclosure
  author: DhiyaneshDK
  severity: info
  classification:
    cpe: cpe:2.3:a:sensiolabs:symfony:*:*:*:*:*:*:*:*
  metadata:
    google-query: intitle:"index of" "security.yml"
    max-request: 3
    product: symfony
    vendor: sensiolabs
    verified: true
  tags: devops,exposure,files,symfony,vuln
http:
  - method: GET
    path:
      - "{{BaseURL}}/security.yml"
      - "{{BaseURL}}/config/security.yml"
      - "{{BaseURL}}/app/config/security.yml"
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'security:'
          - 'providers:'
        condition: and
      - type: status
        status:
          - 200
