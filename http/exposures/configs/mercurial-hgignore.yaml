id: mercurial-hgignore
info:
  name: Mercurial Ignore - File Disclosure
  author: DhiyaneshDK,s4e-io
  severity: info
  description: Mercurial Ignore file disclosure was detected.
  reference:
    - https://swcarpentry.github.io/hg-novice/08-ignore/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
    cpe: cpe:2.3:a:mercurial:mercurial:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    product: mercurial
    shodan-query: html:"hgignore"
    vendor: mercurial
    verified: true
  tags: config,exposure,hgignore,mercurial,vuln
http:
  - matchers:
      - condition: and
        dsl:
          - len(body) > 50
          - status_code == 200
        type: dsl
      - condition: or
        negative: true
        part: response
        type: word
        words:
          - MongoDB over HTTP on the native
          - application/javascript
          - application/x-javascript
          - application/json
          - application/xml
          - html
          - <!doctype
          - <script
          - <meta
          - image/
          - Response xmlns=
          - text/xml
          - <?xml
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/.hgignore'
