id: azure-domain-tenant
info:
  name: Microsoft Entra ID Tenant ID - Detect
  author: V0idC0de,Tortuginator
  severity: info
  description: |
    Detected the Microsoft Entra ID (Azure AD) tenant ID behind a host. The target's pre-authentication redirect is checked first for a tenant GUID in the Location header or the Application Proxy x-ms-proxy-subscription-id header. If the target does not disclose the tenant, the host is resolved to its verified Azure AD domain through the login.microsoftonline.com userrealm endpoint and the tenant ID is read from the OpenID Connect discovery document.
  reference:
    - https://learn.microsoft.com/en-us/entra/identity/app-proxy/overview-what-is-app-proxy
    - https://learn.microsoft.com/en-us/entra/identity/authentication/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 3
    verified: true
  tags: appproxy,azure,cloud,entra,exposure,microsoft,tenant
flow: http('redirect-tenant') || (http('userrealm') && http('oidc-discovery'))
http:
  - extractors:
      - group: 1
        name: tenant_id
        part: header
        regex:
          - (?i)(?:Location:\s*https?://(?:login\.microsoftonline\.com|login\.windows\.net|login\.microsoft\.com|sts\.windows\.net)/|x-ms-proxy-subscription-id:\s*)([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})
        type: regex
    id: redirect-tenant
    matchers:
      - part: header
        regex:
          - (?i)(?:Location:\s*https?://(?:login\.microsoftonline\.com|login\.windows\.net|login\.microsoft\.com|sts\.windows\.net)/|x-ms-proxy-subscription-id:\s*)[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}
        type: regex
    raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}
    redirects: false
  - extractors:
      - group: 1
        internal: true
        name: azure_domain
        part: body
        regex:
          - '"DomainName":"([^"]+)"'
        type: regex
    id: userrealm
    matchers:
      - internal: true
        part: body
        type: word
        words:
          - '"DomainName":'
    raw:
      - |
        @Host: https://login.microsoftonline.com:443
        GET /common/userrealm/{{Host}}?api-version=2.1 HTTP/1.1
        Host: login.microsoftonline.com
  - extractors:
      - group: 1
        name: tenant_id
        part: body
        regex:
          - '"https://login\.microsoftonline\.com/([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})/'
        # digest: 4a0a0047304502207fcf3094f9e645c6911b4b14dec3658c5f369d078d1c40b8db119ff4020d4f57022100a388ca0fdcb479f55ecbdc379fe830facbc5de75ed5c6ec5026f6f0e7aca71e6:922c64590222798bb761d5b6d8e72950

        type: regex
    id: oidc-discovery
    matchers:
      - part: body
        type: word
        words:
          - token_endpoint
      - status:
          - 200
        type: status
    matchers-condition: and
    raw:
      - |
        @Host: https://login.microsoftonline.com:443
        GET /{{azure_domain}}/v2.0/.well-known/openid-configuration HTTP/1.1
        Host: login.microsoftonline.com
