id: cakephp-config
info:
  name: CakePHP Configuration File - Detect
  author: DhiyaneshDk
  severity: medium
  description: CakePHP configuration file was detected.
  reference:
    - https://book.cakephp.org/phinx/0/en/configuration.html
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
    cpe: cpe:2.3:a:cakephp:cakephp:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    product: cakephp
    shodan-query: html:"phinx.yml"
    vendor: cakephp
    verified: true
  tags: config,exposure,files,vuln
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - 'host:'
          - 'name:'
          - 'pass:'
          - 'adapter:'
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/phinx.yml'
      - '{{BaseURL}}/phinx.yaml'
    stop-at-first-match: true
