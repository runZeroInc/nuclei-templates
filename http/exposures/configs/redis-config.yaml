id: redis-config
info:
  name: Redis Configuration File - Detect
  author: geeknik
  severity: medium
  description: Redis configuration file was detected.
  reference:
    - https://redis.io/docs/manual/config/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
    cpe: cpe:2.3:a:redis:redis:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    product: redis
    shodan-query: html:"redis.conf"
    vendor: redis
    verified: true
  tags: config,exposure,redis,vuln
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - bind
          - protected-mode
          - 'port '
      - part: header
        type: word
        words:
          - application/octet-stream
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/redis.conf'
