id: rubocop-config
info:
  name: Rubocop Configuration - Detect
  author: DhiyaneshDk
  severity: info
  description: Rubocop configuration information was detected.
  reference:
    - https://raw.githubusercontent.com/maurosoria/dirsearch/master/db/dicc.txt
    - https://github.com/rubocop/rubocop
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
    cpe: cpe:2.3:a:rubocop_project:rubocop:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    product: rubocop
    shodan-query: html:"rubocop.yml"
    vendor: rubocop_project
    verified: true
  tags: config,exposure,files,ruby,vuln
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - 'AllCops:'
          - 'Include:'
          - 'Exclude:'
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/.rubocop.yml'
