id: ovpn-config-exposed
info:
  name: OVPN Configuration Download Page - Detect
  author: tess
  severity: low
  description: OVPS configuration download page was detected.
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:openvpn:connect:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    product: connect
    shodan-query: http.title:"OVPN Config Download"
    vendor: openvpn
    verified: true
  tags: config,exposure,ovpn,vuln
http:
  - host-redirects: true
    matchers:
      - condition: and
        part: body
        type: word
        words:
          - OVPN Config Download
          - Config List
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
