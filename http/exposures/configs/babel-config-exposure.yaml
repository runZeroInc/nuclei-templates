id: babel-config-exposure
info:
  name: Babel Configuration - Detect
  author: DhiyaneshDK
  severity: info
  description: Babel configuration information was detected.
  reference:
    - https://babeljs.io/docs/en/configuration
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
    cpe: cpe:2.3:a:pocoo:babel:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    product: babel
    shodan-query: html:"babel.config.js"
    vendor: pocoo
    verified: true
  tags: config,exposure,file,vuln
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - module.exports = {
          - 'presets: ['
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/babel.config.js'
