id: codeception-config
info:
  name: Codeception YAML Configuration File - Detect
  author: DhiyaneshDk
  severity: low
  description: Codeception YAML configuration file was detected.
  classification:
    cpe: cpe:2.3:a:codeception:codeception:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    product: codeception
    shodan-query: html:"codeception.yml"
    vendor: codeception
    verified: true
  tags: cicd,codeception,config,devops,exposure,vuln
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - 'paths:'
          - 'settings:'
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/codeception.yml'
