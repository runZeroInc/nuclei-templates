id: karma-config-js
info:
  name: Karma Configuration File - Detect
  author: DhiyaneshDk
  severity: medium
  description: Karma configuration file was detected.
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
    cpe: cpe:2.3:a:karma_project:karma:*:*:*:*:node.js:*:*:*
  metadata:
    max-request: 2
    product: karma
    shodan-query: html:"karma.conf.js"
    vendor: karma_project
    verified: true
  tags: config,devops,exposure,vuln
http:
  - matchers:
      - condition: and
        type: word
        words:
          - // Karma configuration
          - module.exports
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/.config/karma.conf.js'
      - '{{BaseURL}}/karma.conf.js'
    stop-at-first-match: true
