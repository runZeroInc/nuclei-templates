id: strapi-page
info:
  name: Strapi API - Detect
  author: dhiyaneshDk
  severity: info
  description: Strapi API was detected.
  reference:
    - https://strapi.io/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
    cpe: cpe:2.3:a:strapi:strapi:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    product: strapi
    shodan-query: http.title:"Welcome to your Strapi app"
    vendor: strapi
  tags: api,discovery,exposure,strapi
http:
  - matchers:
      - condition: and
        type: word
        words:
          - <title>Welcome to your Strapi app</title>
    method: GET
    path:
      - '{{BaseURL}}'
