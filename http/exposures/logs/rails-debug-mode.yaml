id: rails-debug-mode

info:
  name: Rails Debug Mode
  author: pdteam
  severity: medium
  description: Rails debug mode is enabled.
  metadata:
    runzero-review: REJECT/2025-11-17/excluding tag intrusive
    max-request: 1
  tags: debug,rails,exposure,intrusive,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{randstr}}"

    matchers:
      - type: word
        part: body
        words:
          - "Rails.root:"
          - "Action Controller: Exception caught"
        condition: and

