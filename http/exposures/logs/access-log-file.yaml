id: access-log-file
info:
  name: Publicly accessible access-log file
  author: sheikhrishad
  severity: low
  description: Log file was exposed.
  classification:
    cwe-id:
      - CWE-219
      - CWE-552
  metadata:
    max-request: 4
  tags: exposure,logs,vuln
http:
  - matchers:
      - type: word
        words:
          - '"GET /'
      - part: header
        type: word
        words:
          - text/plain
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/access.log'
      - '{{BaseURL}}/log/access.log'
      - '{{BaseURL}}/logs/access.log'
      - '{{BaseURL}}/application/logs/access.log'
