id: froxlor-database-backup
info:
  name: Froxlor Server Management Backup File - Detect
  author: tess
  severity: medium
  description: Froxlor Server Management backup file was detected.
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
    cpe: cpe:2.3:a:froxlor:froxlor:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    product: froxlor
    shodan-query: title:"Froxlor Server Management Panel"
    vendor: froxlor
    verified: true
  tags: backup,disclosure,exposure,froxlor,vuln
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - DROP TABLE IF EXISTS
          - CREATE TABLE
          - PRIMARY KEY
      - condition: or
        part: header
        type: word
        words:
          - application/sql
          - application/x-sql
          - application/octet-stream
          - text/plain
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/install/froxlor.sql'
