id: openai-service-account-api-key
info:
  name: OpenAI Service Account API Key
  author: Chemo850
  severity: info
  reference:
    - https://platform.openai.com/settings/organization/api-keys
  classification:
    cwe-id:
      - CWE-522
      - CWE-540
  metadata:
    max-request: 1
    verified: true
  tags: ai,exposure,openai,tokens,vuln
http:
  - extractors:
      - part: body
        regex:
          - sk-svcacct-[A-Za-z0-9_-]{74}T3BlbkFJ[A-Za-z0-9_-]{74}
        type: regex
    method: GET
    path:
      - '{{BaseURL}}'
