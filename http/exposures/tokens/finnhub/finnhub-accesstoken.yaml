id: finnhub-accesstoken
info:
  name: finnhub Access Token
  author: DhiyaneshDK
  severity: info
  reference:
    - https://github.com/returntocorp/semgrep-rules/blob/develop/generic/secrets/gitleaks/finnhub-access-token.go
    - https://github.com/returntocorp/semgrep-rules/blob/develop/generic/secrets/gitleaks/finnhub-access-token.yaml
  classification:
    cwe-id:
      - CWE-522
      - CWE-540
  metadata:
    max-request: 1
    verified: true
  tags: exposure,file,finnhub,token,vuln
http:
  - extractors:
      - part: body
        regex:
          - (?i)(?:finnhub)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:=|\|\|:|<=|=>|:)(?:'|\"|\s|=|\x60){0,5}([a-z0-9]{20})(?:['|\"|\n|\r|\s|\x60|;]|$)
        # digest: 4a0a0047304502202bf3e8c1bad983700e3f43dfe00b789099462bb04621dd9fca529f33288958f8022100b159fa8fb5292ef54a6be2e183c9d9f44d3821b7e34112127e9a5c203e517b63:922c64590222798bb761d5b6d8e72950

        type: regex
    method: GET
    path:
      - '{{BaseURL}}'
