id: loqate-api-key
info:
  name: Loqate API Key
  author: realexp3rt
  severity: low
  description: Loqate API Key is leaked.
  reference:
    - https://www.loqate.com/en-gb/home/
  classification:
    cwe-id:
      - CWE-522
      - CWE-540
  metadata:
    max-request: 1
  tags: exposure,loqate,token,vuln
http:
  - extractors:
      - part: body
        regex:
          - '[A-Z]{2}[0-9]{2}-[A-Z]{2}[0-9]{2}-[A-Z]{2}[0-9]{2}-[A-Z]{2}[0-9]{2}'
        type: regex
    method: GET
    path:
      - '{{BaseURL}}'
