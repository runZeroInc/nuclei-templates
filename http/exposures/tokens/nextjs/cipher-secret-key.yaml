id: cipher-secret-key
info:
  name: Cipher Secret Key Exposure
  author: israel comazzetto dos reis
  severity: info
  classification:
    cwe-id:
      - CWE-522
      - CWE-540
  metadata:
    max-request: 1
  tags: exposure,vuln
http:
  - matchers:
      - part: body
        type: word
        words:
          - 'cipherSecretKey:'
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
