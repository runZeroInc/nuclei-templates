id: fcm-server-key
info:
  name: FCM Server Key
  author: absshax
  severity: high
  description: FCM Server Key is leaked.
  reference:
    - https://abss.me/posts/fcm-takeover
  classification:
    cwe-id:
      - CWE-540
  metadata:
    max-request: 1
  tags: exposure,google,token,vuln
http:
  - extractors:
      - part: body
        regex:
          - AAAA[a-zA-Z0-9_-]{7}:[a-zA-Z0-9_-]{140}
        type: regex
    method: GET
    path:
      - '{{BaseURL}}'
