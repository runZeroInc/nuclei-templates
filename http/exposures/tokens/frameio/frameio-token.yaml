id: frameio-token
info:
  name: Frameio API Token
  author: DhiyaneshDK
  severity: info
  reference:
    - https://github.com/returntocorp/semgrep-rules/blob/develop/generic/secrets/gitleaks/frameio-api-token.yaml
    - https://github.com/returntocorp/semgrep-rules/blob/develop/generic/secrets/gitleaks/frameio-api-token.go
  classification:
    cwe-id:
      - CWE-522
      - CWE-540
  metadata:
    max-request: 1
    verified: true
  tags: exposure,frameio,tokens,vuln
http:
  - extractors:
      - part: body
        regex:
          - fio-u-(?i)[a-z0-9\-_=]{64}
        type: regex
    method: GET
    path:
      - '{{BaseURL}}'
