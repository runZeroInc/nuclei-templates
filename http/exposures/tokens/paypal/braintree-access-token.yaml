id: braintree-access-token
info:
  name: PayPal Braintree Access Token Disclosure
  author: Ice3man
  severity: info
  classification:
    cwe-id:
      - CWE-522
      - CWE-540
  metadata:
    max-request: 1
  tags: exposure,paypal,token,vuln
http:
  - extractors:
      - part: body
        regex:
          - access_token\$production\$[0-9a-z]{16}\$[0-9a-f]{32}
        type: regex
    method: GET
    path:
      - '{{BaseURL}}'
