id: crates-api-key
info:
  name: Crates.io API Key
  author: DhiyaneshDK
  severity: info
  reference:
    - https://github.com/praetorian-inc/noseyparker/blob/main/crates/noseyparker/data/default/builtin/rules/crates.io.yml
    - https://crates.io/data-access
    - https://github.com/rust-lang/crates.io/blob/master/src/util/token.rs
  classification:
    cwe-id:
      - CWE-522
      - CWE-540
  metadata:
    max-request: 1
    verified: true
  tags: crates,exposure,token,vuln
http:
  - extractors:
      - part: body
        regex:
          - \bcio[a-zA-Z0-9]{32}\b
        type: regex
    method: GET
    path:
      - '{{BaseURL}}'
