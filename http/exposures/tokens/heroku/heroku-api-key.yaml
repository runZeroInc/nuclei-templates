id: heroku-api-key
info:
  name: Heroku API Key
  author: DhiyaneshDK
  severity: info
  reference:
    - https://github.com/praetorian-inc/noseyparker/blob/main/crates/noseyparker/data/default/builtin/rules/heroku.yml
    - https://devcenter.heroku.com/articles/authentication
  classification:
    cwe-id:
      - CWE-522
      - CWE-540
  metadata:
    max-request: 1
    verified: true
  tags: exposure,heroku,token,vuln
http:
  - extractors:
      - part: body
        regex:
          - (?i)heroku.{0,20}key.{0,20}\b([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\b
        type: regex
    method: GET
    path:
      - '{{BaseURL}}'
