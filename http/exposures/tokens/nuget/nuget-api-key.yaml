id: nuget-api-key
info:
  name: NuGet API Key
  author: DhiyaneshDK
  severity: info
  reference:
    - https://github.com/praetorian-inc/noseyparker/blob/main/crates/noseyparker/data/default/builtin/rules/nuget.yml
    - https://docs.microsoft.com/en-us/nuget/nuget-org/publish-a-package#create-api-keys
  classification:
    cwe-id:
      - CWE-522
      - CWE-540
  metadata:
    max-request: 1
    verified: true
  tags: exposure,nuget,token,vuln
http:
  - extractors:
      - part: body
        regex:
          - (oy2[a-z0-9]{43})
        type: regex
    method: GET
    path:
      - '{{BaseURL}}'
