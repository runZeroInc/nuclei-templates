id: dependency-track-api
info:
  name: Dependency Track API Key
  author: DhiyaneshDK
  severity: info
  reference:
    - https://github.com/praetorian-inc/noseyparker/blob/main/crates/noseyparker/data/default/builtin/rules/dependency_track.yml
    - https://docs.dependencytrack.org/integrations/rest-api/
    - https://docs.dependencytrack.org/getting-started/configuration/
  classification:
    cwe-id:
      - CWE-522
      - CWE-540
  metadata:
    max-request: 1
    verified: true
  tags: dependency,exposure,tokens,vuln
http:
  - extractors:
      - part: body
        regex:
          - \b(odt_[A-Za-z0-9]{32,255})\b
        type: regex
    method: GET
    path:
      - '{{BaseURL}}'
