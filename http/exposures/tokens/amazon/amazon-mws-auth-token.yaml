id: amazon-mws-auth-token
info:
  name: Amazon MWS Auth Token
  author: puzzlepeaches
  severity: info
  classification:
    cwe-id:
      - CWE-522
      - CWE-540
  metadata:
    max-request: 1
  tags: amazon,auth,aws,exposure,token,vuln
http:
  - extractors:
      - part: body
        regex:
          - amzn\.mws\.[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}
        type: regex
    method: GET
    path:
      - '{{BaseURL}}'
