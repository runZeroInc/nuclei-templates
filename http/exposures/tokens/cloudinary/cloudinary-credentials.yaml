id: cloudinary-credentials
info:
  name: Cloudinary Credentials Disclosure
  author: Ice3man
  severity: info
  classification:
    cwe-id:
      - CWE-522
      - CWE-540
  metadata:
    max-request: 1
  tags: cloudinary,exposure,token,vuln
http:
  - extractors:
      - part: body
        regex:
          - cloudinary://[0-9]+:[A-Za-z0-9\-_\.]+@[A-Za-z0-9\-_\.]+
        type: regex
    method: GET
    path:
      - '{{BaseURL}}'
