id: azure-apim-secretkey
info:
  name: Azure - APIM Secret Key
  author: israel comazzetto dos reis
  severity: info
  description: Azure APIM Secret Key
  classification:
    cwe-id:
      - CWE-522
      - CWE-540
  metadata:
    max-request: 1
    shodan-query: html:"Ocp-Apim-Subscription-Key"
    verified: true
  tags: apim,azure,exposure,microsoft,vuln
http:
  - matchers:
      - part: body
        type: word
        words:
          - '"Ocp-Apim-Subscription-Key":'
      - status:
          - 200
        # digest: 4a0a00473045022100b911644976ee16ec8c9afac1964d25a230334f2d0409acee2140e94e8dbd1d070220275af2e5cad150637839094d756716b07b7f7564da252d671249036eb57986aa:922c64590222798bb761d5b6d8e72950

        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
