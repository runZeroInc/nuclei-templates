id: sauce-token
info:
  name: Sauce Token
  author: DhiyaneshDK
  severity: info
  reference:
    - https://github.com/praetorian-inc/noseyparker/blob/main/crates/noseyparker/data/default/builtin/rules/sauce.yml
    - https://docs.saucelabs.com/dev/api/
  classification:
    cwe-id:
      - CWE-522
      - CWE-540
  metadata:
    max-request: 1
    verified: true
  tags: exposure,sauce,token,vuln
http:
  - extractors:
      - part: body
        regex:
          - (?i)sauce.{0,50}\b([a-f0-9-]{36})\b
        type: regex
    method: GET
    path:
      - '{{BaseURL}}'
