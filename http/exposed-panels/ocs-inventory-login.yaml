id: ocs-inventory-login
info:
  name: OCS Inventory Login Panel - Detect
  author: pikpikcu,ritikchaddha
  severity: info
  description: OCS Inventory login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:factorfx:ocs_inventory:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)OCS Inventory"})
    fofa-query: title="OCS Inventory"
    max-request: 2
    product: ocs_inventory
    shodan-query: title:"OCS Inventory"
    vendor: factorfx
    verified: true
  tags: discovery,ocs-inventory,panel
http:
  - host-redirects: true
    matchers:
      - part: body
        type: word
        words:
          - <title>OCS Inventory
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/ocsreports'
    stop-at-first-match: true
