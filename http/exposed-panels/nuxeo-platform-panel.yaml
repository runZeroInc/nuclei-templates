id: nuxeo-platform-panel
info:
  name: Nuxeo Platform Login Panel - Detect
  author: kishore-hariram
  severity: info
  description: Nuxeo Platform login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:nuxeo:nuxeo:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Nuxeo Platform"})
    max-request: 1
    product: nuxeo
    shodan-query: title:"Nuxeo Platform"
    vendor: nuxeo
    verified: true
  tags: discovery,nuxeo,panel
http:
  - matchers:
      - condition: or
        type: word
        words:
          - Nuxeo Platform
          - alt="Nuxeo"
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/nuxeo/login.jsp'
