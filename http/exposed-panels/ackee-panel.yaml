id: ackee-panel

info:
  name: Ackee - Exposed Panel
  author: userdehghani
  severity: info
  description: Ackee panel was detected.
  reference:
    - https://ackee.electerious.com/
    - https://docs.ackee.electerious.com/
  metadata:
    runzero-match: |-
        service["favicon.ico.image.mmh3"] == "-1495233116"
    verified: true
    max-request: 2
    shodan-query: http.favicon.hash:-1495233116
  tags: panel,ackee,login,detect

http:
  - method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/favicon.ico'

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - 'status_code==200 && contains(tolower(body), "<title>ackee")'
          - 'status_code==200 && ("-1495233116" == mmh3(base64_py(body)))'
        condition: or

