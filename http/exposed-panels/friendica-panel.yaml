id: friendica-panel
info:
  name: Friendica Panel - Detect
  author: righettod
  severity: info
  description: |
    Friendica Login Panel was detected.
  reference:
    - https://friendi.ca
  classification:
    cpe: cpe:2.3:a:friendica:friendica:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)friendica"})
    fofa-query: title="friendica"
    google-query: intitle:"friendica"
    max-request: 1
    product: friendica
    shodan-query:
      - http.title:"Friendica"
      - http.title:"friendica"
    vendor: friendica
    verified: true
  tags: detect,discovery,friendica,login,panel
http:
  - extractors:
      - group: 1
        part: body
        regex:
          - (?i)v=([a-z0-9.-]+)
        type: regex
    matchers:
      - condition: or
        part: body
        type: word
        words:
          - title="Search in Friendica
          - Welcome to Friendica Social Network
          - content="Friendica
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
