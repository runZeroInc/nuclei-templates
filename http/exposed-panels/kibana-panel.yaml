id: kibana-panel
info:
  name: Kibana Login Panel - Detect
  author: petruknisme,daffainfo,c-sh0
  severity: info
  description: Kibana login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:elastic:kibana:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)kibana"})
    fofa-query: title="kibana"
    google-query: intitle:"kibana"
    max-request: 3
    product: kibana
    shodan-query:
      - http.title:"Kibana"
      - http.title:"kibana"
    vendor: elastic
  tags: discovery,elastic,kibana,panel
http:
  - host-redirects: true
    matchers:
      - condition: or
        part: body
        type: word
        words:
          - <title>Kibana</title>
          - <title>Elastic</title>
          - <title>Kibana Login</title>
      - part: header
        regex:
          - (?i)(Kbn-Name)
        type: regex
    matchers-condition: or
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/login'
      - '{{BaseURL}}/app/kibana'
    stop-at-first-match: true
