id: opensis-detect
info:
  name: OpenSIS Login Panel - Detect
  author: pikpikcu
  severity: info
  description: OpenSIS login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:os4ed:opensis:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)opensis"})
    fofa-query: title="opensis"
    google-query: intitle:"opensis"
    max-request: 2
    product: opensis
    shodan-query:
      - http.title:"openSIS"
      - http.title:"opensis"
    vendor: os4ed
  tags: discovery,login,opensis,os4ed,panel
http:
  - matchers:
      - part: body
        type: word
        words:
          - <title>openSIS Student Information System</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/opensis/index.php'
    stop-at-first-match: true
