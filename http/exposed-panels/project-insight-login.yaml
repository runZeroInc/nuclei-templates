id: project-insight-login
info:
  name: Project Insight Login Panel - Detect
  author: dhiyaneshDk
  severity: info
  description: Project Insight login panel was detected.
  reference:
    - https://www.exploit-db.com/ghdb/7413
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:helpproject:help:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)project insight - login"})
    fofa-query: title="project insight - login"
    google-query: intitle:"project insight - login"
    max-request: 1
    product: help
    shodan-query:
      - http.title:"Project Insight - Login"
      - http.title:"project insight - login"
    vendor: helpproject
  tags: discovery,edb,helpproject,panel
http:
  - matchers:
      - part: body
        type: word
        words:
          - <title>Project Insight - Login</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/auth/login'
