id: netdata-dashboard-detect
info:
  name: Netdata Dashboard Panel - Detect
  author: pussycat0x
  severity: info
  description: Netdata Dashboard panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:netdata:netdata:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)netdata dashboard"})
    fofa-query: title="netdata dashboard"
    google-query: intitle:"netdata dashboard"
    max-request: 1
    product: netdata
    shodan-query:
      - 'Server: NetData Embedded HTTP Server'
      - http.title:"netdata dashboard"
      - 'server: netdata embedded http server'
    vendor: netdata
  tags: discovery,netdata,panel,tech
http:
  - matchers:
      - part: body
        type: word
        words:
          - <title>netdata dashboard</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
