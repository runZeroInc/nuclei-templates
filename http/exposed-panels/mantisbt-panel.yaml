id: mantisbt-panel
info:
  name: MantisBT Login Panel - Detect
  author: makyotox,daffainfo
  severity: info
  description: MantisBT login panel was detected.
  reference:
    - https://www.mantisbt.org/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:mantisbt:mantisbt:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["favicon.ico.image.mmh3"] == "662709064"
    fofa-query: icon_hash=662709064
    max-request: 1
    product: mantisbt
    shodan-query:
      - http.favicon.hash:662709064
      - cpe:"cpe:2.3:a:mantisbt:mantisbt"
    vendor: mantisbt
    verified: true
  tags: discovery,mantisbt,panel
http:
  - matchers:
      - condition: or
        part: body
        type: word
        words:
          - 'title="MantisBT: Text Search"'
          - 'title="MantisBT: Issue Id"'
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/login_page.php'
