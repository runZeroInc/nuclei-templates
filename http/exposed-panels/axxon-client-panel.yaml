id: axxon-client-panel
info:
  name: Axxon Next Client Login - Detect
  author: irshadahamed
  severity: info
  description: Axxon One is a limitlessly scalable video management software
  reference:
    - https://www.axxonsoft.com/products/video-management-software
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:axxonsoft:axxon_next:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)axxon next client"})
    fofa-query: title="axxon next client"
    google-query: intitle:"axxon next client"
    max-request: 1
    product: axxon_next
    shodan-query:
      - title:"Axxon Next client"
      - http.title:"axxon next client"
    vendor: axxonsoft
    verified: true
  tags: axxon,axxonsoft,detect,discovery,login,panel,vms
http:
  - matchers:
      - part: body
        type: word
        words:
          - <title>Axxon Next client
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
