id: remedy-axis-login
info:
  name: Remedy Axis Login Panel - Detect
  author: tess
  severity: info
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:bmc:remedy_action_request_system:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)BMC Remedy"
    max-request: 3
    product: remedy_action_request_system
    shodan-query: http.html:"BMC Remedy"
    vendor: bmc
    verified: true
  tags: bmc,discovery,panel,remedy
http:
  - matchers:
      - condition: or
        part: body
        type: word
        words:
          - BMC&nbsp;Remedy&nbsp;Mid&nbsp;Tier&nbsp;
          - Remedy Login Page
          - BMC Remedy
          - BMC Smart Reporting
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/arsys/shared/login.jsp'
      - '{{BaseURL}}/rsso/admin/'
    redirects: true
    stop-at-first-match: true
