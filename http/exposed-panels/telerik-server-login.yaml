id: telerik-server-login
info:
  name: Telerik Report Server Login Panel - Detect
  author: ritikchaddha
  severity: info
  description: Telerik Report Server login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:progress:telerik_report_server:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)Telerik Report Server"
    max-request: 1
    product: telerik_report_server
    shodan-query: http.html:"Telerik Report Server"
    vendor: progress
    verified: true
  tags: discovery,panel,telerik
http:
  - host-redirects: true
    matchers:
      - type: word
        words:
          - Telerik Report Server
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}/Account/Login'
