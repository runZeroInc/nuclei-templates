id: pritunl-panel
info:
  name: Pritunl - Panel
  author: irshad ahamed
  severity: info
  description: |
    Realtime website and application monitoring tool
  reference:
    - https://github.com/louislam/uptime-kuma
    - https://uptime.kuma.pet/docs/
  classification:
    cpe: cpe:2.3:a:pritunl:pritunl:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Pritunl"})
    max-request: 1
    product: pritunl
    shodan-query: title:"Pritunl"
    vendor: pritunl
    verified: true
  tags: discovery,login,panel,pritunl
http:
  - matchers:
      - type: word
        words:
          - <title>Pritunl</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/login'
