id: sugarcrm-panel
info:
  name: SugarCRM Login Panel - Detect
  author: johnk3r
  severity: info
  description: SugarCRM login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:sugarcrm:sugarcrm:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)sugarcrm"}) || service["http.body"] matches "(?i)sugarcrm inc\\. all rights reserved"
    fofa-query:
      - title=sugarcrm
      - body="sugarcrm inc. all rights reserved"
    google-query:
      - intitle:sugarcrm
      - intext:"sugarcrm inc. all rights reserved"
    max-request: 2
    product: sugarcrm
    shodan-query:
      - http.title:sugarcrm
      - http.html:"sugarcrm inc. all rights reserved"
    vendor: sugarcrm
  tags: discovery,panel,sugarcrm
http:
  - matchers:
      - part: body
        type: word
        words:
          - <title>SugarCRM</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/index.php?action=Login&module=Users'
    stop-at-first-match: true
