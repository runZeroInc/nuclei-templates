id: openfire-admin-panel
info:
  name: Openfire Admin Console Login Panel - Detect
  author: theamanrawat
  severity: info
  description: Openfire Admin Console login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:igniterealtime:openfire:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)openfire admin console"}) || any(each(service["html.titles"]), {# matches "(?i)openfire"})
    fofa-query:
      - title="openfire"
      - title="openfire admin console"
    google-query:
      - intitle:"openfire admin console"
      - intitle:"openfire"
    max-request: 2
    product: openfire
    shodan-query:
      - http.title:"Openfire Admin Console"
      - http.title:"openfire"
      - http.title:"openfire admin console"
    vendor: igniterealtime
    verified: true
  tags: admin,console,discovery,igniterealtime,openfire,panel
http:
  - matchers:
      - condition: or
        part: body
        type: word
        words:
          - <title>Openfire Admin Console
          - 'Openfire, Version:'
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/login.jsp'
    stop-at-first-match: true
