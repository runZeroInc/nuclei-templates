id: unifi-panel
info:
  name: UniFi Network Login Panel - Detect
  author: TechbrunchFR
  severity: info
  description: UniFi Network login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:ui:unifi_network_application:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)UniFi Network"})
    max-request: 1
    product: unifi_network_application
    shodan-query: http.title:"UniFi Network"
    vendor: ui
  tags: discovery,panel,ubnt,unifi
http:
  - host-redirects: true
    matchers:
      - part: body
        type: word
        words:
          - <title>UniFi Network</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
