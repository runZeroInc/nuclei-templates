id: livezilla-login-panel
info:
  name: LiveZilla Login Panel - Detect
  author: __Fazal
  severity: info
  description: LiveZilla login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:livezilla:livezilla:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)livezilla"
    fofa-query: body=livezilla
    max-request: 1
    product: livezilla
    shodan-query: http.html:livezilla
    vendor: livezilla
  tags: discovery,livezilla,login,panel
http:
  - matchers:
      - status:
          - 200
        type: status
      - type: word
        words:
          - LiveZilla
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/mobile/index.php'
