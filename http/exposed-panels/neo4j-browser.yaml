id: neo4j-browser
info:
  name: Neo4j Browser - Detect
  author: DhiyaneshDK
  severity: info
  description: The Neo4j Browser has been detected.
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:neo4j:neo4j:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)neo4j browser"})
    fofa-query: title="neo4j browser"
    google-query: intitle:"neo4j browser"
    max-request: 1
    product: neo4j
    shodan-query:
      - http.title:"Neo4j Browser"
      - http.title:"neo4j browser"
    vendor: neo4j
  tags: discovery,exposure,neo4j,panel,unauth
http:
  - matchers:
      - part: body
        type: word
        words:
          - <title>Neo4j Browser</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/browser/'
