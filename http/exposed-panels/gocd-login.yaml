id: gocd-login
info:
  name: GoCD Login Panel - Detect
  author: dhiyaneshDK
  severity: info
  description: GoCD login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:thoughtworks:gocd:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)create a pipeline - go"}) || service["http.body"] matches "(?i)gocd version"
    fofa-query:
      - title="create a pipeline - go" html:"gocd version"
      - body="gocd version"
    google-query: intitle:"create a pipeline - go" html:"gocd version"
    max-request: 1
    product: gocd
    shodan-query:
      - html:"GoCD Version"
      - http.html:"gocd version"
      - http.title:"create a pipeline - go" html:"gocd version"
    vendor: thoughtworks
  tags: discovery,go,gocd,panel,thoughtworks
http:
  - matchers:
      - type: word
        words:
          - <title>Login - Go</title>
          - gocd-params
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/go/auth/login'
