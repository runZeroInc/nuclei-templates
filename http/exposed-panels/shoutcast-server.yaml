id: shoutcast-server
info:
  name: SHOUTcast Server Panel - Detect
  author: dhiyaneshDk
  severity: info
  description: SHOUTcast Server panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:shoutcast:dnas:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)SHOUTcast Server"})
    max-request: 1
    product: dnas
    shodan-query: http.title:"SHOUTcast Server"
    vendor: shoutcast
  tags: discovery,panel
http:
  - matchers:
      - part: body
        type: word
        words:
          - <title>SHOUTcast Server</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/index.html'
