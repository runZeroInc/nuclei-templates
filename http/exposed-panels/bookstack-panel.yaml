id: bookstack-panel
info:
  name: BookStack Login Panel - Detect
  author: cyllective,daffainfo
  severity: info
  description: Bookstack login panel was detected.
  reference:
    - https://github.com/BookStackApp/BookStack
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:bookstackapp:bookstack:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)bookstack"})
    fofa-query: title="bookstack"
    google-query: intitle:"bookstack"
    max-request: 1
    product: bookstack
    shodan-query:
      - http.title:"BookStack"
      - http.title:"bookstack"
    vendor: bookstackapp
  tags: bookstack,bookstackapp,discovery,panel
http:
  - extractors:
      - group: 1
        part: body
        regex:
          - (?:app\.js|(?:print\-)?styles\.css)\?version=([\w\.\-]+)["']>
        type: regex
    matchers:
      - condition: or
        part: body
        type: word
        words:
          - <title>BookStack</title>
          - <span class="logo-text">BookStack</span>
      - part: header
        type: word
        words:
          - 'Set-Cookie: bookstack_session'
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/login'
