id: plausible-panel

info:
  name: Plausible - Exposed Panel
  author: rxerium
  severity: info
  description: |
    Plausible panel was detected.
  reference:
    - https://plausible.io/
    - https://github.com/plausible/analytics
  metadata:
    runzero-match: |-
        service["http.body"] matches "Plausible"
    verified: true
    max-request: 1
    shodan-query: html:"Plausible"
  tags: panel,plausible,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Login'
          - 'Plausible · Web analytics'
        condition: and

      - type: status
        status:
          - 200

