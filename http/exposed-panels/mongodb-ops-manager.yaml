id: mongodb-ops-manager

info:
  name: MongoDB Ops Manager Login Panel - Detect
  author: dhiyaneshDK
  severity: info
  description: MongoDB Ops Manager login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:mongodb:ops_manager_server:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    vendor: mongodb
    product: ops_manager_server
    shodan-query: http.title:"mongodb ops manager"
    fofa-query: title="mongodb ops manager"
    google-query: intitle:"mongodb ops manager"
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)MongoDB Ops Manager"})
  tags: panel,mongodb

http:
  - method: GET
    path:
      - '{{BaseURL}}/account/login'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'MongoDB Ops Manager</title>'

      - type: status
        status:
          - 200

