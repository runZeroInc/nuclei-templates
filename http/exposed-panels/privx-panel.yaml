id: privx-panel
info:
  name: SSH PrivX Login Panel - Detect
  author: korteke
  severity: info
  description: SSH PrivX login panel was detected.
  reference:
    - https://www.ssh.com/products/privx/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:ssh:privx:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)PrivX"})
    max-request: 1
    product: privx
    shodan-query: title:"PrivX"
    vendor: ssh
  tags: discovery,panel,privx
http:
  - matchers:
      - part: body
        type: word
        words:
          - <title>PrivX</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/auth/login'
