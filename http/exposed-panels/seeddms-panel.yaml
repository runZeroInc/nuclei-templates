id: seeddms-panel
info:
  name: SeedDMS Login Panel - Detect
  author: pussycat0x,daffainfo
  severity: info
  description: SeedDMS login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:seeddms:seeddms:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)seeddms"})
    fofa-query: title="seeddms"
    google-query: intitle:"seeddms"
    max-request: 2
    product: seeddms
    shodan-query:
      - http.title:"SeedDMS"
      - http.title:"seeddms"
    vendor: seeddms
  tags: discovery,login,panel,seeddms
http:
  - host-redirects: true
    matchers:
      - condition: or
        part: body
        type: word
        words:
          - href="/out/out.ViewFolder.php">SeedDMS</a>
          - href="../out/out.ViewFolder.php?folderid=1">SeedDMS</a>
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}/out/out.Login.php?referuri=%2Fout%2Fout.ViewFolder.php'
      - '{{BaseURL}}/dms/out/out.Login.php?referuri=%2Fout%2Fout.ViewFolder.php'
    stop-at-first-match: true
