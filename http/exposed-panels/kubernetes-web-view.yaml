id: kubernetes-web-view

info:
  name: Kubernetes Local Cluster Web View Panel- Detect
  author: tess
  severity: medium
  description: Kubernetes local cluster web view panel discovered.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:N
    cvss-score: 6.5
    cwe-id: CWE-200
    cpe: cpe:2.3:a:kubernetes:kubernetes:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)kubernetes web view"})
    verified: true
    max-request: 2
    vendor: kubernetes
    product: kubernetes
    shodan-query: http.title:"kubernetes web view"
    fofa-query:
      - title="kubernetes web view"
      - app="kubernetes-enterprise-manager"
    google-query: intitle:"kubernetes web view"
  tags: panel,misconfig,kubernetes,k8s,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/clusters/local'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Kubernetes Web View</title>'
          - 'a href="https://codeberg.org/hjacobs/kube-web-view'
        condition: and

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200

