id: ruckus-wireless-admin-login
info:
  name: Ruckus Wireless Admin Login Panel - Detect
  author: pussycat0x
  severity: info
  description: Ruckus Wireless admin login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:h:ruckuswireless:e510:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)ruckus"})
    fofa-query: title="ruckus"
    google-query: intitle:"ruckus"
    max-request: 1
    product: e510
    shodan-query:
      - title:"ruckus"
      - http.title:"ruckus"
    vendor: ruckuswireless
    verified: true
  tags: discovery,exposed,panel,ruckus,ruckuswireless
http:
  - matchers:
      - part: body
        type: word
        words:
          - <title>Ruckus Wireless Admin</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/login.asp'
