id: machform-admin-panel
info:
  name: MachForm Admin Panel - Detect
  author: ritikchaddha
  severity: info
  description: MachForm Admin panel was detected.
  reference:
    - https://www.machform.com/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:machform:machform:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)MachForm Admin Panel"})
    max-request: 1
    product: machform
    shodan-query: title:"MachForm Admin Panel"
    vendor: machform
    verified: true
  tags: admin,discovery,machform,panel
http:
  - host-redirects: true
    matchers:
      - condition: or
        part: body
        type: word
        words:
          - alt="MachForm"
          - <title>MachForm Admin Panel</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
