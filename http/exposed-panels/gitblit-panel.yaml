id: gitblit-panel
info:
  name: Gitblit Login Panel - Detect
  author: tess,righettod
  severity: info
  description: |
    Gitblit login panel was detected — a pure Java stack for managing, viewing, and serving Git repositories.
  reference:
    - https://github.com/gitblit-org/gitblit
    - https://www.gitblit.com/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:gitblit:gitblit:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)gitblit"}) || service["http.body"] matches "(?i)gitblit"
    fofa-query:
      - body="gitblit"
      - title="gitblit"
    google-query: intitle:"gitblit"
    max-request: 1
    product: gitblit
    shodan-query:
      - http.title:"Gitblit"
      - http.title:"gitblit"
      - http.html:"gitblit"
    vendor: gitblit
    verified: true
  tags: discovery,gitblit,panel
http:
  - extractors:
      - group: 1
        part: body
        regex:
          - <span>v([0-9\.]+)</span>
        type: regex
    host-redirects: true
    matchers:
      - condition: or
        part: body
        type: word
        words:
          - <title>Gitblit</title>
          - Welcome to Gitblit
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
