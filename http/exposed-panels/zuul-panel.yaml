id: zuul-panel
info:
  name: Zuul Panel - Detect
  author: Yuzhe-zhang-0
  severity: info
  description: ZUUL panel was detected.
  reference:
    - https://opendev.org/zuul/zuul
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:zuul-ci:zuul:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["favicon.ico.image.mmh3"] == "-1127895693"
    max-request: 2
    product: zuul
    shodan-query: http.favicon.hash:-1127895693
    vendor: zuul-ci
  tags: cicd,discovery,oss,panel,zuul
http:
  - host-redirects: true
    matchers:
      - condition: and
        part: body
        type: word
        words:
          - '"name":'
          - '"projects":'
          - '"queue":'
      - type: word
        words:
          - zuul_version
    matchers-condition: or
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}/api/tenants'
      - '{{BaseURL}}/api/status'
    stop-at-first-match: true
