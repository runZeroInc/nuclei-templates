id: joget-panel
info:
  name: Joget Panel - Detect
  author: Podalirius
  severity: info
  description: Joget panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:joget:joget_dx:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["favicon.ico.image.mmh3"] == "-1343712810"
    max-request: 1
    product: joget_dx
    shodan-query: http.favicon.hash:-1343712810
    vendor: joget
  tags: discovery,joget,panel
http:
  - extractors:
      - group: 2
        part: body
        regex:
          - <li>(Version:[ \n\t]*([^<]+)[ \n\t]*)</li>
        type: regex
    matchers:
      - type: word
        words:
          - System Error
      - status:
          - 500
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/jw/web/;'
