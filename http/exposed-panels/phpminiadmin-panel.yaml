id: phpminiadmin-panel
info:
  name: phpMiniAdmin Login Panel - Detect
  author: nullfuzz
  severity: info
  description: |
    phpMiniAdmin login panel was detected.
  reference:
    - https://github.com/osalabs/phpminiadmin
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:phpminiadmin_project:phpminiadmin:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)phpMiniAdmin"
    max-request: 1
    product: phpminiadmin
    shodan-query: http.html:"phpMiniAdmin"
    vendor: phpminiadmin_project
    verified: true
  tags: discovery,panel,phpminiadmin
http:
  - extractors:
      - group: 1
        part: body
        regex:
          - phpMiniAdmin ([0-9._]+)
        type: regex
    matchers:
      - condition: and
        dsl:
          - status_code == 200
          - contains(body, '<title>phpMiniAdmin')
        type: dsl
    method: GET
    path:
      - '{{BaseURL}}/phpminiadmin.php'
