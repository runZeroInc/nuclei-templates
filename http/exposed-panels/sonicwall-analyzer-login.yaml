id: sonicwall-analyzer-login
info:
  name: SonicWall Analyzer Login Panel - Detect
  author: DhiyaneshDK
  severity: info
  description: SonicWall Analyzer login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:sonicwall:analyzer:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)sonicwall analyzer login"})
    fofa-query: title="sonicwall analyzer login"
    google-query: intitle:"sonicwall analyzer login"
    max-request: 1
    product: analyzer
    shodan-query:
      - title:"SonicWall Analyzer Login"
      - http.title:"sonicwall analyzer login"
    vendor: sonicwall
    verified: true
  tags: discovery,panel,sonicwall
http:
  - matchers:
      - part: body
        type: word
        words:
          - SonicWall Analyzer Login
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/sgms/auth'
