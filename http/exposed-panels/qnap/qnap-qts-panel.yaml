id: qnap-qts-panel
info:
  name: QNAP Turbo NAS Login Panel - Detect
  author: idealphase,daffainfo
  severity: info
  description: |
    QNAP QTS login panel was detected.
  reference:
    - https://www.qnap.com/qts/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:o:qnap:qts:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)qnap turbo nas"})
    fofa-query: title="qnap turbo nas" inurl:/cgi-bin
    google-query:
      - intitle:"QNAP Turbo NAS" inurl:/cgi-bin
      - intitle:"qnap turbo nas" inurl:/cgi-bin
    max-request: 2
    product: qts
    shodan-query:
      - product:"QNAP"
      - product:"qnap"
      - http.title:"qnap turbo nas" inurl:/cgi-bin
    vendor: qnap
    verified: true
  tags: discovery,panel,qnap,qts
http:
  - matchers:
      - part: body
        type: word
        words:
          - QNAP Turbo NAS</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}/cgi-bin/'
      - '{{BaseURL}}/cgi-bin/html/login.html'
    redirects: true
    stop-at-first-match: true
