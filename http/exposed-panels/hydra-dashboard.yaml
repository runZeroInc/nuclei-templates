id: hydra-dashboard
info:
  name: Hydra Router Dashboard - Detect
  author: tess
  severity: info
  description: Hydra router dashboard was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:hydra_project:hydra:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)hydra router dashboard"})
    fofa-query: title="hydra router dashboard"
    google-query: intitle:"hydra router dashboard"
    max-request: 1
    product: hydra
    shodan-query:
      - title:"Hydra Router Dashboard"
      - http.title:"hydra router dashboard"
    vendor: hydra_project
    verified: true
  tags: discovery,exposure,hydra,hydra_project,panel
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - Hydra Router Dashboard
          - 'screen: ''dashboard'''
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
