id: teamcity-login-panel
info:
  name: TeamCity Login Panel - Detect
  author: princechaddha
  severity: info
  description: TeamCity login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:jetbrains:teamcity:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)teamcity"})
    fofa-query: title=teamcity
    google-query: intitle:teamcity
    max-request: 1
    product: teamcity
    shodan-query:
      - http.component:"TeamCity"
      - http.title:teamcity
      - http.component:"teamcity"
    vendor: jetbrains
    verified: true
  tags: detect,discovery,jetbrains,panel,teamcity
http:
  - extractors:
      - group: 1
        name: version
        part: body
        regex:
          - Version</span> ([0-9.]+)
        type: regex
      - group: 1
        name: build
        part: body
        regex:
          - Version</span> [0-9.]+ \(build (.*)\)</span>
        type: regex
    matchers:
      - part: body
        type: word
        words:
          - <title>Log in to TeamCity &mdash; TeamCity</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/login.html'
