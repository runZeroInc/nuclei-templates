id: gespage-panel
info:
  name: Gespage Login Panel - Detect
  author: pikpikcu,daffainfo
  severity: info
  description: Gespage login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:gespage:gespage:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    product: gespage
    shodan-query: Path=/gespage
    vendor: gespage
  tags: discovery,gespage,panel
http:
  - extractors:
      - group: 1
        part: body
        regex:
          - '\(Ver: ([0-9._A-Z]+)\)'
        type: regex
    matchers:
      - condition: and
        part: body
        type: word
        words:
          - <link rel="stylesheet" href="css/gespage.css" />
          - <link rel="stylesheet" href="css/menugrey.css" />
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/gespage/webapp/login.xhtml'
