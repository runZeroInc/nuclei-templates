id: papercut-login-panel

info:
  name: PaperCut Panel - Detect
  author: ritikchaddha
  severity: info
  description: |
    PaperCut is a print management system. Log in to manage your print quotas, see your print history and configure your system.
  classification:
    cpe: cpe:2.3:a:papercut:papercut_ng:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: papercut
    product: papercut_ng
    shodan-query:
      - http.html:'content="papercut'
      - cpe:"cpe:2.3:a:papercut:papercut_ng"
      - http.html:"content=\"papercut\""
    fofa-query:
      - body='content="papercut'
      - body="content=\"papercut\""
    google-query:
      - html:'content="PaperCut'
      - html:'content="papercut'
    runzero-match: service["http.body"] matches "(?i)'content=\"papercut'" || service["http.body"] matches "(?i)content=\\\\"
  tags: panel,papercut,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/user"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'content="PaperCut'
          - '<title>PaperCut Login'
        condition: or

      - type: status
        status:
          - 200
