id: parallels-hsphere-detect
info:
  name: Parallels H-Sphere Login Panel - Detect
  author: ritikchaddha
  severity: info
  description: Parallels H-Sphere login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:parallels:h-sphere:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)parallels h-sphere"}) || any(each(service["html.titles"]), {# matches "(?i)h-sphere"})
    fofa-query:
      - title="h-sphere"
      - title="parallels h-sphere"
    google-query:
      - intitle:"h-sphere"
      - intitle:"parallels h-sphere"
    max-request: 1
    product: h-sphere
    shodan-query:
      - title:"Parallels H-Sphere"
      - http.title:"h-sphere"
      - http.title:"parallels h-sphere"
    vendor: parallels
    verified: true
  tags: discovery,hsphere,panel,parallels
http:
  - matchers:
      - condition: or
        type: word
        words:
          - <title>Parallels H-Sphere</title>
          - <TITLE>H-SPHERE</TITLE>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
