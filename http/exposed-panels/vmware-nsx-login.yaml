id: vmware-nsx-login
info:
  name: VMware NSX Login Panel - Detect
  author: DhiyaneshDk
  severity: info
  description: VMware NSX login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:vmware:nsx-t_data_center:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)vmw_nsx_logo-black-triangle-500w\\.png"
    max-request: 1
    product: nsx-t_data_center
    shodan-query: html:"vmw_nsx_logo-black-triangle-500w.png"
    vendor: vmware
    verified: true
  tags: discovery,panel,vmware
http:
  - matchers:
      - part: body
        type: word
        words:
          - <title>VMware Appliance Management</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/login.jsp'
