id: black-duck-panel
info:
  name: Black Duck Login Panel - Detect
  author: idealphase,ritikchaddha
  severity: info
  description: |
    Black Duck login panel was detected.
  reference:
    - https://www.blackducksoftware.com/
    - https://www.synopsys.com/software-integrity/security-testing/software-composition-analysis.html
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:synopsys:black_duck_hub:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Black Duck"})
    max-request: 1
    product: black_duck_hub
    shodan-query: http.title:"Black Duck"
    vendor: synopsys
    verified: true
  tags: blackduck,discovery,panel,synopsys
http:
  - host-redirects: true
    matchers:
      - part: body
        regex:
          - (?m)<title>Black Duck(.*)<\/title>
        type: regex
      - condition: or
        part: body
        type: word
        words:
          - ProtexLoginPage
          - CCLoginPage
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
