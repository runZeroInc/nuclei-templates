id: ez-publish-panel
info:
  name: eZ Publish Login Panel - Detect
  author: ritikchaddha
  severity: info
  description: eZ Publish login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:ez:ez_publish:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)eZ Publish"
    max-request: 1
    product: ez_publish
    shodan-query: http.html:"eZ Publish"
    vendor: ez
    verified: true
  tags: discovery,ez,panel
http:
  - host-redirects: true
    matchers:
      - case-insensitive: true
        part: body
        type: word
        words:
          - content="eZ Publish
      - part: header
        type: word
        words:
          - eZ Publish
    matchers-condition: or
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
