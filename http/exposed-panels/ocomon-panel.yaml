id: ocomon-panel
info:
  name: OcoMon Login Panel - Detect
  author: dogasantos
  severity: info
  description: a tiny helpdesk system written in php
  reference:
    - https://sourceforge.net/projects/ocomonphp/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:ocomon_project:ocomon:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)ocomon"
    fofa-query: body="ocomon"
    max-request: 1
    product: ocomon
    shodan-query:
      - http.html:"OcoMon"
      - http.html:"ocomon"
    vendor: ocomon_project
    verified: true
  tags: discovery,ocomon,ocomon_project,oss,panel
http:
  - extractors:
      - group: 1
        regex:
          - 'Versão: ([0-9.]+)'
          - Versão:&nbsp;([0-9.]+)
        type: regex
    host-redirects: true
    matchers:
      - regex:
          - (?i)(OcoMon)
        type: regex
      - part: body
        type: word
        words:
          - open_form/ticket_form_open.php
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
