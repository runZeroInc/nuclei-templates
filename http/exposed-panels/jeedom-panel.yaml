id: jeedom-panel
info:
  name: Jeedom Login Panel - Detect
  author: pikpikcu,daffainfo
  severity: info
  description: Jeedom login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:jeedom:jeedom:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)jeedom"})
    fofa-query: title="jeedom"
    google-query: intitle:"jeedom"
    max-request: 1
    product: jeedom
    shodan-query:
      - http.title:"Jeedom"
      - http.title:"jeedom"
    vendor: jeedom
  tags: discovery,jeedom,login,panel
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - <title>Jeedom</title>
          - JEEDOM_PRODUCT_NAME
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/index.php?v=d'
