id: veeam-backup-gcp
info:
  name: Veeam Backup for Google Cloud Platform Panel - Detect
  author: DhiyaneshDK
  severity: info
  description: Veeam Backup for Google Cloud Platform panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:veeam:veeam_backup_for_google_cloud:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Veeam Backup for GCP"})
    max-request: 1
    product: veeam_backup_for_google_cloud
    shodan-query: title:"Veeam Backup for GCP"
    vendor: veeam
    verified: true
  tags: cloud,discovery,google,panel
http:
  - matchers:
      - type: word
        words:
          - <title>Veeam Backup for GCP</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
