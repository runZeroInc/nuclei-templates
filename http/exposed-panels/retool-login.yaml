id: retool-login
info:
  name: Retool Login Panel - Detect
  author: DhiyaneshDk
  severity: info
  description: Retool login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:retool:retool:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Retool"})
    max-request: 1
    product: retool
    shodan-query: title:"Retool"
    vendor: retool
    verified: true
  tags: discovery,login,panel,retool
http:
  - matchers:
      - type: word
        words:
          - <title>Retool</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/auth/login'
