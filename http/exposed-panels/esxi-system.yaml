id: esxi-system
info:
  name: ESXi System Login Panel - Detect
  author: dhiyaneshDK
  severity: info
  description: ESXi System login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:o:vmware:esxi:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)esxuiapp"
    fofa-query: body="esxuiapp"
    max-request: 1
    product: esxi
    shodan-query:
      - html:"esxUiApp"
      - http.html:"esxuiapp"
      - cpe:"cpe:2.3:o:vmware:esxi"
    vendor: vmware
  tags: discovery,esxi,panel,vmware
http:
  - matchers:
      - type: word
        words:
          - ng-app="esxUiApp"
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/ui/#/login'
