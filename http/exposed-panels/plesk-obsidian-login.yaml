id: plesk-obsidian-login
info:
  name: Plesk Obsidian Login Panel - Detect
  author: dhiyaneshDK,daffainfo
  severity: info
  description: Plesk Obsidian login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:plesk:obsidian:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)plesk obsidian" || any(each(service["html.titles"]), {# matches "(?i)plesk obsidian"})
    fofa-query:
      - body="plesk obsidian"
      - title="plesk obsidian"
    google-query: intitle:"plesk obsidian"
    max-request: 1
    product: obsidian
    shodan-query:
      - http.html:"Plesk Obsidian"
      - http.html:"plesk obsidian"
      - http.title:"plesk obsidian"
    vendor: plesk
    verified: true
  tags: discovery,edb,login,panel,plesk
http:
  - extractors:
      - group: 1
        regex:
          - (?i)<title>([A-Za-z 0-9.]+)</title>
        type: regex
    matchers:
      - type: word
        words:
          - Plesk Obsidian
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/login_up.php'
