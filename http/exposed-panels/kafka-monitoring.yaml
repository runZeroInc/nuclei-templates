id: kafka-monitoring
info:
  name: Apache Kafka Monitor Login Panel - Detect
  author: pdteam
  severity: info
  description: Apache Kafka Monitor login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:apache:kafka:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)kafka center"}) || any(each(service["html.titles"]), {# matches "(?i)kafka consumer offset monitor"})
    fofa-query:
      - title="kafka center"
      - title="kafka consumer offset monitor"
    google-query:
      - intitle:"kafka center"
      - intitle:"kafka consumer offset monitor"
    max-request: 1
    product: kafka
    shodan-query:
      - http.title:"kafka center"
      - http.title:"kafka consumer offset monitor"
    vendor: apache
  tags: apache,discovery,kafka,panel
http:
  - matchers:
      - type: word
        words:
          - '>KafkaMonitor</a>'
          - '>Kafka Monitor GUI</h1>'
    method: GET
    path:
      - '{{BaseURL}}'
