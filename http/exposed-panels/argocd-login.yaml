id: argocd-login
info:
  name: Argo CD Login Panel
  author: Adam Crosser,daffainfo,aringo,righettod
  severity: info
  description: |
    ArgoCD was detected - A declarative, GitOps continuous delivery tool for Kubernetes.
  reference:
    - https://argoproj.github.io/cd/
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:argoproj:argo_cd:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Argo CD"})
    max-request: 2
    product: argo_cd
    shodan-query: http.title:"Argo CD"
    vendor: argoproj
  tags: argocd,discovery,kubernetes,login,panel
http:
  - extractors:
      - json:
          - .Version
        # digest: 4b0a00483046022100c36ca31848e38eda3096905b44b9ddca8ac1a59e5421d6a3f9d3a20654cdbfca02210096d184e6f905b8db2fe9cdecaa37b2644ba0f2840ff3c76e86e45e4fcebf457f:922c64590222798bb761d5b6d8e72950

        type: json
    matchers:
      - condition: and
        dsl:
          - contains(to_lower(header_1), 'grpc-metadata-content-type')
          - status_code_1 == 200
        type: dsl
      - condition: and
        dsl:
          - contains(body_2, 'appLabelKey')
          - contains(body_2, 'resourceOverrides')
        type: dsl
    matchers-condition: or
    method: GET
    path:
      - '{{BaseURL}}/api/version'
      - '{{BaseURL}}/api/v1/settings'
    stop-at-first-match: true
