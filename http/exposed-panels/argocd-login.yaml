id: argocd-login
info:
  name: Argo CD Login Panel
  author: Adam Crosser,daffainfo,aringo
  severity: info
  description: An Argo CD login panel was discovered.
  reference:
    - https://argoproj.github.io/cd/
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:argoproj:argo_cd:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Argo CD"})
    max-request: 2
    product: argo_cd
    shodan-query: http.title:"Argo CD"
    vendor: argoproj
  tags: argocd,discovery,kubernetes,login,panel
http:
  - extractors:
      - json:
          - .Version
        type: json
    matchers:
      - condition: and
        dsl:
          - contains(to_lower(header_1), 'grpc-metadata-content-type')
          - status_code_1 == 200
        type: dsl
      - condition: and
        dsl:
          - contains(body_2, 'appLabelKey')
          - contains(body_2, 'resourceOverrides')
        type: dsl
    matchers-condition: or
    method: GET
    path:
      - '{{BaseURL}}/api/version'
      - '{{BaseURL}}/api/v1/settings'
    stop-at-first-match: true
