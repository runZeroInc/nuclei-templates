id: hangfire-dashboard
info:
  name: Hangfire Dashboard Panel - Detect
  author: DhiyaneshDk,righettod
  severity: info
  description: Hangfire Dashboard panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:hangfire:hangfire:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)overview – hangfire dashboard"})
    fofa-query: title="overview – hangfire dashboard"
    google-query: intitle:"overview – hangfire dashboard"
    max-request: 2
    product: hangfire
    shodan-query:
      - title:"Overview – Hangfire Dashboard"
      - http.title:"overview – hangfire dashboard"
    vendor: hangfire
    verified: true
  tags: discovery,hangfire,panel
http:
  - extractors:
      - group: 1
        part: body
        regex:
          - Hangfire\s+([0-9.]+)
        type: regex
    matchers:
      - case-insensitive: true
        condition: and
        part: body
        type: word
        words:
          - Hangfire Dashboard
          - Realtime Graph
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/hangfire'
    stop-at-first-match: true
