id: asus-router-panel
info:
  name: Asus Router Login Panel - Detect
  author: arafatansari
  severity: info
  description: Asus router login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:h:asus:rt-n53:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    product: rt-n53
    shodan-query: 'Server: httpd/2.0 port:8080'
    vendor: asus
    verified: true
  tags: asus,discovery,iot,panel,router
http:
  - matchers:
      - condition: or
        type: word
        words:
          - <title>ASUS Login</title>
          - Sign in with your ASUS router account
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/Main_Login.asp'
