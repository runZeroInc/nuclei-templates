id: glpi-project_glpi
info:
  name: GLPI Panel - Detect
  author: dogasantos,daffainfo,ricardomaia,dhiyaneshDk
  severity: info
  description: GLPI panel was detected.
  reference:
    - https://glpi-project.org/
    - https://www.exploit-db.com/ghdb/7002
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:glpi-project:glpi:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)glpi"}) || service["favicon.ico.image.mmh3"] == "-1474875778"
    fofa-query:
      - title="glpi"
      - icon_hash="-1474875778"
    google-query: intitle:"glpi"
    max-request: 3
    product: glpi
    shodan-query:
      - http.title:"GLPI"
      - http.title:"glpi"
      - http.favicon.hash:"-1474875778"
    vendor: glpi-project
    verified: true
  tags: discovery,edb,glpi,glpi-project,panel
http:
  - extractors:
      - group: 1
        name: version
        part: body
        regex:
          - (?i)base\.min\.js\?v=([\d.|\d]+)">
          - (?i)jquery\.min\.js\?v=([\d.|\d]+)">
          - (?i)# GLPI changes\n\n.*\n.*\n.*\n##\s\[(\d+\.\d+|\d+\.\d+\.\d+)\]
          - (?i)GLPI.*?([\d.|\d]+).copyright
        type: regex
    matchers:
      - case-insensitive: true
        condition: and
        type: word
        words:
          - GLPI
          - glpi-project.org
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/CHANGELOG.md'
      - '{{BaseURL}}/glpi/'
    redirects: true
    stop-at-first-match: false
