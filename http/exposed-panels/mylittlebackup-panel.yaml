id: mylittlebackup-panel
info:
  name: myLittleBackup Panel - Detect
  author: nullfuzz
  severity: info
  description: |
    myLittleBackup panel was detected.
  reference:
    - http://www.mylittlebackup.com/mlb/en/overview.aspx
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:mylittletools:mylittlebackup:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)myLittleBackup"
    max-request: 3
    product: mylittlebackup
    shodan-query: http.html:"myLittleBackup"
    vendor: mylittletools
    verified: true
  tags: discovery,mylittlebackup,panel
http:
  - host-redirects: true
    matchers:
      - condition: or
        part: body
        regex:
          - content=".*(myLittleBackup).*
          - <title>myLittleBackup for SQL Server
        type: regex
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/mlb/'
      - '{{BaseURL}}/mylittlebackup/'
    stop-at-first-match: true
