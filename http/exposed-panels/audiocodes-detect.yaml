id: audiocodes-detect
info:
  name: AudioCodes Login - Panel Detect
  author: princechaddha
  severity: info
  description: AudioCodes login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:o:audiocodes:420hd_ip_phone_firmware:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)Audiocodes"
    max-request: 1
    product: 420hd_ip_phone_firmware
    shodan-query: http.html:"Audiocodes"
    vendor: audiocodes
    verified: true
  tags: audiocodes,discovery,panel
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - AudioCodes
          - login
      - status:
          - 203
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
