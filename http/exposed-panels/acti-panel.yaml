id: acti-panel

info:
  name: ACTi Video Monitoring - Exposed Panel
  author: DhiyaneshDk
  severity: info
  description: ACTi Video Monitoring panel was detected.
  classification:
    cpe: cpe:2.3:o:acti:camera_firmware:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: |-
        any(each(service["html.titles"]), {# matches "Web Configurator"}) && service["http.body"] matches "ACTi"
    verified: true
    max-request: 1
    vendor: acti
    product: camera_firmware
    shodan-query: title:"Web Configurator" html:"ACTi"
    fofa-query: app="ACTi-视频监控"
  tags: acti,panel,login,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/cgi-bin/videoconfiguration.cgi"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Web Configurator'
          - 'ACTi'
        condition: and
        case-insensitive: true

      - type: status
        status:
          - 200

