id: phabricator-login
info:
  name: Phabricator Login Panel - Detect
  author: dhiyaneshDK
  severity: info
  description: Phabricator login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:phacility:phabricator:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)phabricator-standard-page"
    fofa-query: body="phabricator-standard-page"
    max-request: 1
    product: phabricator
    shodan-query:
      - html:"phabricator-standard-page"
      - http.html:"phabricator-standard-page"
    vendor: phacility
  tags: discovery,panel,phabricator,phacility
http:
  - matchers:
      - type: word
        words:
          - phabricator-standard-page
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/auth/login/'
