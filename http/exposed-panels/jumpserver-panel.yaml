id: jumpserver-panel
info:
  name: JumpServer Login Panel - Detect
  author: lu4nx,righettod
  severity: info
  description: |
    JumpServer Open Source Bastion Host login panel was detected.
  reference:
    - https://github.com/jumpserver/jumpserver
    - https://www.jumpserver.org/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:fit2cloud:jumpserver:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)'JumpServer'"})
    max-request: 2
    product: jumpserver
    shodan-query: http.title:'JumpServer'
    vendor: fit2cloud
    verified: true
    zoomeye-query: app="JumpServer Bastion Host"
  tags: discovery,jumpserver,login,panel
http:
  - extractors:
      - group: 1
        part: body
        regex:
          - (?i)&copy;\s+([0-9-]+)
        type: regex
    matchers:
      - condition: or
        part: body
        regex:
          - |-
            (?i)<title>(
            .*)JumpServer Open Source Bastion Host(
            .*)</title>
          - |-
            (?i)<title>(
            .*)JumpServer 开源堡垒机(
            .*)</title>
          - |-
            (?i)<title>
            *Jumpserver.*?
            *</title>
          - (?i)>Welcome to the Jumpserver.*?</h2>
        type: regex
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/core/auth/login/'
      - '{{BaseURL}}/users/login/'
    stop-at-first-match: true
