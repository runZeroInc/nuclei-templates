id: omniampx-panel
info:
  name: Omnia MPX Node Login Panel - Detect
  author: arafatansari
  severity: info
  description: Omnia MPX Node login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:h:telosalliance:omnia_mpx_node:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)Omnia MPX"
    max-request: 1
    product: omnia_mpx_node
    shodan-query: http.html:"Omnia MPX"
    vendor: telosalliance
    verified: true
  tags: discovery,omnia,omniampx,panel
http:
  - matchers:
      - type: word
        words:
          - Omnia MPX Node | Login
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/login'
