id: home-assistant-panel
info:
  name: Home Assistant Panel
  author: fabaff,daffainfo,lum8rjack
  severity: info
  reference:
    - https://www.home-assistant.io/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:home-assistant:home-assistant:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Home Assistant"})
    max-request: 1
    product: home-assistant
    shodan-query: http.title:"Home Assistant"
    vendor: home-assistant
    verified: true
  tags: discovery,homeassistant,iot,panel
http:
  - matchers:
      - part: body
        type: word
        words:
          - <title>Home Assistant</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
