id: drawio-flowchartmaker-panel
info:
  name: draw.io Flowchart Maker Panel - Detect
  author: princechaddha
  severity: info
  description: draw.io Flowchart Maker panel was detected.
  reference:
    - https://github.com/jgraph/drawio
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:diagrams:drawio:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)flowchart maker"})
    fofa-query: title="flowchart maker"
    google-query: intitle:"flowchart maker"
    max-request: 1
    product: drawio
    shodan-query:
      - http.title:"Flowchart Maker"
      - http.title:"flowchart maker"
    vendor: diagrams
    verified: true
  tags: diagrams,discovery,drawio,oss,panel
http:
  - matchers:
      - part: body
        type: word
        words:
          - <title>Flowchart Maker & Online Diagram Software</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
