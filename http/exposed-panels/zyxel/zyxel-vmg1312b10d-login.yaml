id: zyxel-vmg1312b10d-login
info:
  name: Zyxel VMG1312-B10D - Login Detection
  author: princechaddha
  severity: info
  classification:
    cpe: cpe:2.3:o:zyxel:vmg1312-b10d_firmware:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)vmg1312-b10d"
    fofa-query: body="vmg1312-b10d"
    max-request: 1
    product: vmg1312-b10d_firmware
    shodan-query:
      - http.html:"VMG1312-B10D"
      - http.html:"vmg1312-b10d"
    vendor: zyxel
    verified: true
  tags: discovery,modem,panel,router,tech,zyxel
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - VMG1312-B10D
          - Welcome to the Web-Based Configurator
      - status:
          - 401
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
