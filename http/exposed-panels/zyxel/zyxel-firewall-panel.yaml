id: zyxel-firewall-panel
info:
  name: Zyxel Firewall Panel - Detect
  author: 0x240x23elu
  severity: info
  description: Zyxel Firewall panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:o:zyxel:zywall_vpn50_firmware:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["favicon.ico.image.mmh3"] == "-440644339"
    max-request: 1
    product: zywall_vpn50_firmware
    shodan-query: http.favicon.hash:-440644339
    vendor: zyxel
    verified: true
  tags: discovery,firewall,panel,xyxel
http:
  - extractors:
      - group: 1
        part: body
        regex:
          - <title>(.*)</title>
        type: regex
    matchers:
      - part: body
        type: word
        words:
          - /lib/mode_ana
      - condition: or
        part: body
        type: word
        words:
          - VPN
          - USG
          - ATP
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
