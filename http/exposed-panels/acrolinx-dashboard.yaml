id: acrolinx-dashboard

info:
  name: Acrolinx Analytics - Exposed Panel
  author: ffffffff0x
  severity: info
  description: Acrolinx Analytics panel was detected.
  reference:
    - https://docs.acrolinx.com/coreplatform/latest/en/analytics/acrolinx-analytics-dashboards
  classification:
    cwe-id: CWE-200
  metadata:
    runzero-match: |-
        any(each(service["html.titles"]), {# matches "Acrolinx Dashboard"})
    max-request: 1
    shodan-query: http.title:"Acrolinx Dashboard"
    fofa-query: title=="Acrolinx Dashboard"
    google-query: inurl:"Acrolinx Dashboard"
  tags: acrolinx,panel

http:
  - method: GET
    path:
      - "{{BaseURL}}/dashboard.html"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Acrolinx Dashboard</title>'
          - 'Acrolinx</title>'
        condition: or

      - type: status
        status:
          - 200

