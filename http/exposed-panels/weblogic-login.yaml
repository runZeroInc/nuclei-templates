id: weblogic-login
info:
  name: Oracle WebLogic Login Panel - Detect
  author: bing0o,meme-lord
  severity: info
  description: Oracle WebLogic login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:oracle:weblogic_server:*:*:*:*:-:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)oracle peoplesoft sign-in"})
    fofa-query: title="oracle peoplesoft sign-in"
    google-query: intitle:"oracle peoplesoft sign-in"
    max-request: 1
    product: weblogic_server
    shodan-query:
      - product:"Oracle Weblogic"
      - product:"oracle weblogic"
      - http.title:"oracle peoplesoft sign-in"
    vendor: oracle
  tags: discovery,login,oracle,panel,weblogic
http:
  - extractors:
      - group: 1
        regex:
          - 'WebLogic Server Version: (.*?)<'
        type: regex
    matchers:
      - type: word
        words:
          - WebLogic
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/console/login/LoginForm.jsp'
