id: ibm-note-login
info:
  name: IBM iNotes Login Panel - Detect
  author: dhiyaneshDK,righettod
  severity: info
  description: IBM iNotes login panel was detected.
  reference:
    - https://www.exploit-db.com/ghdb/7122
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:ibm:inotes:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)IBM iNotes Login"})
    max-request: 2
    product: inotes
    shodan-query: http.title:"IBM iNotes Login"
    vendor: ibm
  tags: detect,discovery,edb,ibm,login,panel
http:
  - matchers:
      - condition: or
        type: word
        words:
          - <title>IBM iNotes Login</title>
          - Lotus iNotes Login Screen
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/names.nsf'
      - '{{BaseURL}}/webredir.nsf'
    stop-at-first-match: true
