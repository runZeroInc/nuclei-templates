id: ibm-websphere-panel
info:
  name: IBM WebSphere Portal Login Panel - Detect
  author: pdteam
  severity: info
  description: IBM WebSphere Portal login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:ibm:websphere_portal:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)ibm websphere portal"
    fofa-query: body="ibm websphere portal"
    max-request: 1
    product: websphere_portal
    shodan-query:
      - http.html:"IBM WebSphere Portal"
      - http.html:"ibm websphere portal"
      - cpe:"cpe:2.3:a:ibm:websphere_portal"
    vendor: ibm
  tags: discovery,ibm,panel,websphere
http:
  - host-redirects: true
    matchers:
      - status:
          - 200
        type: status
      - condition: or
        type: word
        words:
          - IBM WebSphere Portal
          - IBMPortalWeb
      - negative: true
        part: header
        regex:
          - 'Content-Location: .+'
        type: regex
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{RootURL}}/wps/portal'
