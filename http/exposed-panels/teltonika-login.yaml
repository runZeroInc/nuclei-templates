id: teltonika-login
info:
  name: Teltonika Login Panel - Detect
  author: idealphase
  severity: info
  description: Teltonika login panel was detected.
  reference:
    - https://teltonika-iot-group.com/
    - https://www.exploit-db.com/ghdb/7819
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:h:teltonika:rut900:*:*:*:*:*:*:*:*
  metadata:
    # auto-generated by nuclei-sync — please review before merging
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Teltonika -Web UI"})
    google-query: intitle:"Teltonika -Web UI" | intitle:"Teltonika-RUT -Web UI" inurl:"/cgi-bin/luci"
    max-request: 1
    product: rut900
    vendor: teltonika
  tags: discovery,edb,panel,teltonika
http:
  - matchers:
      - regex:
          - <title>Teltonika(.*) - Web UI</title>
        type: regex
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/cgi-bin/luci'
