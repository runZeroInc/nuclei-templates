id: hybris-administration-console
info:
  name: Hybris Administration Console Login Panel - Detect
  author: princechaddha
  severity: info
  description: Hybris Administration Console login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:sap:hybris:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)hybris"})
    fofa-query: title="hybris"
    google-query: intitle:"hybris"
    max-request: 1
    product: hybris
    shodan-query:
      - title:"Hybris"
      - http.title:"hybris"
    vendor: sap
    verified: true
  tags: discovery,hybris,panel,sap
http:
  - host-redirects: true
    matchers:
      - part: body
        type: word
        words:
          - hybris administration console
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}/login'
