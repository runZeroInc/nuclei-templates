id: leostream-panel
info:
  name: Leostream Login Panel - Detect
  author: praetorian-thendrickson
  severity: info
  description: Leostream login panel was detected.
  reference:
    - https://leostream.com
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:leostream:connection_broker:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Leostream"})
    max-request: 1
    product: connection_broker
    shodan-query: http.title:"Leostream"
    vendor: leostream
  tags: discovery,leostream,panel
http:
  - matchers:
      - type: word
        words:
          - <title>Leostream</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
