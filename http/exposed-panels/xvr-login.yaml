id: xvr-login
info:
  name: XVR Login Panel - Detect
  author: dhiyaneshDK
  severity: info
  description: XVR login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:h:dahuasecurity:xvr5xxx:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)xvr login"})
    fofa-query: title="xvr login"
    google-query: intitle:"xvr login"
    max-request: 1
    product: xvr5xxx
    shodan-query:
      - http.title:"XVR LOGIN"
      - http.title:"xvr login"
    vendor: dahuasecurity
  tags: dahuasecurity,discovery,panel,xvr
http:
  - matchers:
      - type: word
        words:
          - <title>XVR LOGIN</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/login.rsp'
