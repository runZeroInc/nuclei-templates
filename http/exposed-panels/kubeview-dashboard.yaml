id: kubeview-dashboard
info:
  name: KubeView Dashboard - Detect
  author: ja1sh
  severity: info
  description: |
    KubeView dashboard was detected.
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    runzero-match: service["favicon.ico.image.mmh3"] == "-379154636" || any(each(service["html.titles"]), {# matches "(?i)kubeview"})
    fofa-query:
      - icon_hash=-379154636
      - title="kubeview"
    google-query: intitle:"kubeview"
    max-request: 1
    product: kubeview
    shodan-query:
      - http.favicon.hash:-379154636
      - http.title:"kubeview"
    vendor: kubeview_project
    verified: true
  tags: dashboard,discovery,exposure,k8s,kubernetes,kubeview,kubeview_project,panel
http:
  - matchers:
      - part: body
        type: word
        words:
          - <title>KubeView</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
