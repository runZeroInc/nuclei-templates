id: umbraco-login
info:
  name: Umbraco Login Panel - Detect
  author: ola456,stvnhrlnd
  severity: info
  description: Umbraco login panel was detected.
  reference:
    - https://our.umbraco.com/documentation/Fundamentals/Backoffice/Login/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:umbraco:umbraco_cms:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)umbraco"})
    fofa-query: title="umbraco"
    google-query: intitle:"umbraco"
    max-request: 1
    product: umbraco_cms
    shodan-query:
      - http.title:"Umbraco"
      - http.title:"umbraco"
    vendor: umbraco
    verified: true
  tags: detect,discovery,panel,umbraco
http:
  - host-redirects: true
    matchers:
      - condition: or
        part: body
        type: word
        words:
          - Umbraco.Sys
          - <umb-auth
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 3
    method: GET
    path:
      - '{{BaseURL}}/umbraco'
      - '{{BaseURL}}/umbraco/login'
