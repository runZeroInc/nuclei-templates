id: cwp-webpanel
info:
  name: Control Web Panel Login Panel - Detect
  author: ffffffff0x
  severity: info
  description: Control Web Panel login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:control-webpanel:webpanel:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)CWP \\|用户"})
    fofa-query: title=="CWP |用户" || title=="Login | CentOS WebPanel" || body="CentOS WebPanel"
    max-request: 1
    product: webpanel
    vendor: control-webpanel
  tags: centos,discovery,panel
http:
  - host-redirects: true
    matchers:
      - condition: or
        part: body
        type: word
        words:
          - Login | CentOS WebPanel
          - CWP |用户
          - http://centos-webpanel.com
          - CentOS WebPanel
      - part: header
        type: word
        words:
          - cwpsrv
    matchers-condition: or
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
