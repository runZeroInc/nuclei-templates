id: aviatrix-panel
info:
  name: Aviatrix Cloud Controller Panel
  author: pikpikcu,philippedelteil,daffainfo
  severity: info
  description: An Aviatrix Cloud Controller login panel was detected.
  reference:
    - https://docs.aviatrix.com/HowTos/controller_config.html
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:aviatrix:controller:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)aviatrix cloud controller"})
    fofa-query: title="aviatrix cloud controller"
    google-query: intitle:"aviatrix cloud controller"
    max-request: 1
    product: controller
    shodan-query:
      - http.title:"Aviatrix Cloud Controller"
      - http.title:"aviatrix cloud controller"
    vendor: aviatrix
  tags: aviatrix,discovery,panel
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - <title>Aviatrix
          - Controller</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
