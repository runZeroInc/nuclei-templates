id: powerjob-panel
info:
  name: PowerJob Login Panel - Detect
  author: pikpikcu
  severity: info
  description: PowerJob login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:powerjob:powerjob:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)PowerJob"})
    fofa-query: title="PowerJob"
    max-request: 1
    product: powerjob
    vendor: powerjob
    verified: true
  tags: discovery,panel,powerjob
http:
  - matchers:
      - part: body
        type: word
        words:
          - <title>PowerJob</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
