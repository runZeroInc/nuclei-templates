id: gotify-panel
info:
  name: Gotify Login Panel - Detect
  author: righettod
  severity: info
  description: Gotify login panel was detected.
  reference:
    - https://github.com/gotify/server
  classification:
    cpe: cpe:2.3:a:gotify:server:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)gotify"})
    fofa-query: title="gotify"
    google-query: intitle:"gotify"
    max-request: 1
    product: server
    shodan-query:
      - http.title:"Gotify"
      - http.title:"gotify"
    vendor: gotify
    verified: true
  tags: detect,discovery,gotify,login,panel
http:
  - extractors:
      - group: 1
        part: body
        regex:
          - '"version":"([0-9.]+)"'
        type: regex
    matchers:
      - condition: and
        dsl:
          - status_code == 200
          - contains_any(body, "<title>Gotify", "content=\"Gotify")
        type: dsl
    method: GET
    path:
      - '{{BaseURL}}'
