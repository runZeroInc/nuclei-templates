id: zblogphp-panel
info:
  name: Z-BlogPHP Panel - Detect
  author: princechaddha
  severity: info
  description: Z-BlogPHP panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:zblogcn:zblogphp:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)Z-BlogPHP"
    max-request: 1
    product: zblogphp
    shodan-query: http.html:"Z-BlogPHP"
    vendor: zblogcn
  tags: discovery,panel,zblogphp
http:
  - extractors:
      - group: 1
        part: body
        regex:
          - <meta name="generator" content="([:A-Z-a-z 0-9.]+)"
        type: regex
    matchers:
      - part: body
        type: word
        words:
          - <meta name="generator" content="Z-BlogPHP
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
