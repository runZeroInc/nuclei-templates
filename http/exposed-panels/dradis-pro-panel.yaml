id: dradis-pro-panel
info:
  name: Dradis Professional Edition Login Panel - Detect
  author: righettod
  severity: info
  description: Dradis Professional Edition login panel was detected.
  reference:
    - https://dradisframework.com/ce/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:dradisframework:dradis:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Dradis Professional Edition"})
    max-request: 1
    product: dradis
    shodan-query: title:"Dradis Professional Edition"
    vendor: dradisframework
    verified: true
  tags: discovery,dradis,panel
http:
  - matchers:
      - part: body
        type: word
        words:
          - Dradis Professional Edition
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/pro/login'
