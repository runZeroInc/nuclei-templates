id: plesk-onyx-login
info:
  name: Plesk Login Panel - Detect
  author: dhiyaneshDK,daffainfo,righettod
  severity: info
  description: Plesk login panel was detected.
  reference:
    - https://www.exploit-db.com/ghdb/6501
    - https://www.plesk.com/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:plesk:onyx:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)plesk onyx"
    fofa-query: body="plesk onyx" http.html:"plesk-build"
    google-query:
      - inurl:login_up.php "Plesk Onyx"
      - inurl:login_up.php "plesk onyx"
    max-request: 1
    product: onyx
    shodan-query:
      - http.html:"Plesk Onyx" http.html:"plesk-build"
      - http.html:"plesk onyx" http.html:"plesk-build"
    vendor: plesk
    verified: true
  tags: discovery,edb,login,panel,plesk
http:
  - extractors:
      - group: 1
        part: body
        regex:
          - alt="Plesk Onyx ([0-9.]+)"
          - (?i)"urlArgs":"([0-9.-]+)"
        type: regex
    matchers:
      - case-insensitive: true
        condition: or
        part: body
        type: word
        words:
          - alt="Plesk Onyx
          - plesk-build
          - plesk-revision
          - plesk-root
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/login_up.php'
