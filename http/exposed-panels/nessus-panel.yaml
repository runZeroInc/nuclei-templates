id: nessus-panel
info:
  name: Tenable Nessus Panel - Detect
  author: joanbono,tess
  severity: info
  description: Tenable Nessus panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:tenable:nessus:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)nessus"})
    fofa-query: title="nessus"
    google-query: intitle:"nessus"
    max-request: 2
    product: nessus
    shodan-query:
      - title:"Nessus"
      - http.title:"nessus"
    vendor: tenable
    verified: true
  tags: discovery,nessus,panel,tenable
http:
  - matchers:
      - part: header
        type: word
        words:
          - NessusWWW
      - condition: and
        part: body
        type: word
        words:
          - <title>Nessus</title>
          - window.location = '/unsupported6.html';
    matchers-condition: or
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/server/status'
