id: issabel-login
info:
  name: Issabel Login Panel - Detect
  author: pikpikcu
  severity: info
  description: Issabel login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:issabel:pbx:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Issabel"})
    fofa-query: title="Issabel"
    max-request: 1
    product: pbx
    vendor: issabel
  tags: discovery,issabel,panel
http:
  - matchers:
      - condition: or
        part: body
        type: word
        words:
          - <a href="http://www.issabel.org"
          - <title>Issabel - Login page</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
