id: cloudpanel-login
info:
  name: CloudPanel Login - Detect
  author: DhiyaneshDk
  severity: info
  classification:
    cpe: cpe:2.3:a:mgt-commerce:cloudpanel:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["favicon.ico.image.mmh3"] == "151132309" || any(each(service["html.titles"]), {# matches "(?i)cloudpanel"})
    fofa-query:
      - icon_hash="151132309"
      - title="cloudpanel"
    google-query: intitle:"cloudpanel"
    max-request: 1
    product: cloudpanel
    shodan-query:
      - http.favicon.hash:151132309
      - http.title:"cloudpanel"
      - http.favicon.hash:"151132309"
    vendor: mgt-commerce
    verified: true
  tags: cloudpanel,detect,discovery,login,mgt-commerce,panel
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - CloudPanel | Log In
          - Forgot password
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/login'
