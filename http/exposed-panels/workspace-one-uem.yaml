id: workspace-one-uem
info:
  name: VMware Workspace ONE UEM Airwatch Login Panel - Detect
  author: gevakun,hanlaomo
  severity: info
  description: VMware Workspace ONE UEM Airwatch login panel was detected.
  reference:
    - https://twitter.com/Jhaddix/status/1295861505963909120
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:vmware:workspace_one_uem:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["http.bodies"]), {# matches "(?i)airwatch"})
    fofa-query: body="airwatch"
    max-request: 1
    product: workspace_one_uem
    shodan-query:
      - http.html:"Airwatch"
      - http.html:"airwatch"
    vendor: vmware
    verified: true
  tags: discovery,panel,vmware,workspaceone
http:
  - matchers:
      - condition: or
        # digest: 4a0a00473045022100f4445604a8da4ab2fe05c028120da16041660308b12f530cc895ad4d1044697a02203832f967318d30994139a72ed29779d5eadcdcb00af0155bacd08e85e47dd600:922c64590222798bb761d5b6d8e72950

        part: body
        type: word
        words:
          - About VMware AirWatch
          - /AirWatch/Images
    method: GET
    path:
      - '{{BaseURL}}/AirWatch/Login'
