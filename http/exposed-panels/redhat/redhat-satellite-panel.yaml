id: redhat-satellite-panel
info:
  name: Red Hat Satellite Panel - Detect
  author: princechaddha
  severity: info
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:redhat:satellite:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)redhat"
    max-request: 1
    product: satellite
    shodan-query: http.html:"redhat" "Satellite"
    vendor: redhat
    verified: true
  tags: discovery,panel,redhat,satellite
http:
  - extractors:
      - group: 1
        part: body
        regex:
          - '&quot;version&quot;:&quot;([0-9.]+)&quot;,'
        type: regex
    matchers:
      - condition: and
        part: body
        type: word
        words:
          - Satellite
          - redhat
          - LoginPage
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/users/login'
