id: fortiauthenticator-detect
info:
  name: FortiAuthenticator - Detect
  author: johnk3r
  severity: info
  description: The FortiAuthenticator panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:fortinet:fortiauthenticator:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["favicon.ico.image.mmh3"] == "-1653412201"
    fofa-query: icon_hash=-1653412201
    max-request: 1
    product: fortiauthenticator
    shodan-query: http.favicon.hash:-1653412201
    vendor: fortinet
    verified: true
  tags: detect,discovery,fortiauthenticator,fortinet,panel
http:
  - host-redirects: true
    matchers:
      - condition: and
        part: body
        type: word
        words:
          - list_endpoint
          - schema
          - faccloudhost
      - part: header
        type: word
        words:
          - application/json
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}/api/v1'
