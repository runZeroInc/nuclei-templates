id: fortiweb-login
info:
  name: Fortinet FortiWeb Login Panel - Detect
  author: PR3R00T,daffainfo
  severity: info
  description: Fortinet FortiWeb login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:fortinet:fortiweb:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)fortiweb - "})
    fofa-query: title="fortiweb - "
    google-query: intitle:"fortiweb - "
    max-request: 1
    product: fortiweb
    shodan-query:
      - http.title:"FortiWeb - "
      - http.title:"fortiweb - "
    vendor: fortinet
  tags: discovery,fortinet,fortiweb,login,panel
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - Please login
          - ftnt-fortinet-grid
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/login'
