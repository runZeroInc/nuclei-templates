id: fortinet-fortiddos-panel
info:
  name: Fortinet FortiDDoS Panel
  author: johnk3r
  severity: info
  description: |
    Fortinet FortiDDoS panel was detected.
  reference:
    - https://www.fortinet.com/products/ddos/fortiddos
  classification:
    cpe: cpe:2.3:a:fortinet:fortiddos:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)fortiddos"})
    fofa-query: title="fortiddos"
    google-query: intitle:"fortiddos"
    max-request: 1
    product: fortiddos
    shodan-query:
      - http.title:"FortiDDoS"
      - http.title:"fortiddos"
    vendor: fortinet
    verified: true
  tags: discovery,fortiddos,fortinet,login,panel
http:
  - host-redirects: true
    matchers:
      - part: body
        type: word
        words:
          - <title>FortiDDoS</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 1
    method: GET
    path:
      - '{{BaseURL}}'
