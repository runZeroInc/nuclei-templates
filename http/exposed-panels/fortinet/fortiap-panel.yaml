id: fortiap-panel
info:
  name: FortiAP Login Panel - Detect
  author: DhiyaneshDk
  severity: info
  description: FortiAP login panel was detected.
  reference:
    - https://www.fortinet.com/products/wireless-access-points
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:fortinet:fortiap:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)fortiap"})
    fofa-query: title="fortiap"
    google-query: intitle:"fortiap"
    max-request: 1
    product: fortiap
    shodan-query:
      - title:"FortiAP"
      - http.title:"fortiap"
    vendor: fortinet
    verified: true
  tags: discovery,fortiap,fortinet,panel
http:
  - matchers:
      - type: word
        words:
          - <title>FortiAP</title>
      - part: header
        type: word
        words:
          - text/html
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
