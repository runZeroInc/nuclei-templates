id: fortinet-fortinac-panel
info:
  name: Fortinet FortiNAC Login Panel - Detect
  author: johnk3r
  severity: info
  description: Fortinet FortiNAC login panel was detected.
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:fortinet:fortinac:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)fortinac"})
    fofa-query: title="fortinac"
    google-query: intitle:"fortinac"
    max-request: 1
    product: fortinac
    shodan-query:
      - http.title:"Fortinac"
      - http.title:"fortinac"
    vendor: fortinet
    verified: true
  tags: discovery,fortinac,fortinet,login,panel
http:
  - extractors:
      - part: body
        regex:
          - '"version":"([0-9.]+)"'
        type: regex
    matchers:
      - condition: and
        part: body
        type: word
        words:
          - FortiNAC
          - '"product":'
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/WelcomeActions.jsp?action=ajaxGetWelcomeViewInfo'
