id: fortitester-login-panel
info:
  name: Fortinet FortiTester Login Panel - Detect
  author: DhiyaneshDk
  severity: info
  description: Fortinet FortiTester login panel was detected.
  reference:
    - https://www.fortinet.com/products/fortitester
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:fortinet:fortitester:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)fortitester"})
    fofa-query: title="fortitester"
    google-query: intitle:"fortitester"
    max-request: 2
    product: fortitester
    shodan-query:
      - title:"FortiTester"
      - http.title:"fortitester"
    vendor: fortinet
    verified: true
  tags: discovery,fortinet,panel
http:
  - matchers:
      - type: word
        words:
          - <title>FortiTester</title>
      - part: header
        type: word
        words:
          - text/html
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/auth/login'
      - '{{BaseURL}}/index.html'
    stop-at-first-match: true
