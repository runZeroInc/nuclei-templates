id: fortinet-panel
info:
  name: Fortinet Login Panel - Detect
  author: pikpikcu,daffainfo
  severity: info
  description: Fortinet login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:fortinet:fortiportal:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)FORTINET LOGIN"})
    max-request: 2
    product: fortiportal
    shodan-query: http.title:"FORTINET LOGIN"
    vendor: fortinet
    verified: true
  tags: detect,discovery,fortinet,login,panel
http:
  - host-redirects: true
    matchers:
      - part: body
        type: word
        words:
          - FORTINET LOGIN</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/login'
    stop-at-first-match: true
