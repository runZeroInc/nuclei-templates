id: fortimail-login
info:
  name: Fortinet FortiMail Login Panel - Detect
  author: johnk3r
  severity: info
  description: Fortinet FortiMail login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:fortinet:fortimail:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)fortimail"})
    fofa-query:
      - Fortimail && port=443
      - fortimail && port=443
      - title="fortimail"
    google-query: intitle:"fortimail"
    max-request: 1
    product: fortimail
    shodan-query:
      - title:"Fortimail"
      - http.title:"fortimail"
    vendor: fortinet
  tags: discovery,fortimail,fortinet,login,panel
http:
  - matchers:
      - part: body
        type: word
        words:
          - <title>FortiMail</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/m/'
