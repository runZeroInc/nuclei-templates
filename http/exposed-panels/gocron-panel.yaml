id: gocron-panel
info:
  name: Gocron Panel - Detect
  author: ffffffff0x
  severity: info
  description: Gocron panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:gocron_project:gocron:*:*:*:*:*:*:*:*
  metadata:
    fofa-query: app="gocron-定时任务系统"
    max-request: 1
    product: gocron
    vendor: gocron_project
  tags: discovery,gocron,panel
http:
  - host-redirects: true
    matchers:
      - part: body
        regex:
          - <title>gocron - (.*)</title>
        type: regex
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
