id: dataease-panel
info:
  name: Dataease - Login Panel
  author: DhiyaneshDK
  severity: info
  description: |
    Dataease Login Panel is discovered
  reference:
    - https://github.com/dataease/dataease
  classification:
    cpe: cpe:2.3:a:dataease:dataease:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)dataease"
    fofa-query: body="dataease"
    max-request: 1
    product: dataease
    shodan-query:
      - html:"Dataease"
      - http.html:"dataease"
    vendor: dataease
    verified: true
  tags: dataease,discovery,login,panel
http:
  - matchers:
      - part: body
        type: word
        words:
          - DataEase doesn't work
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/#/login?redirect=%2F'
