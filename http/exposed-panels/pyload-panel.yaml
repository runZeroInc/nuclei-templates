id: pyload-panel
info:
  name: PyLoad Login - Panel
  author: DhiyaneshDk
  severity: info
  description: |
    A Pyload Login was detected.
  reference:
    - https://github.com/pyload/pyload
  classification:
    cpe: cpe:2.3:a:pyload:pyload:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)login - pyload"}) || service["http.body"] matches "(?i)pyload" || any(each(service["html.titles"]), {# matches "(?i)pyload"})
    fofa-query:
      - body="pyload"
      - title="login - pyload"
      - title="pyload"
    google-query:
      - intitle:"pyload"
      - intitle:"login - pyload"
    max-request: 2
    product: pyload
    shodan-query:
      - title:"Login - pyLoad"
      - http.title:"login - pyload"
      - http.html:"pyload"
      - http.title:"pyload"
    vendor: pyload
    verified: true
    zoomeye-query: app="pyLoad"
  tags: discovery,login,panel,pyload
http:
  - host-redirects: true
    matchers:
      - case-insensitive: true
        condition: or
        type: word
        words:
          - Login - pyLoad
          - alt="Pyload
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/login'
    stop-at-first-match: true
