id: docebo-elearning-panel
info:
  name: Docebo eLearning Login Panel - Detect
  author: pikpikcu
  severity: info
  description: Docebo eLearning login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:docebo:docebo:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Docebo E-learning"})
    fofa-query: title="Docebo E-learning"
    max-request: 1
    product: docebo
    vendor: docebo
    verified: true
  tags: discovery,docebo,panel
http:
  - matchers:
      - part: body
        type: word
        words:
          - Docebo E-learning
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
