id: qBittorrent-panel
info:
  name: qBittorrent Web UI Panel - Detect
  author: ritikchaddha
  severity: info
  reference:
    - https://www.qbittorrent.org/
  classification:
    cpe: cpe:2.3:a:qbittorrent:qbittorrent:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)qbittorrent"})
    fofa-query: title="qbittorrent"
    google-query: intitle:"qbittorrent"
    max-request: 1
    product: qbittorrent
    shodan-query:
      - title:"qbittorrent"
      - http.title:"qbittorrent"
    vendor: qbittorrent
    verified: true
  tags: detect,discovery,panel,qbittorrent
http:
  - host-redirects: true
    matchers:
      - condition: or
        part: body
        type: word
        words:
          - qBittorrent Web UI
          - alt="qBittorrent
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
