id: dataiku-panel
info:
  name: Dataiku Panel - Detect
  author: DhiyaneshDk
  severity: info
  description: Dataiku panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:dataiku:data_science_studio:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)dataiku"})
    max-request: 1
    product: data_science_studio
    shodan-query: title:"dataiku"
    vendor: dataiku
    verified: true
  tags: dataiku,discovery,panel
http:
  - matchers:
      - type: word
        words:
          - <title>Dataiku</title>
      - part: header
        type: word
        words:
          - text/html
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
