id: room-alert-detect
info:
  name: AVTECH Room Alert Login Panel - Detect
  author: gy741
  severity: info
  description: AVTECH Room Alert login panel was detected.
  reference:
    - https://avtech.com/articles/166/how-to-access-a-room-alert-monitors-settings-pages-2/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:h:avtech:room_alert_3e:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Room Alert"})
    max-request: 2
    product: room_alert_3e
    shodan-query: title:"Room Alert"
    vendor: avtech
    verified: true
  tags: avtech,discovery,panel,room-alert
http:
  - matchers:
      - condition: or
        part: body
        type: word
        words:
          - Room Alert - Account Log In
          - AVTECH Software, Inc. - Room Alert
          - alt="Room Alert"
      - part: header
        type: word
        words:
          - text/html
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/index.html'
      - '{{BaseURL}}/gateway'
    stop-at-first-match: true
