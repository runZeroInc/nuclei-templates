id: lenovo-fp-panel
info:
  name: Lenovo Fan Power Controller Login Panel - Detect
  author: megamansec
  severity: info
  description: Lenovo Fan Power Controller login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:lenovo:fan_power_controller:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)fan and power controller"
    fofa-query: body="fan and power controller"
    max-request: 2
    product: fan_power_controller
    shodan-query:
      - http.html:"Fan and Power Controller"
      - http.html:"fan and power controller"
    vendor: lenovo
    verified: true
  tags: discovery,lenovo,panel
http:
  - host-redirects: true
    matchers:
      - part: body
        type: word
        words:
          - Avocent Corporation and its affiliates
          - FPC Login
          - Fan and Power Controller
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/login.html'
    stop-at-first-match: true
