id: rancher-panel
info:
  name: Rancher Login Panel - Detect
  author: princechaddha,idealphase,ritikchaddha
  severity: info
  description: Rancher login panel was detected.
  reference:
    - https://github.com/rancher/rancher
    - https://rancher.com/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:suse:rancher:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["favicon.ico.image.mmh3"] == "464587962"
    fofa-query: icon_hash=464587962
    max-request: 1
    product: rancher
    shodan-query: http.favicon.hash:464587962
    vendor: suse
    verified: true
  tags: cloud,devops,discovery,kubernetes,login,panel,rancher,suse
http:
  - extractors:
      - group: 1
        part: body
        regex:
          - <!\-\- ([0-9. ]+)\-\->
        type: regex
    matchers:
      - condition: and
        part: body
        type: word
        words:
          - <title>Loading
          - ember-basic-dropdown-wormhole
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
