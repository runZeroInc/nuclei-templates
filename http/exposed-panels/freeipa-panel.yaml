id: freeipa-panel
info:
  name: FreeIPA Identity Management Login Panel - Detect
  author: DhiyaneshDk
  severity: info
  description: FreeIPA Identity Management login panel was detected.
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:freeipa:freeipa:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)freeipa"
    fofa-query: body="freeipa"
    max-request: 2
    product: freeipa
    shodan-query:
      - html:"FreeIPA"
      - http.html:"freeipa"
    vendor: freeipa
    verified: true
  tags: discovery,freeipa,login,panel
http:
  - matchers:
      - type: word
        words:
          - '''freeipa/'''
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/ipa/ui/'
    redirects: true
    stop-at-first-match: true
