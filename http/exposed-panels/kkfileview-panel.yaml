id: kkfileview-panel
info:
  name: kkFileView Panel - Detect
  author: arafatansari
  severity: info
  description: kkFileView panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:keking:kkfileview:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)kkFileView"})
    max-request: 1
    product: kkfileview
    shodan-query: http.title:"kkFileView"
    vendor: keking
    verified: true
  tags: discovery,kkfileview,panel
http:
  - matchers:
      - type: word
        words:
          - <title>kkFileView演示首页</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/index'
