id: directum-login
info:
  name: Directum Login Panel - Detect
  author: pikpikcu
  severity: info
  description: Directum login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:directum:directum:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Directum"})
    fofa-query: title="Directum"
    max-request: 1
    product: directum
    vendor: directum
  tags: directum,discovery,panel
http:
  - matchers:
      - condition: or
        part: body
        type: word
        words:
          - DIRECTUM Login
          - Directum Login
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/Login.aspx'
