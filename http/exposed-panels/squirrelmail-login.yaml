id: squirrelmail-login
info:
  name: SquirrelMail Login Panel - Detect
  author: dhiyaneshDk,ritikchaddha
  severity: info
  description: SquirrelMail login panel was detected.
  reference:
    - https://www.exploit-db.com/ghdb/7407
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:squirrelmail:squirrelmail:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["favicon.ico.image.mmh3"] == "1511806001" || any([service["http.body"], service["last.http.body"]], {# matches "(?i)squirrelmail"})
    fofa-query: title="squirrelmail"
    google-query: intitle:"squirrelmail"
    max-request: 4
    product: squirrelmail
    shodan-query:
      - title:"SquirrelMail"
      - http.title:"squirrelmail"
      - cpe:"cpe:2.3:a:squirrelmail:squirrelmail"
    vendor: squirrelmail
  tags: discovery,edb,panel,squirrelmail
http:
  - host-redirects: true
    matchers:
      - part: body
        type: word
        words:
          - SquirrelMail
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/src/login.php'
      - '{{BaseURL}}/webmail/src/login.php'
      - '{{BaseURL}}/squirrelmail/src/login.php'
    stop-at-first-match: true
