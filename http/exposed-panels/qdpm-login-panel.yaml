id: qdpm-login-panel
info:
  name: qdPM Login Panel
  author: theamanrawat
  severity: info
  classification:
    cpe: cpe:2.3:a:qdpm:qdpm:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["favicon.ico.image.mmh3"] == "762074255"
    fofa-query: icon_hash=762074255
    max-request: 2
    product: qdpm
    shodan-query: http.favicon.hash:762074255
    vendor: qdpm
    verified: "true"
  tags: discovery,login,panel,qdpm
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - qdPM
          - /index.php/login/restorePassword
      - part: header
        type: word
        words:
          - text/html
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/index.php/login'
    stop-at-first-match: true
