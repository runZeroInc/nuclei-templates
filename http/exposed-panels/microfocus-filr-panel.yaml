id: microfocus-filr-panel
info:
  name: Micro Focus Filr Login Panel - Detect
  author: ritikchaddha,righettod
  severity: info
  description: Micro Focus Filr login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:microfocus:filr:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)micro focus filr"
    fofa-query: body="micro focus filr"
    max-request: 2
    product: filr
    shodan-query:
      - http.html:"Micro Focus Filr"
      - http.html:"micro focus filr"
    vendor: microfocus
    verified: true
  tags: detect,discovery,filr,microfocus,panel
http:
  - extractors:
      - group: 1
        part: body
        regex:
          - (?i)\s+([0-9-]+)\s+Micro\s+Focus
        type: regex
    matchers:
      - condition: or
        part: body
        type: word
        words:
          - Micro Focus Filr
          - Filr Appliance
      - condition: or
        status:
          - 404
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/filr/login'
      - '{{BaseURL}}/login'
    stop-at-first-match: true
