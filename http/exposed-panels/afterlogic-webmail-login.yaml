id: afterlogic-webmail-login
info:
  name: AfterLogic WebMail Login Panel - Detect
  author: johnk3r
  severity: info
  description: AfterLogic WebMail Login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:afterlogic:aurora:*:*:*:*:*:*:*:*
  metadata:
    fofa-query: 'X-Server: AfterlogicDAVServer'
    max-request: 1
    product: aurora
    vendor: afterlogic
  tags: afterlogic,detect,discovery,login,panel
http:
  - matchers:
      - case-insensitive: true
        condition: and
        part: body
        type: word
        words:
          - afterlogic
          - dav_url
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
