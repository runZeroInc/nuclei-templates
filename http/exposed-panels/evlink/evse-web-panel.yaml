id: evse-web-panel
info:
  name: EVSE Web Interface Panel - Detection
  author: ritikchaddha
  severity: info
  classification:
    cpe: cpe:2.3:o:schneider-electric:evlink_charging_station_firmware:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)evse web interface"})
    fofa-query:
      - title="EVSE Web Interface"
      - title="evse web interface"
    google-query: intitle:"evse web interface"
    max-request: 2
    product: evlink_charging_station_firmware
    shodan-query:
      - title:"EVSE Web Interface"
      - http.title:"evse web interface"
    vendor: schneider-electric
    verified: true
  tags: detect,discovery,evlink,evse,login,panel,schneider-electric
http:
  - matchers:
      - condition: or
        part: body
        type: word
        words:
          - EVSE Web Interface</title>
          - Charging station</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/cgi-bin/cgiServer?worker=LoginForm'
    stop-at-first-match: true
