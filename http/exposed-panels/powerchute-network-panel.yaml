id: powerchute-network-panel

info:
  name: PowerChute Network Shutdown - Exposed Panel
  author: DhiyaneshDK
  severity: info
  description: PowerChute Network Shutdown panel was detected.
  metadata:
    runzero-match: |-
        service["http.body"] matches "PowerChute Network Shutdown"
    verified: true
    max-request: 1
    shodan-query: html:"PowerChute Network Shutdown"
  tags: panel,login,powerchute,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>PowerChute Network Shutdown</title>"

      - type: status
        status:
          - 200

