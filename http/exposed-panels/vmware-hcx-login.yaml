id: vmware-hcx-login
info:
  name: VMware HCX Login Panel - Detect
  author: DhiyaneshDk
  severity: info
  description: VMware HCX login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:vmware:vmware_hcx:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)VMware HCX"})
    max-request: 1
    product: vmware_hcx
    shodan-query: title:"VMware HCX"
    vendor: vmware
    verified: true
  tags: discovery,panel,vmware
http:
  - matchers:
      - part: body
        type: word
        words:
          - <title>VMware HCX</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/hybridity/ui/hcx-client/index.html'
