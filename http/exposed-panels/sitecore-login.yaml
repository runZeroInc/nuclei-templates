id: sitecore-login
info:
  name: Sitecore Login Panel - Detect
  author: dhiyaneshDK
  severity: info
  description: Sitecore login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:sitecore:experience_platform:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Welcome to Sitecore"})
    max-request: 1
    product: experience_platform
    shodan-query: http.title:"Welcome to Sitecore"
    vendor: sitecore
  tags: discovery,panel,sitecore
http:
  - matchers:
      - type: word
        words:
          - /sitecore/shell/Themes/Standard/Default/Login.css
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/sitecore/login/default.aspx'
