id: nzbget-panel
info:
  name: NZBGet Login Panel - Detect
  author: DhiyaneshDK
  severity: info
  description: NZBGet login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:nzbget:nzbget:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)nzbget"
    fofa-query: body="nzbget"
    max-request: 1
    product: nzbget
    shodan-query:
      - html:"NZBGet"
      - http.html:"nzbget"
    vendor: nzbget
    verified: true
  tags: discovery,nzbget,panel
http:
  - matchers:
      - type: word
        words:
          - <title>NZBGet</title>
      - part: header
        type: word
        words:
          - text/html
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
