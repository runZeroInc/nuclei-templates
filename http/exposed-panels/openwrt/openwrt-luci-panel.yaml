id: openwrt-luci-panel
info:
  name: Opentwrt luCI - Admin Login Page
  author: For3stCo1d
  severity: info
  description: An Opentwrt admin login page was discovered.
  reference:
    - https://forum.archive.openwrt.org/viewtopic.php?id=16611
  classification:
    cpe: cpe:2.3:a:x-wrt:luci:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)openwrt - luci"})
    fofa-query: title="openwrt - luci"
    google-query: intitle:"openwrt - luci"
    max-request: 1
    product: luci
    shodan-query:
      - http.title:"OpenWrt - LuCI"
      - http.title:"openwrt - luci"
    vendor: x-wrt
  tags: default-login,discovery,openwrt,panel,x-wrt
http:
  - matchers:
      - condition: and
        type: word
        words:
          - OpenWrt
          - LuCI
          - login
    method: GET
    path:
      - '{{BaseURL}}/cgi-bin/luci'
