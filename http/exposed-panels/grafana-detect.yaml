id: grafana-detect
info:
  name: Grafana Login Panel - Detect
  author: organiccrap,AdamCrosser,bhutch
  severity: info
  description: Grafana login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:grafana:grafana:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)grafana"})
    category: devops
    fofa-query:
      - title="grafana"
      - app="grafana"
    google-query: intitle:"grafana"
    max-request: 2
    product: grafana
    shodan-query:
      - title:"Grafana"
      - cpe:"cpe:2.3:a:grafana:grafana"
      - http.title:"grafana"
    vendor: grafana
  tags: detect,discovery,grafana,panel
http:
  - extractors:
      - group: 1
        part: body
        regex:
          - \"version\"\:\"([0-9.]+)\"}
          - \"subTitle\":\"Grafana v([0-9.]+)
        type: regex
      - kval:
          - version
        type: kval
    matchers:
      - part: body
        type: word
        words:
          - <title>Grafana</title>
    method: GET
    path:
      - '{{BaseURL}}/login'
      - '{{BaseURL}}/graph/login'
    stop-at-first-match: true
