id: hivemanager-login-panel
info:
  name: HiveManager Login Panel - Detect
  author: binaryfigments,daffainfo
  severity: info
  description: HiveManager login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:aerohive:hivemanager_classic:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["favicon.ico.image.mmh3"] == "1604363273"
    max-request: 1
    product: hivemanager_classic
    shodan-query: http.favicon.hash:1604363273
    vendor: aerohive
    verified: true
  tags: aerohive,discovery,hivemanager,panel
http:
  - matchers:
      - part: header
        type: word
        words:
          - HiveManager
      - condition: and
        part: body
        type: word
        words:
          - HiveManager
          - alt="Aerohive
    matchers-condition: or
    method: GET
    path:
      - '{{BaseURL}}/hm/login.action'
