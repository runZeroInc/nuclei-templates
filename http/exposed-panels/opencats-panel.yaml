id: opencats-panel
info:
  name: OpenCATS Login Panel - Detect
  author: arafatansari
  severity: info
  description: OpenCATS login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:opencats:opencats:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)opencats"})
    fofa-query: title="opencats"
    google-query: intitle:"opencats"
    max-request: 2
    product: opencats
    shodan-query:
      - title:"opencats"
      - http.title:"opencats"
    vendor: opencats
    verified: true
  tags: discovery,opencats,panel
http:
  - matchers:
      - condition: or
        type: word
        words:
          - <title>opencats - Login</title>
          - <!-- CATS_LOGIN -->
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/opencats/'
    stop-at-first-match: true
