id: arcserve-panel
info:
  name: ArcServe Panel - Detect
  author: DhiyaneshDk
  severity: info
  reference:
    - https://twitter.com/HunterMapping/status/1674267368359444480
    - https://github.com/mdsecactivebreach/CVE-2023-26258-ArcServe
  classification:
    cpe: cpe:2.3:a:arcserve:udp:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["favicon.ico.image.mmh3"] == "-1889244460"
    fofa-query: icon_hash="-1889244460"
    max-request: 1
    product: udp
    shodan-query:
      - http.favicon.hash:-1889244460
      - http.favicon.hash:"-1889244460"
    vendor: arcserve
    verified: true
  tags: arcserve,detect,discovery,login,panel
http:
  - matchers:
      - condition: or
        part: body
        type: word
        words:
          - Arcserve UDP
          - /arcserve.js
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
