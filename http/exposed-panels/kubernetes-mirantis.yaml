id: kubernetes-mirantis
info:
  name: Mirantis Kubernetes Engine Panel - Detect
  author: pussycat0x
  severity: info
  description: Mirantis Kubernetes Engine panel was detected.
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:mirantis:kubernetes_engine:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)Mirantis Kubernetes Engine"
    fofa-query: app="Mirantis-Kubernetes-Engine"
    max-request: 1
    product: kubernetes_engine
    shodan-query: http.html:"Mirantis Kubernetes Engine"
    vendor: mirantis
    verified: true
  tags: devops,discovery,k8s,kube,kubernetes,panel,tech
http:
  - matchers:
      - part: body
        type: word
        words:
          - Mirantis Kubernetes Engine
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
