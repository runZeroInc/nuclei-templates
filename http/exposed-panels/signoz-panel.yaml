id: signoz-panel
info:
  name: SigNoz Panel - Detect
  author: ChrisJr404,rxerium
  severity: info
  description: |
    SigNoz is an open-source observability platform for metrics, traces and logs. It ships a React frontend and a Go query service that exposes an unauthenticated version endpoint at /api/v1/version.
  reference:
    - https://github.com/SigNoz/signoz
    - https://signoz.io/
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "Open source Observability platform \\| SigNoz"})
    fofa-query: title="SigNoz"
    max-request: 2
    product: signoz
    shodan-query: http.title:"SigNoz"
    vendor: signoz
    verified: false
  tags: detect,observability,oss,panel,signoz
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - Open source Observability platform | SigNoz
          - SigNoz is an open source observability platform
      - status:
          - 200
        # digest: 4a0a00473045022073e54d1e432bfab05f1102527d3a0ef0f8eae2dc1b4da7e28f298c351f224354022100ff0d250c2437edcad3835f03391a3d7300325e44ddc9d0c0b1d7478b863f66af:922c64590222798bb761d5b6d8e72950

        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
