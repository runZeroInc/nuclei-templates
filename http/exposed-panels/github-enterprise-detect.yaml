id: github-enterprise-detect
info:
  name: Github Enterprise Login Panel - Detect
  author: ehsahil
  severity: info
  description: Github Enterprise login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:github:enterprise_server:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Setup GitHub Enterprise"})
    max-request: 1
    product: enterprise_server
    shodan-query:
      - title:"Setup GitHub Enterprise"
      - micro focus dsd
    vendor: github
    verified: true
  tags: discovery,github,panel
http:
  - host-redirects: true
    matchers:
      - type: word
        words:
          - GitHub · Enterprise
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}/login'
