id: phppgadmin-panel
info:
  name: phpPgAdmin Login Panel - Detect
  author: Ganofins,Nullfuzz
  severity: info
  description: |
    phpPgAdmin login ipanel was detected.
  reference:
    - https://docs.cpanel.net/cpanel/databases/phppgadmin/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:phppgadmin_project:phppgadmin:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)phppgadmin"})
    fofa-query: title=phppgadmin
    google-query: intitle:phppgadmin
    max-request: 2
    product: phppgadmin
    shodan-query:
      - http.title:phpPgAdmin
      - http.title:phppgadmin
      - cpe:"cpe:2.3:a:phppgadmin_project:phppgadmin"
    vendor: phppgadmin_project
    verified: true
  tags: discovery,panel,phppgadmin,phppgadmin_project
http:
  - matchers:
      - condition: and
        dsl:
          - status_code == 200
          - contains(body, 'intro.php') && contains(body, 'browser.php')
        type: dsl
      - condition: and
        dsl:
          - status_code == 200
          - contains(body, '<title>phpPgAdmin')
        type: dsl
    matchers-condition: or
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/phppgadmin/'
