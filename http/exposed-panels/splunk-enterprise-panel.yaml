id: splunk-enterprise-panel
info:
  name: Splunk Enterprise Login Panel - Detect
  author: praetorian-thendrickson
  severity: info
  description: Splunk Enterprise login panel was detected.
  reference:
    - https://www.splunk.com/en_us/software/splunk-enterprise.html
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:splunk:splunk:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)login - splunk"})
    fofa-query: title="login - splunk"
    google-query: intitle:"login - splunk"
    max-request: 1
    product: splunk
    shodan-query:
      - http.title:"Login - Splunk"
      - http.title:"login - splunk"
    vendor: splunk
  tags: discovery,panel,splunk
http:
  - extractors:
      - group: 1
        part: body
        regex:
          - '"version": "(.*)"'
          - 'versionNumber": "([0-9.]+)"'
          - '"VERSION_LABEL": "([0-9.]+)"'
        type: regex
    host-redirects: true
    matchers:
      - type: word
        words:
          - Splunk Inc.
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/en-US/account/login'
