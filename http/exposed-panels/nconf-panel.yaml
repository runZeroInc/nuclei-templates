id: nconf-panel
info:
  name: NConf Login Panel - Detect
  author: ritikchaddha
  severity: info
  description: NConf login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:nconf_project:nconf:*:*:*:*:node.js:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)nconf"})
    max-request: 1
    product: nconf
    shodan-query: http.title:"nconf"
    vendor: nconf_project
    verified: true
  tags: discovery,nconf,panel
http:
  - matchers:
      - condition: or
        part: body
        type: word
        words:
          - nconf.js
          - <title>NConf
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
