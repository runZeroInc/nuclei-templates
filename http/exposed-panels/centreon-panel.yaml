id: centreon-panel
info:
  name: Centreon Login Panel - Detect
  author: pikpikcu,daffainfo
  severity: info
  description: Centreon login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:centreon:centreon_web:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)centreon"})
    fofa-query: title="centreon"
    google-query: intitle:"centreon"
    max-request: 1
    product: centreon_web
    shodan-query:
      - http.title:"Centreon"
      - http.title:"centreon"
    vendor: centreon
  tags: centreon,discovery,login,panel
http:
  - extractors:
      - group: 1
        part: body
        regex:
          - v. (.*)
        type: regex
    matchers:
      - condition: or
        part: body
        type: word
        words:
          - <title>Centreon - IT & Network Monitoring</title>
          - <input name="centreon_token" type="hidden"
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/centreon/index.php'
