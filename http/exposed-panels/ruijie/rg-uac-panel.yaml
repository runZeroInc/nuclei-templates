id: rg-uac-panel
info:
  name: Ruijie RG-UAC Login Panel - Detect
  author: princechaddha
  severity: info
  description: Ruijie RG-UAC login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:o:ruijie:rg-uac_firmware:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)get_verify_info"
    fofa-query: body="get_verify_info"
    max-request: 1
    product: rg-uac_firmware
    shodan-query:
      - http.html:"Get_Verify_Info"
      - http.html:"get_verify_info"
    vendor: ruijie
  tags: discovery,firewall,panel,router,ruijie
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - dkey_check.php
          - get_dkey_passwd
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
