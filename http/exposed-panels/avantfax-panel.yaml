id: avantfax-panel
info:
  name: AvantFAX Login Panel
  author: pikpikcu,daffainfo
  severity: info
  description: An AvantFAX login panel was discovered.
  reference:
    - http://www.avantfax.com/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-668
    cpe: cpe:2.3:a:avantfax:avantfax:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)avantfax - login"})
    fofa-query: title="avantfax - login"
    google-query: intitle:"avantfax - login"
    max-request: 1
    product: avantfax
    shodan-query:
      - http.title:"AvantFAX - Login"
      - http.title:"avantfax - login"
    vendor: avantfax
  tags: avantfax,discovery,login,panel
http:
  - extractors:
      - group: 1
        part: body
        regex:
          - <p align="center">([0-9.]+)<\/p>
        type: regex
    matchers:
      - part: body
        type: word
        words:
          - <title>- AvantFAX - Login</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
