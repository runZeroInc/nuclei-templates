id: rabbitmq-dashboard
info:
  name: RabbitMQ Management Panel - Detect
  author: fyoorer,FLX
  severity: info
  description: RabbitMQ Management panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:vmware:rabbitmq:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    product: rabbitmq
    shodan-query: cpe:"cpe:2.3:a:vmware:rabbitmq"
    vendor: vmware
  tags: discovery,panel,rabbitmq,vmware
flow: http(1) && http(2)
http:
  - matchers:
      - part: body
        type: word
        words:
          - RabbitMQ Management
    method: GET
    path:
      - '{{BaseURL}}'
  - extractors:
      - group: 1
        name: version
        part: body
        regex:
          - ([0-9]+\.[0-9]+\.[0-9]+)
        # digest: 490a00463044022051377c6338714584b8918d31ee3c94b9bb105a29f668ec75e7ad3c7f3c671bc402202bc5f651348c6ce73902aeb9c4af383b9e058cc9ddf5ea69ed60ad7b29bd7e9b:922c64590222798bb761d5b6d8e72950

        type: regex
    matchers:
      - status:
          - 200
        type: status
      - condition: and
        dsl:
          - contains(content_type, "application/json")
          - regex("^\"?[0-9]+\\.[0-9]+\\.[0-9]+", body)
        type: dsl
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/api/version'
