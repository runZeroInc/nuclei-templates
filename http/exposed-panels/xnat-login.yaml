id: xnat-login
info:
  name: XNAT Login Panel - Detect
  author: 0x_Akoko
  severity: info
  description: XNAT login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:xnat:xnat:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)xnat"})
    max-request: 1
    product: xnat
    shodan-query: title:"xnat"
    vendor: xnat
    verified: true
  tags: discovery,panel,xnat
http:
  - matchers:
      - type: word
        words:
          - <title>XNAT</title>
      - part: header
        type: word
        words:
          - text/html
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/app/template/Login.vm'
