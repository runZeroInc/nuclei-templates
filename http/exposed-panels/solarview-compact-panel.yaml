id: solarview-compact-panel
info:
  name: SolarView Compact Panel - Detect
  author: princechaddha
  severity: info
  description: SolarView Compact panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:o:contec:solarview_compact_firmware:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)solarview compact" || service["favicon.ico.image.mmh3"] == "-244067125"
    fofa-query:
      - body="solarview compact" && title="top"
      - icon_hash="-244067125"
      - body="solarview compact"
    max-request: 1
    product: solarview_compact_firmware
    shodan-query:
      - http.html:"SolarView Compact"
      - http.favicon.hash:"-244067125"
      - http.html:"solarview compact"
      - cpe:"cpe:2.3:o:contec:solarview_compact_firmware"
    vendor: contec
    verified: true
  tags: contec,discovery,iot,panel,solarview
http:
  - matchers:
      - part: body
        type: word
        words:
          - SolarViewCompact
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/Solar_Menu.php'
