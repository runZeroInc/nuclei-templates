id: fortisandbox-panel
info:
  name: FortiSandbox Panel - Detect
  author: rxerium
  severity: info
  description: |
    Detected exposed FortiSandbox login and management interfaces.
  reference:
    - https://www.fortinet.com/content/dam/fortinet/assets/data-sheets/FortiSandbox.pdf
  metadata:
    # auto-generated by nuclei-sync — please review before merging
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)FortiSandbox"})
    max-request: 1
    product: fortisandbox
    shodan-query: http.title:"FortiSandbox"
    vendor: fortinet
    verified: true
  tags: discovery,fortinet,fortisandbox,login,panel
http:
  - method: GET
    path:
      - "{{BaseURL}}/ng/login?returnUrl=%2F"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>FortiSandbox'
          - '<span>FortiSandbox'
      - type: status
        status:
          - 200
