id: aptus-panel
info:
  name: Aptus Login - Panel Detect
  author: princechaddha
  severity: info
  description: Aptus login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:intelliantech:aptus:*:*:*:*:android:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Aptus Login"})
    max-request: 1
    product: aptus
    shodan-query: http.title:"Aptus Login"
    vendor: intelliantech
  tags: aptus,discovery,panel
http:
  - matchers:
      - part: body
        type: word
        words:
          - <title>Aptus Login</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
