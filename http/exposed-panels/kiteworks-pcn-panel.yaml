id: kiteworks-pcn-panel
info:
  name: Kiteworks PCN Panel - Detect
  author: righettod
  severity: info
  description: |
    Kiteworks PCN Login Panel was detected.
  reference:
    - https://www.kiteworks.com/platform/private-content-network/
  classification:
    cpe: cpe:2.3:a:accellion:kiteworks:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["favicon.ico.image.mmh3"] == "-1215318992"
    fofa-query: icon_hash=-1215318992
    max-request: 1
    product: kiteworks
    shodan-query: http.favicon.hash:-1215318992
    vendor: accellion
    verified: true
  tags: accellion,detect,discovery,kiteworks,login,panel
http:
  - matchers:
      - case-insensitive: true
        condition: and
        part: body
        type: word
        words:
          - Secured by Kiteworks
          - Return to sign in
      - part: header
        type: word
        words:
          - application/octet-stream
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/login/locales/login_en.json'
