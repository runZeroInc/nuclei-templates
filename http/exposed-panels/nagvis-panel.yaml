id: nagvis-panel
info:
  name: NagVis Login Panel - Detect
  author: ritikchaddha
  severity: info
  description: NagVis login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:nagvis:nagvis:*:*:*:*:nagios_xi:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)nagvis"
    fofa-query: body="nagvis"
    max-request: 2
    product: nagvis
    shodan-query:
      - http.html:"NagVis"
      - http.html:"nagvis"
    vendor: nagvis
    verified: true
  tags: discovery,nagvis,panel
http:
  - host-redirects: true
    matchers:
      - condition: or
        part: body
        type: word
        words:
          - /nagvis/userfiles
          - <title>NagVis
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/nagvis/frontend/nagvis-js/index.php'
    stop-at-first-match: true
