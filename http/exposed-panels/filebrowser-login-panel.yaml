id: filebrowser-login-panel
info:
  name: File Browser Login Panel - Detect
  author: ritikchaddha
  severity: info
  reference:
    - https://filebrowser.org/
  classification:
    cpe: cpe:2.3:a:filebrowser:filebrowser:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["favicon.ico.image.mmh3"] == "1052926265"
    fofa-query: icon_hash=1052926265
    max-request: 3
    product: filebrowser
    shodan-query: http.favicon.hash:1052926265
    vendor: filebrowser
    verified: true
  tags: detect,discovery,filebrowser,panel
http:
  - host-redirects: true
    matchers:
      - condition: or
        part: body
        type: word
        words:
          - File Browser</title>
          - window.FileBrowser
      - dsl:
          - status_code==200 && ('1052926265' == mmh3(base64_py(body)))
        type: dsl
    matchers-condition: or
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/login'
      - '{{BaseURL}}/static/img/icons/favicon-32x32.png'
    stop-at-first-match: true
