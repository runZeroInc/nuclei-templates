id: dzzoffice-install
info:
  name: DzzOffice Installation Panel - Detect
  author: ritikchaddha
  severity: high
  description: DzzOffice installation panel was detected.
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-200
    cpe: cpe:2.3:a:dzzoffice:dzzoffice:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["favicon.ico.image.mmh3"] == "-1961736892"
    fofa-query:
      - title="dzzoffice"
      - icon_hash=-1961736892
    max-request: 1
    product: dzzoffice
    shodan-query: http.favicon.hash:-1961736892
    vendor: dzzoffice
    verified: true
  tags: discovery,dzzoffice,install,panel
http:
  - matchers:
      - part: body
        type: word
        words:
          - DzzOffice
      - condition: or
        part: body
        type: word
        words:
          - 简体中文 UTF8 版
          - Simplified Chinese UTF8 version
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/install/index.php'
