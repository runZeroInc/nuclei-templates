id: dzzoffice-panel
info:
  name: DzzOffice Login Panel - Detect
  author: ritikchaddha
  severity: info
  description: DzzOffice login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    runzero-match: service["favicon.ico.image.mmh3"] == "-1961736892"
    fofa-query:
      - title="dzzoffice"
      - icon_hash=-1961736892
    max-request: 3
    product: dzzoffice
    shodan-query: http.favicon.hash:-1961736892
    vendor: dzzoffice
    verified: true
  tags: discovery,dzzoffice,panel
http:
  - host-redirects: true
    matchers:
      - condition: or
        part: body
        type: word
        words:
          - content="DzzOffice
          - DZZSCRIPT
          - dzzoffice.com
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/index.php'
      - '{{BaseURL}}/user.php?mod=login'
    stop-at-first-match: true
