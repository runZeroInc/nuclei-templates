id: casdoor-login
info:
  name: Casdoor Login Panel - Detect
  author: princechaddha
  severity: info
  description: Casdoor login panel was detected.
  reference:
    - https://casdoor.org/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:casbin:casdoor:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)casdoor"})
    fofa-query: title="casdoor"
    google-query: intitle:"casdoor"
    max-request: 1
    product: casdoor
    shodan-query:
      - http.title:"Casdoor"
      - http.title:"casdoor"
    vendor: casbin
  tags: casbin,casdoor,discovery,panel
http:
  - matchers:
      - part: body
        type: word
        words:
          - <title>Casdoor</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/login'
