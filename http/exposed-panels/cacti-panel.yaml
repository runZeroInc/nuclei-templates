id: cacti-panel
info:
  name: Cacti Login Panel - Detect
  author: geeknik,daffainfo
  severity: info
  description: Cacti login panel was detected.
  reference:
    - https://www.cacti.net/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:cacti:cacti:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["favicon.ico.image.mmh3"] == "-1797138069" || any(each(service["html.titles"]), {# matches "(?i)login to cacti"}) || any(each(service["html.titles"]), {# matches "(?i)cacti"})
    fofa-query:
      - icon_hash="-1797138069"
      - title="cacti"
      - title="login to cacti"
    google-query:
      - intitle:"login to cacti"
      - intitle:"cacti"
    max-request: 2
    product: cacti
    shodan-query:
      - http.favicon.hash:-1797138069
      - http.title:"login to cacti"
      - http.title:"cacti"
      - http.favicon.hash:"-1797138069"
    vendor: cacti
    verified: true
  tags: cacti,detect,discovery,login,panel
http:
  - extractors:
      - group: 1
        part: body
        regex:
          - <div class='versionInfo'>Version (.*) |
        type: regex
    matchers:
      - condition: or
        part: body
        type: word
        words:
          - <title>Login to Cacti</title>
          - The Cacti Group
      - part: header
        regex:
          - Cacti+
        type: regex
    matchers-condition: or
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/cacti/'
    stop-at-first-match: true
