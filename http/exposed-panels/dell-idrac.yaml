id: dell-idrac
info:
  name: Dell IDRAC Panel - Detect
  author: kazet
  severity: info
  description: Dell IDRAC panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:dell:emc_idrac_service_module:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)thisIDRACText"
    max-request: 2
    product: emc_idrac_service_module
    shodan-query: html:"thisIDRACText"
    vendor: dell
    verified: true
  tags: dell,detect,discovery,idrac,panel
http:
  - matchers:
      - condition: or
        part: body
        type: word
        words:
          - <idrac-start-screen
          - thisIDRACText
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/restgui/start.html'
      - '{{BaseURL}}/login.html'
    stop-at-first-match: true
