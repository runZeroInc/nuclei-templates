id: icewarp-panel-detect
info:
  name: IceWarp Login Panel - Detect
  author: ritikchaddha
  severity: info
  description: IceWarp login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:icewarp:icewarp_server:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)icewarp"})
    fofa-query: title="icewarp"
    google-query: intitle:"icewarp"
    max-request: 1
    product: icewarp_server
    shodan-query:
      - title:"icewarp"
      - http.title:"icewarp"
    vendor: icewarp
    verified: true
  tags: discovery,icewarp,panel
http:
  - extractors:
      - group: 1
        part: header
        regex:
          - 'Server: (.{4,20})'
        type: regex
    matchers:
      - part: header
        type: word
        words:
          - IceWarp
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/webmail/'
