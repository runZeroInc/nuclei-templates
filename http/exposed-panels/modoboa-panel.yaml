id: modoboa-panel
info:
  name: Modoboa Login Panel - Detect
  author: kh4sh3i
  severity: info
  description: Modoboa login panel was detected.
  reference:
    - https://github.com/modoboa/modoboa
    - https://modoboa.org
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:modoboa:modoboa:*:*:*:*:modoboa:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)modoboa" || service["favicon.ico.image.mmh3"] == "1949005079"
    fofa-query:
      - body="modoboa"
      - icon_hash=1949005079
    max-request: 2
    product: modoboa
    shodan-query:
      - http.favicon.hash:1949005079
      - http.html:"modoboa"
    vendor: modoboa
    verified: true
  tags: discovery,mail,modoboa,panel
http:
  - host-redirects: true
    matchers:
      - case-insensitive: true
        part: body
        type: word
        words:
          - Welcome to Modoboa
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/accounts/login/?next=/'
    stop-at-first-match: true
