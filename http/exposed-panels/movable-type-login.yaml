id: movable-type-login
info:
  name: Movable Type Pro Login Panel - Detect
  author: dhiyaneshDk
  severity: info
  description: Movable Type Pro login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:sixapart:movable_type:*:*:*:*:-:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)サインイン \\| movable type pro"})
    fofa-query: title="サインイン | movable type pro"
    google-query: intitle:"サインイン | movable type pro"
    max-request: 2
    product: movable_type
    shodan-query:
      - title:"サインイン | Movable Type Pro"
      - cpe:"cpe:2.3:a:sixapart:movable_type"
      - http.title:"サインイン | movable type pro"
    vendor: sixapart
  tags: discovery,movable,panel,sixapart
http:
  - matchers:
      - part: body
        type: word
        words:
          - Movable Type Pro
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/mt/admin'
      - '{{BaseURL}}/mt.cgi'
    stop-at-first-match: true
