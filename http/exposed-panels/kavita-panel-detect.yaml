id: kavita-panel-detect
info:
  name: Kavita Login Panel - Detect
  author: ritikchaddha
  severity: info
  description: |
    Kavita login panel was detected.
  reference:
    - https://github.com/kareadita/kavita
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)kavita"})
    fofa-query: title="kavita"
    google-query: intitle:"kavita"
    max-request: 1
    product: kavita
    shodan-query: http.title:"kavita"
    vendor: kavitareader
    verified: true
  tags: discovery,kavita,panel
http:
  - matchers:
      - part: body
        type: word
        words:
          - <title>Kavita
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/login'
