id: rdweb-panel
info:
  name: RD Web Access Panel - Detect
  author: rxerium,sorrowx3
  severity: info
  description: |
    RD web access panel was discovered.
  reference:
    - https://rdweb.wvd.microsoft.com/webclient
  classification:
    cpe: cpe:2.3:a:microsoft:remote_desktop:*:*:*:*:android:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)rd web access"
    fofa-query: body="rd web access"
    max-request: 1
    product: remote_desktop
    shodan-query:
      - html:"RD Web Access"
      - http.html:"rd web access"
    vendor: microsoft
    verified: true
  tags: Microsoft,detect,discovery,login,microsoft,panel,rdp,web-access
http:
  - host-redirects: true
    matchers:
      - part: header
        type: word
        words:
          - TSWAFeatureCheckCookie=true; path=/RDWeb/
      - condition: and
        part: response
        type: word
        words:
          - <rdp-client-top-view>
          - Microsoft Remote Desktop
    matchers-condition: or
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}/RDWeb/'
