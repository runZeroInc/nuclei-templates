id: cisco-telepresence
info:
  name: Cisco TelePresence Login Panel - Detect
  author: dhiyaneshDk
  severity: info
  description: Cisco TelePresence login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:cisco:telepresence_tc:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Cisco Telepresence"})
    max-request: 1
    product: telepresence_tc
    shodan-query: http.title:"Cisco Telepresence"
    vendor: cisco
    verified: true
  tags: cisco,discovery,panel
http:
  - host-redirects: true
    matchers:
      - part: body
        type: word
        words:
          - 'Cisco TelePresence MCU - login:'
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}/login.html'
