id: cisco-edge-340
info:
  name: Cisco Edge 340 Panel - Detect
  author: dhiyaneshDk
  severity: info
  description: Cisco Edge 340 panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:o:cisco:edge_340_firmware:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)cisco edge 340"})
    fofa-query: title="cisco edge 340"
    google-query: intitle:"cisco edge 340"
    max-request: 1
    product: edge_340_firmware
    shodan-query:
      - http.title:"Cisco Edge 340"
      - http.title:"cisco edge 340"
    vendor: cisco
  tags: cisco,discovery,panel
http:
  - matchers:
      - part: body
        type: word
        words:
          - <title>Cisco Edge 340</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/auth/?next=%2F'
