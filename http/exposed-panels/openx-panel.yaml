id: openx-panel
info:
  name: OpenX/Revive Adserver Login Panel - Detect
  author: pikpikcu,righettod
  severity: info
  description: OpenX login panel was detected. Note that OpenX is now a Revive Adserver.
  reference:
    - https://www.revive-adserver.com/download/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:revive-adserver:revive_adserver:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)revive adserver"}) || service["favicon.ico.image.mmh3"] == "106844876"
    fofa-query:
      - icon_hash=106844876
      - title="revive adserver"
    google-query: intitle:"revive adserver"
    max-request: 2
    product: revive_adserver
    shodan-query:
      - title:"Revive Adserver"
      - http.title:"revive adserver"
      - http.favicon.hash:106844876
    vendor: revive-adserver
    verified: true
  tags: adserver,discovery,login,openx,panel,revive,revive-adserver
http:
  - extractors:
      - group: 1
        part: body
        regex:
          - (.*)- http://www.openx.org
        type: regex
      - group: 1
        part: body
        regex:
          - v=([0-9a-z.\-]+)
        type: regex
    matchers:
      - condition: or
        part: body
        regex:
          - <title>OpenX</title>
          - <title>Revive Adserver</title>
        type: regex
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/www/admin/index.php'
      - '{{BaseURL}}/admin/index.php'
    stop-at-first-match: true
