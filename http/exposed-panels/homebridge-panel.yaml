id: homebridge-panel

info:
  name: Homebridge - Exposed Panel
  author: rxerium
  severity: info
  description: Homebridge panel was detected.
  reference:
    - https://homebridge.io/
    - https://github.com/homebridge
  metadata:
    runzero-match: |-
        any(each(service["html.titles"]), {# matches "Homebridge"})
    verified: true
    max-request: 1
    shodan-query: title:"Homebridge"
  tags: panel,homebridge,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Homebridge</title>'

      - type: status
        status:
          - 200

