id: gitlab-detect
info:
  name: Gitlab Login Panel - Detect
  author: ehsahil
  severity: info
  description: Gitlab login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:gitlab:gitlab:*:*:*:*:community:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)gitlab"})
    fofa-query: title="gitlab"
    google-query: intitle:"gitlab"
    max-request: 1
    product: gitlab
    shodan-query:
      - http.title:"GitLab"
      - cpe:"cpe:2.3:a:gitlab:gitlab"
      - http.title:"gitlab"
    vendor: gitlab
  tags: discovery,gitlab,panel
http:
  - host-redirects: true
    matchers:
      - condition: and
        type: word
        words:
          - GitLab
          - https://about.gitlab.com
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}/users/sign_in'
