id: daybyday-panel
info:
  name: DaybydayCRM Login Panel - Detect
  author: pikpikcu,daffainfo
  severity: info
  description: DaybydayCRM login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:daybydaycrm:daybyday:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)daybyday"})
    fofa-query: title="daybyday"
    google-query: intitle:"daybyday"
    max-request: 1
    product: daybyday
    shodan-query:
      - http.title:"Daybyday"
      - http.title:"daybyday"
    vendor: daybydaycrm
  tags: daybyday,daybydaycrm,discovery,panel
http:
  - matchers:
      - part: body
        type: word
        words:
          - <title>Daybyday - Login</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/login'
