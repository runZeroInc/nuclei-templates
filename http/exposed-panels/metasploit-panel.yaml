id: metasploit-panel
info:
  name: Metasploit Panel - Detect
  author: lu4nx
  severity: info
  description: |
    Metasploit Web Panel is detected
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:rapid7:metasploit:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)metasploit"}) || any(each(service["html.titles"]), {# matches "(?i)metasploit - setup and configuration"})
    fofa-query:
      - title="metasploit"
      - title="metasploit - setup and configuration"
    google-query:
      - intitle:"metasploit"
      - intitle:"metasploit - setup and configuration"
    max-request: 1
    product: metasploit
    shodan-query:
      - http.title:"metasploit"
      - http.title:"metasploit - setup and configuration"
    vendor: rapid7
    verified: true
    zoomeye-query: app="Metasploit"
  tags: discovery,login,metasploit,panel,rapid7
http:
  - matchers:
      - part: body
        type: word
        words:
          - <title>Metasploit</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/login'
