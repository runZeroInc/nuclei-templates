id: intelbras-login
info:
  name: Intelbras Router Login Panel - Detect
  author: DhiyaneshDK
  severity: info
  description: Intelbras router logjn panel was detected.
  reference:
    - https://www.exploit-db.com/ghdb/7272
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:h:intelbras:iwr_3000n:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Intelbras"})
    google-query: intitle:"Intelbras" "All Rights Reserved" -.com
    max-request: 1
    product: iwr_3000n
    shodan-query: http.title:"Intelbras"
    vendor: intelbras
  tags: discovery,edb,panel
http:
  - matchers:
      - type: word
        words:
          - <title>Intelbras</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/login.html'
