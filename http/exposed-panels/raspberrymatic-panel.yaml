id: raspberrymatic-panel
info:
  name: RaspberryMatic Login Panel - Detect
  author: princechaddha
  severity: info
  description: RaspberryMatic login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:o:raspberrymatic:raspberrymatic:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["favicon.ico.image.mmh3"] == "-578216669"
    max-request: 1
    product: raspberrymatic
    shodan-query: http.favicon.hash:-578216669
    vendor: raspberrymatic
  tags: discovery,iot,panel,raspberrymatic
http:
  - host-redirects: true
    matchers:
      - part: body
        type: word
        words:
          - <title>RaspberryMatic WebUI</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}/login.htm'
