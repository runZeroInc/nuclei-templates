id: pichome-panel
info:
  name: Pichome Login Panel - Detect
  author: ritikchaddha
  severity: info
  description: Pichome login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:oaooa:pichome:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["favicon.ico.image.mmh3"] == "933976300"
    max-request: 2
    product: pichome
    shodan-query: http.favicon.hash:933976300
    vendor: oaooa
    verified: true
  tags: discovery,panel,pichome
http:
  - host-redirects: true
    matchers:
      - condition: or
        part: body
        type: word
        words:
          - Powered By oaooa PicHome
          - content="oaooa"
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/user.php?mod=login'
    stop-at-first-match: true
