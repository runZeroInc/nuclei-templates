id: pichome-panel

info:
  name: PicHome - Exposed Panel
  author: ritikchaddha
  severity: info
  description: PicHome panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:oaooa:pichome:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: |-
        service["favicon.ico.image.mmh3"] == "933976300"
    verified: true
    max-request: 2
    shodan-query: http.favicon.hash:933976300
    product: pichome
    vendor: oaooa
  tags: pichome,panel

http:
  - method: GET
    path:
      - "{{BaseURL}}"
      - "{{BaseURL}}/user.php?mod=login"

    stop-at-first-match: true
    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Powered By oaooa PicHome'
          - 'content="oaooa"'
        condition: or

      - type: status
        status:
          - 200

