id: odoo-database-manager
info:
  name: Odoo - Database Manager Discovery
  author: __Fazal,R3dg33k
  severity: low
  description: Odoo database manager was discovered.
  classification:
    cpe: cpe:2.3:a:odoo:odoo:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)odoo"})
    fofa-query: title="odoo"
    google-query: intitle:"odoo"
    max-request: 1
    product: odoo
    shodan-query:
      - title:"Odoo"
      - http.title:"odoo"
      - cpe:"cpe:2.3:a:odoo:odoo"
    vendor: odoo
    verified: true
  tags: backup,discovery,odoo,panel
http:
  - matchers:
      - condition: and
        type: word
        words:
          - <title>Odoo</title>
          - .o_database_delete
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/web/database/manager'
