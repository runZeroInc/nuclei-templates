id: dotclear-panel
info:
  name: Dotclear Admin Login Panel - Detect
  author: pikpikcu,daffainfo
  severity: info
  description: Dotclear admin login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:dotclear:dotclear:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)dotclear"})
    fofa-query: title="dotclear"
    google-query: intitle:"dotclear"
    max-request: 2
    product: dotclear
    shodan-query:
      - http.title:"Dotclear"
      - http.title:"dotclear"
    vendor: dotclear
  tags: discovery,dotclear,panel
http:
  - matchers:
      - condition: or
        type: word
        words:
          - <body id="dotclear-admin" class="auth">
          - <title>Dotclear</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/dc2/admin/auth.php'
      - '{{BaseURL}}/auth.php'
