id: faraday-login
info:
  name: Faraday Login Panel - Detect
  author: dhiyaneshDK
  severity: info
  description: Faraday login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:faraday_project:faraday:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)faradayApp"
    max-request: 1
    product: faraday
    shodan-query: html:"faradayApp"
    vendor: faraday_project
  tags: discovery,faraday,panel
http:
  - matchers:
      - type: word
        words:
          - ng-app="faradayApp">
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/#/login'
