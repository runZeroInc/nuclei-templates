id: amcrest-login
info:
  name: Amcrest Login
  author: DhiyaneshDK
  severity: info
  description: An Amcrest LDAP user login was discovered.
  reference:
    - https://www.exploit-db.com/ghdb/7273
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:h:amcrest:ip2m-853ew:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)amcrest"
    fofa-query:
      - body="amcrest" "ldap user"
      - body="amcrest"
    google-query:
      - intext:"amcrest" "LDAP User"
      - intext:"amcrest" "ldap user"
    max-request: 1
    product: ip2m-853ew
    shodan-query:
      - html:"amcrest"
      - http.html:"amcrest" "ldap user"
      - http.html:"amcrest"
    vendor: amcrest
  tags: amcrest,camera,discovery,edb,panel
http:
  - matchers:
      - condition: and
        type: word
        words:
          - Amcrest Technologies
          - LDAPUser
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
