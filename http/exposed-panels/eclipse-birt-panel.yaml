id: eclipse-birt-panel
info:
  name: Eclipse BIRT Panel - Detect
  author: Shiva (Strobes Security)
  severity: info
  description: Eclipse BIRT (Business Intelligence Reporting Tool) detected
  reference:
    - https://eclipse.github.io/birt-website/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:eclipse:business_intelligence_and_reporting_tools:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Eclipse BIRT Home"})
    google-query: intitle:"Eclipse BIRT Home"
    max-request: 2
    product: business_intelligence_and_reporting_tools
    shodan-query: title:"Eclipse BIRT Home"
    vendor: eclipse
    verified: true
  tags: detect,discovery,eclipsebirt,panel
http:
  - extractors:
      - group: 1
        part: body
        regex:
          - 'Viewer Version : ([0-9.-]+)'
        type: regex
    host-redirects: true
    matchers:
      - case-insensitive: true
        condition: or
        type: word
        words:
          - alt="Eclipse Logo
          - Eclipse BIRT Home
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/reportviewer/'
      - '{{BaseURL}}/birt/'
      - '{{BaseURL}}/birt-viewer/'
    stop-at-first-match: true
