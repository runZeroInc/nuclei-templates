id: bitwarden-vault-panel
info:
  name: Bitwarden Web Vault Login Panel - Detect
  author: ritikchaddha
  severity: info
  reference:
    - https://bitwarden.com/
  classification:
    cpe: cpe:2.3:a:bitwarden:bitwarden:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)bitwarden web vault"})
    fofa-query: title="bitwarden web vault"
    google-query: intitle:"bitwarden web vault"
    max-request: 1
    product: bitwarden
    shodan-query:
      - title:"Bitwarden Web Vault"
      - http.title:"bitwarden web vault"
    vendor: bitwarden
    verified: true
  tags: bitwarden,detect,discovery,panel,vault
http:
  - host-redirects: true
    matchers:
      - condition: or
        part: body
        type: word
        words:
          - Bitwarden Web Vault</title>
          - alt="Bitwarden
      - status:
          - 200
        # digest: 4a0a004730450220722f4764f47a897a574269154354b50f6b209b0ae7baa6b6b342c7898d81a1a5022100a64ae8e49af0fe76fde69468820efe52952db54c67be8303a5dcba56896662c2:922c64590222798bb761d5b6d8e72950

        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
