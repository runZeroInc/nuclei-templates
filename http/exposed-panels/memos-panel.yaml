id: memos-panel
info:
  name: Memos Panel - Detect
  author: rxerium
  severity: info
  description: |
    Memos is a privacy-first, lightweight note-taking service
  reference:
    - https://github.com/usememos/memos
    - https://www.usememos.com/
  classification:
    cpe: cpe:2.3:a:usememos:memos:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)memos"})
    fofa-query: title="memos"
    google-query: intitle:"memos"
    max-request: 2
    product: memos
    shodan-query:
      - title:"Memos"
      - http.title:"memos"
    vendor: usememos
    verified: true
  tags: detect,discovery,memos,panel,usememos
http:
  - matchers:
      - type: word
        words:
          - <title>Memos
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/explore'
    stop-at-first-match: true
