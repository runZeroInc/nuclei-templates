id: phpcollab-panel
info:
  name: phpCollab Login Panel - Detect
  author: pikpikcu
  severity: info
  description: phpCollab login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:phpcollab:phpcollab:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)phpcollab"})
    fofa-query: title="phpcollab"
    google-query: intitle:"phpcollab"
    max-request: 1
    product: phpcollab
    shodan-query:
      - http.title:"PhpCollab"
      - http.title:"phpcollab"
    vendor: phpcollab
  tags: discovery,login,panel,phpcollab
http:
  - extractors:
      - group: 1
        part: body
        regex:
          - <p id="footer">(.*)</p>
        type: regex
    matchers:
      - part: body
        type: word
        words:
          - <title>PhpCollab</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/general/login.php'
