id: aspect-control-panel

info:
  name: ASPECT Control Panel Login - Detect
  author: JustaAcat
  severity: info
  description: |
    ASPECT Control Panel login was detected.
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:h:abb:aspect-ent-256:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: abb
    product: aspect-ent-256
    shodan-query: http.favicon.hash:"1011076161"
    runzero-match: service["favicon.ico.image.mmh3"] == "1011076161"
    fofa-query: icon_hash=1011076161
  tags: panel,aspect,login

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - <title>ASPECT Control Panel</title>

      - type: status
        status:
          - 200

