id: biotime-panel
info:
  name: BioTime Web Login Panel - Detect
  author: robotshell
  severity: info
  description: BioTime Web login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:zkteco:biotime:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)BioTime"})
    max-request: 2
    product: biotime
    shodan-query: http.title:"BioTime"
    vendor: zkteco
    verified: true
  tags: biotime,discovery,panel
http:
  - host-redirects: true
    matchers:
      - part: body
        regex:
          - <title>BioTime(.*)</title>
        type: regex
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/login/'
    stop-at-first-match: true
