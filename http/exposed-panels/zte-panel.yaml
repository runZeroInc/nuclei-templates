id: zte-panel

info:
  name: ZTE - Exposed Panel
  author: its0x08,idealphase
  severity: info
  description: ZTE panel was detected.
  reference:
    - https://www.zte.com.cn/global/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:h:zte:nr8120a:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: |-
        service["http.body"] matches "ZTE Corporation"
    verified: true
    max-request: 1
    shodan-query: http.html:"ZTE Corporation"
    product: nr8120a
    vendor: zte
  tags: panel,zte

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: body
        words:
          - "ZTE Corporation. All rights reserved. </div>"
          - '<form name="fLogin" id="fLogin" method="post"  onsubmit="return false;" action="">'
        condition: and

      - type: word
        part: header
        words:
          - "Mini web server 1.0 ZTE corp 2005."

    extractors:
      - type: regex
        part: body
        group: 1
        regex:
          - '<div class="type"><font id="">(.+)<\/font><\/div>'

