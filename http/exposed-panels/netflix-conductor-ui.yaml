id: netflix-conductor-ui
info:
  name: Netflix Conductor UI Panel - Detect
  author: c-sh0
  severity: info
  description: Netflix Conductor UI panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:netflix:conductor:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)conductor ui"})
    fofa-query: title="conductor ui", http.title:"workflow ui"
    google-query: intitle:"conductor ui", http.title:"workflow ui"
    max-request: 1
    product: conductor
    shodan-query:
      - http.title:"Conductor UI", http.title:"Workflow UI"
      - http.title:"conductor ui", http.title:"workflow ui"
    vendor: netflix
  tags: conductor,discovery,netflix,panel,webserver
http:
  - host-redirects: true
    matchers:
      - status:
          - 200
        type: status
      - condition: or
        part: body
        type: word
        words:
          - <title>Conductor UI</title>
          - <title>Workflow UI</title>
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
