id: exagrid-manager-panel
info:
  name: ExaGrid Manager Login Panel - Detect
  author: pussycat0x
  severity: info
  description: ExaGrid Manager login panel was detected.
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:h:exagrid:backup_appliance:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)exagrid manager"})
    fofa-query: title="exagrid manager"
    google-query: intitle:"exagrid manager"
    max-request: 1
    product: backup_appliance
    shodan-query:
      - title:"ExaGrid Manager"
      - http.title:"exagrid manager"
    vendor: exagrid
    verified: true
  tags: discovery,exagrid,login,manager,panel
http:
  - host-redirects: true
    matchers:
      - part: body
        type: word
        words:
          - ExaGrid Manager
      - part: header
        type: word
        words:
          - text/html
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
