id: apache-jmeter-dashboard
info:
  name: Apache JMeter Dashboard Login Panel - Detect
  author: tess
  severity: info
  description: Apache JMeter Dashboard login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:apache:jmeter:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)apache jmeter dashboard"})
    fofa-query: title="apache jmeter dashboard"
    google-query: intitle:"apache jmeter dashboard"
    max-request: 1
    product: jmeter
    shodan-query:
      - title:"Apache JMeter Dashboard"
      - http.title:"apache jmeter dashboard"
    vendor: apache
    verified: true
  tags: apache,discovery,jmeter,panel
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - Apache JMeter Dashboard
          - Dashboard
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
