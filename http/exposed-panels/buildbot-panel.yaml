id: buildbot-panel
info:
  name: Buildbot Panel - Detect
  author: thardt-praetorian,daffainfo
  severity: info
  description: Buildbot panel was detected.
  reference:
    - https://buildbot.net
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:buildbot:buildbot:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)buildbot"})
    fofa-query: title="buildbot"
    google-query: intitle:"buildbot"
    max-request: 1
    product: buildbot
    shodan-query:
      - http.title:"BuildBot"
      - http.title:"buildbot"
    vendor: buildbot
    verified: true
  tags: buildbot,cicd,discovery,panel
http:
  - extractors:
      - part: body
        regex:
          - \[\"Buildbot\", \"([0-9.]+)\"\]
        type: regex
    host-redirects: true
    matchers:
      - condition: or
        part: body
        regex:
          - <title(.*)>Buildbot</title>
          - buildbot_config
        type: regex
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
