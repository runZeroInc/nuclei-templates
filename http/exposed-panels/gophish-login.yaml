id: gophish-login
info:
  name: Gophish Login Panel - Detect
  author: dhiyaneshDK
  severity: info
  description: Gophish login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:getgophish:gophish:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Gophish - Login"})
    max-request: 1
    product: gophish
    shodan-query: http.title:"Gophish - Login"
    vendor: getgophish
  tags: discovery,gophish,panel
http:
  - matchers:
      - type: word
        words:
          - <title>Gophish - Login</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/login'
