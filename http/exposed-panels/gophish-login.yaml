id: gophish-login

info:
  name: Gophish - Exposed Panel
  author: dhiyaneshDK
  severity: info
  description: Gophish panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:getgophish:gophish:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: |-
        any(each(service["html.titles"]), {# matches "Gophish - Login"})
    max-request: 1
    shodan-query: http.title:"Gophish - Login"
    product: gophish
    vendor: getgophish
  tags: panel,gophish

http:
  - method: GET
    path:
      - '{{BaseURL}}/login'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Gophish - Login</title>'

      - type: status
        status:
          - 200

