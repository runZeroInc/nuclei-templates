id: meshcentral-login
info:
  name: MeshCentral Login Panel - Detect
  author: dhiyaneshDk
  severity: info
  description: MeshCentral login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:meshcentral:meshcentral:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)meshcentral - login"})
    fofa-query: title="meshcentral - login"
    google-query: intitle:"meshcentral - login"
    max-request: 1
    product: meshcentral
    shodan-query:
      - http.title:"MeshCentral - Login"
      - http.title:"meshcentral - login"
    vendor: meshcentral
  tags: discovery,meshcentral,panel
http:
  - matchers:
      - part: body
        type: word
        words:
          - <title>MeshCentral - Login</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
