id: kiwitcms-login
info:
  name: Kiwi TCMS Login Panel - Detect
  author: pdteam
  severity: info
  description: Kiwi TCMS login panel was detected.
  reference:
    - https://kiwitcms.org
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:kiwitcms:kiwi_tcms:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)kiwi tcms - login"})
    fofa-query: title="kiwi tcms - login" http.favicon.hash:-1909533337
    google-query: intitle:"kiwi tcms - login" http.favicon.hash:-1909533337
    max-request: 1
    product: kiwi_tcms
    shodan-query:
      - title:"Kiwi TCMS - Login" http.favicon.hash:-1909533337
      - http.title:"kiwi tcms - login" http.favicon.hash:-1909533337
    vendor: kiwitcms
  tags: discovery,kiwitcms,panel
http:
  - extractors:
      - group: 1
        regex:
          - Version ([0-9.]+)
        type: regex
    matchers:
      - type: word
        words:
          - Kiwi TCMS
    method: GET
    path:
      - '{{BaseURL}}/accounts/login/'
