id: pfsense-login
info:
  name: pfSense Login Panel - Detect
  author: idealphase
  severity: info
  description: pfSense login panel was detected.
  reference:
    - https://www.pfsense.org/download/
    - https://www.pfsense.org/getting-started/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:pfsense:pfsense:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)pfsense - login"})
    fofa-query: title="pfsense - login"
    google-query:
      - intitle:"pfSense - Login"
      - intitle:"pfsense - login"
    max-request: 1
    product: pfsense
    shodan-query:
      - http.title:"pfSense - Login"
      - http.title:"pfsense - login"
    vendor: pfsense
  tags: discovery,panel,pfsense
http:
  - extractors:
      - group: 1
        regex:
          - <script src="\/js\/pfSense\.js\?(.+)"><\/script>
        type: regex
    matchers:
      - part: body
        type: word
        words:
          - <title>pfSense - Login</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
