id: connectwise-panel
info:
  name: ConnectWise Control Remote Support Software Panel - Detect
  author: johnk3r
  severity: info
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:connectwise:screenconnect:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["favicon.ico.image.mmh3"] == "-82958153"
    fofa-query:
      - app="screenconnect-remote-support-software"
      - icon_hash=-82958153
    hunter-query: app.name="connectwise screenconnect software"
    max-request: 1
    product: screenconnect
    shodan-query: http.favicon.hash:-82958153
    vendor: connectwise
    verified: true
    zoomeye-query: app="screenconnect remote management software"
  tags: connectwise,detect,discovery,panel,screenconnect
http:
  - extractors:
      - kval:
          - Server
        part: header
        type: kval
    host-redirects: true
    matchers:
      - condition: or
        dsl:
          - contains(header, "ScreenConnect")
          - contains(body, "ConnectWise Control Remote Support")
        type: dsl
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}/Login'
