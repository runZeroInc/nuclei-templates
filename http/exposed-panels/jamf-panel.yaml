id: jamf-panel
info:
  name: Jamf MDM Login Panel - Detect
  author: pdteam,idealphase
  severity: info
  description: Jamf Mobile Device Management login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:jamf:jamf:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["favicon.ico.image.mmh3"] == "1262005940"
    max-request: 1
    product: jamf
    shodan-query: http.favicon.hash:1262005940
    vendor: jamf
  tags: discovery,jamf,mdm,panel
http:
  - extractors:
      - group: 1
        part: body
        regex:
          - <meta name=\"version\" content=\"(.*)\">
        type: regex
    host-redirects: true
    matchers:
      - condition: or
        part: response
        type: word
        words:
          - Jamf Pro Login
          - Jamf Cloud Node
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
