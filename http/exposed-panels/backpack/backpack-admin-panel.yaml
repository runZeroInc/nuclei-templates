id: backpack-admin-panel
info:
  name: Laravel Backpack Admin Login Panel - Detect
  author: shine
  severity: info
  description: |
    Laravel Backpack admin login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:backpackforlaravel:backpack\\\\crud:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Backpack Admin"})
    max-request: 1
    product: backpack\\\\crud
    shodan-query: title:"Backpack Admin"
    vendor: backpackforlaravel
    verified: true
  tags: admin,backpack,discovery,panel
http:
  - matchers:
      - condition: or
        part: body
        type: word
        words:
          - Backpack Admin
          - backpack_alerts
    method: GET
    path:
      - '{{BaseURL}}/admin/login'
