id: magnolia-panel
info:
  name: Magnolia CMS Login Panel - Detect
  author: pussycat0x
  severity: info
  description: |
    Magnolia CMS login panel was detected.
  reference:
    - https://www.magnolia-cms.com/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:magnolia-cms:magnolia_cms:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)Magnolia is a registered trademark"
    max-request: 2
    product: magnolia_cms
    shodan-query: html:"Magnolia is a registered trademark"
    vendor: magnolia-cms
    verified: true
  tags: discovery,login,magnolia,panel
http:
  - matchers:
      - part: body
        type: word
        words:
          - Magnolia is a registered trademark
      - part: header
        type: word
        words:
          - text/html
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/.magnolia/admincentral'
    stop-at-first-match: true
