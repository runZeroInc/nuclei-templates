id: openvpn-admin
info:
  name: OpenVPN Admin Login Panel - Detect
  author: ritikchaddha
  severity: info
  description: OpenVPN Admin login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:openvpn:openvpn:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)openvpn-admin"}) || service["http.body"] matches "(?i)router management - server openvpn"
    fofa-query:
      - body="router management - server openvpn"
      - title="openvpn-admin"
    google-query: intitle:"openvpn-admin"
    max-request: 3
    product: openvpn
    shodan-query:
      - http.title:"OpenVPN-Admin"
      - http.html:"router management - server openvpn"
      - http.title:"openvpn-admin"
      - cpe:"cpe:2.3:a:openvpn:openvpn"
    vendor: openvpn
    verified: true
  tags: admin,config,discovery,openvpn,panel
http:
  - matchers:
      - condition: or
        part: body
        type: word
        words:
          - <title>OpenVPN-Admin
          - <title>OpenVPN Admin
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/login'
      - '{{BaseURL}}/index.php'
    stop-at-first-match: true
