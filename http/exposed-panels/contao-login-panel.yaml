id: contao-login-panel
info:
  name: Contao Login Panel - Detect
  author: princechaddha
  severity: info
  description: Contao login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:contao:contao:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)contao open source cms" || any(each(service["html.titles"]), {# matches "(?i)contao"})
    fofa-query:
      - title="contao"
      - body="contao open source cms"
    google-query: intitle:"contao"
    max-request: 1
    product: contao
    shodan-query:
      - http.html:"Contao Open Source CMS"
      - http.title:"contao"
      - http.html:"contao open source cms"
      - cpe:"cpe:2.3:a:contao:contao"
    vendor: contao
    verified: true
  tags: contao,discovery,panel
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - Contao Open Source CMS
          - <h1>Login</h1>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/contao/login'
