id: arris-modem-detect
info:
  name: ARRIS Touchstone Telephony Modem - Panel Detect
  author: gy741
  severity: info
  description: ARRIS Touchstone Telephony Modem status panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:h:commscope:dg3450:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)phy\\.htm"
    fofa-query: body="phy.htm"
    max-request: 1
    product: dg3450
    shodan-query:
      - html:"phy.htm"
      - http.html:"phy.htm"
    vendor: commscope
    verified: true
  tags: arris,commscope,discovery,panel
http:
  - matchers:
      - part: body
        type: word
        words:
          - <title>Touchstone Status</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/phy.htm'
