id: zeroshell-login
info:
  name: ZeroShell Panel - Detect
  author: dhiyaneshDK
  severity: info
  description: ZeroShell panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:o:zeroshell:zeroshell:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)zeroshell"})
    fofa-query: title="zeroshell"
    google-query: intitle:"zeroshell"
    max-request: 1
    product: zeroshell
    shodan-query:
      - http.title:"ZeroShell"
      - http.title:"zeroshell"
    vendor: zeroshell
  tags: discovery,panel,zeroshell
http:
  - matchers:
      - type: word
        words:
          - <title>ZeroShell</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
