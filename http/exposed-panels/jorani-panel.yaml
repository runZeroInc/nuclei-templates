id: jorani-panel
info:
  name: Jorani Login Panel - Detect
  author: DhiyaneshDK
  severity: info
  description: Jorani login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:jorani:jorani:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)Login - Jorani"
    max-request: 2
    product: jorani
    shodan-query: html:"Login - Jorani"
    vendor: jorani
    verified: true
  tags: discovery,jorani,login,panel
http:
  - extractors:
      - group: 1
        part: body
        regex:
          - '&nbsp;v([0-9.]+)'
        type: regex
    host-redirects: true
    matchers:
      - condition: or
        part: body
        type: word
        words:
          - Login - Jorani
          - name="csrf_test_jorani
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/index.php/session/login'
    stop-at-first-match: true
