id: jamf-login
info:
  name: Jamf Pro Login Panel - Detect
  author: DhiyaneshDk
  severity: info
  description: Jamf Pro login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:jamf:jamf:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Jamf Pro"})
    max-request: 1
    product: jamf
    shodan-query: title:"Jamf Pro"
    vendor: jamf
    verified: true
  tags: discovery,jamf,panel
http:
  - host-redirects: true
    matchers:
      - regex:
          - <title>Jamf Pro Login(.*)</title>
        type: regex
      - status:
          - 401
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
