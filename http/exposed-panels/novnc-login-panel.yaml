id: novnc-login-panel
info:
  name: noVNC Login Panel - Detect
  author: tess
  severity: info
  description: noVNC login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:novnc:novnc:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)noVNC"})
    max-request: 2
    product: novnc
    shodan-query: http.title:"noVNC"
    vendor: novnc
    verified: true
  tags: discovery,novnc,panel
http:
  - host-redirects: true
    matchers:
      - part: body
        type: word
        words:
          - <title>noVNC</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}/vnc.html'
      - '{{BaseURL}}:6080/vnc.html'
    stop-at-first-match: true
