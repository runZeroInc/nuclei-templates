id: web-file-manager
info:
  name: Web File Manager Login Panel - Detect
  author: DhiyaneshDK
  severity: info
  description: Web File Manager login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:webdesi9:file_manager:*:*:*:*:wordpress:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Web File Manager"})
    max-request: 1
    product: file_manager
    shodan-query: title:"Web File Manager"
    vendor: webdesi9
    verified: true
  tags: discovery,filemanager,panel
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - Web File Manager
          - Login
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/Login'
