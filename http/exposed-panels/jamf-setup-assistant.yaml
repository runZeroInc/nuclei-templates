id: jamf-setup-assistant
info:
  name: Jamf Pro Setup Assistant Panel - Detect
  author: ritikchaddha
  severity: info
  description: Jamf Pro Setup Assistant panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:jamf:jamf:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)Jamf Pro Setup"
    max-request: 1
    product: jamf
    shodan-query: http.html:"Jamf Pro Setup"
    vendor: jamf
    verified: true
  tags: discovery,jamf,panel,setup
http:
  - matchers:
      - type: word
        words:
          - Jamf Pro Setup Assistant
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/setupAssistant.html'
