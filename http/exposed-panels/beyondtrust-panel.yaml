id: beyondtrust-panel
info:
  name: BeyondTrust Login Panel - Detect
  author: r3dg33k,nuk3s3c
  severity: info
  description: BeyondTrust login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:beyondtrust:beyondinsight:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)BeyondInsight"
    max-request: 1
    product: beyondinsight
    shodan-query: http.html:"BeyondInsight"
    vendor: beyondtrust
  tags: beyondtrust,discovery,pam,panel
http:
  - matchers:
      - part: body
        type: word
        words:
          - <title>BeyondInsight</title>
    method: GET
    path:
      - '{{BaseURL}}/WebConsole/'
