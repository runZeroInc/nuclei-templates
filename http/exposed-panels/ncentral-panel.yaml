id: ncentral-panel
info:
  name: N-central Login Panel - Detect
  author: theabhinavgaur
  severity: info
  description: N-central login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:n-able:n-central:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)N-central Login"})
    fofa-query:
      - title="N-central Login"
      - icon_hash="1519363246"
      - icon_hash="1937353549"
      - 'Set-Cookie: ncentral_version='
    max-request: 1
    product: n-central
    shodan-query:
      - http.title:"N-central Login"
      - http.favicon.hash:1519363246
      - http.favicon.hash:1937353549
      - 'Set-Cookie: ncentral_version='
    vendor: n-able
    verified: true
  tags: discovery,n-central,panel
http:
  - extractors:
      - group: 1
        regex:
          - ncentralVersion:\s+"([\d\.]+)",
        type: regex
    matchers:
      - part: body
        type: word
        words:
          - class="ncentral"
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/login'
