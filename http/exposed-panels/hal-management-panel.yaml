id: hal-management-panel

info:
  name: HAL Management Console - Exposed Panel
  author: DhiyaneshDK
  severity: info
  description: HAL Management Console panel was detected.
  metadata:
    runzero-match: |-
        service["http.body"] matches "HAL Management Console"
    verified: true
    max-request: 1
    shodan-query: html:"HAL Management Console"
  tags: panel,login,hal

http:
  - method: GET
    path:
      - "{{BaseURL}}/console/index.html"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>HAL Management Console</title>"

      - type: status
        status:
          - 200

