id: linkerd-panel
info:
  name: Linkerd Panel - Detect
  author: tess
  severity: info
  description: |
    Linkerd panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:linkerd:linkerd:*:*:*:*:kubernetes:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)data-controller-namespace"
    fofa-query: body="data-controller-namespace"
    max-request: 1
    product: linkerd
    shodan-query:
      - html:"data-controller-namespace"
      - http.html:"data-controller-namespace"
    vendor: linkerd
    verified: true
  tags: discovery,exposure,linkerd,misconfig,panel
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - <title>Linkerd</title>
          - data-controller-namespace="linkerd
      - part: header
        type: word
        words:
          - text/html
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/namespaces'
