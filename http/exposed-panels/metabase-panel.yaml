id: metabase-panel
info:
  name: Metabase Login Panel - Detect
  author: revblock,daffainfo
  severity: info
  description: Metabase login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:metabase:metabase:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)metabase"})
    fofa-query:
      - title="metabase"
      - app="metabase"
    google-query: intitle:"metabase"
    max-request: 1
    product: metabase
    shodan-query:
      - http.title:"Metabase"
      - http.title:"metabase"
    vendor: metabase
  tags: discovery,login,metabase,panel
http:
  - extractors:
      - group: 1
        part: body
        regex:
          - '"(v\d+.\d+.\d+.?\d?)"'
        type: regex
    matchers:
      - status:
          - 200
        type: status
      - condition: and
        part: body
        type: word
        words:
          - <title>Metabase</title>
          - window.MetabaseBootstrap
          - window.MetabaseRoot
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/auth/login'
