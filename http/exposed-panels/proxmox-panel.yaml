id: proxmox-panel
info:
  name: Proxmox Virtual Environment Login Panel - Detect
  author: lum8rjack
  severity: info
  description: |
    Proxmox Virtual Environment login panel was detected.
  reference:
    - https://www.proxmox.com/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:proxmox:proxmox:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["favicon.ico.image.mmh3"] == "213144638"
    fofa-query: icon_hash=213144638
    max-request: 1
    product: proxmox
    shodan-query: http.favicon.hash:213144638
    vendor: proxmox
    verified: true
  tags: discovery,login,panel,proxmox
http:
  - extractors:
      - group: 1
        part: body
        regex:
          - (?:pvemanagerlib.js[?](ver=[0-9]{1}[.][0-9]{1,}[-][0-9]))
        type: regex
    matchers:
      - condition: or
        part: body
        type: word
        words:
          - Proxmox Virtual Environment</title>
          - 'auth_cookie_name: ''PVEAuthCookie'''
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
