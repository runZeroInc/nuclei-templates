id: jfrog-login
info:
  name: JFrog Login Panel - Detect
  author: dhiyaneshDK
  severity: info
  description: |
    JFrog login panel was detected.
  reference:
    - https://www.exploit-db.com/ghdb/6797
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:jfrog:artifactory:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)JFrog"})
    max-request: 2
    product: artifactory
    shodan-query: http.title:"JFrog"
    vendor: jfrog
    verified: true
  tags: detect,discovery,edb,jfrog,login,panel
http:
  - matchers:
      - condition: or
        dsl:
          - status_code==200 && contains(body, "<title>JFrog")
          - status_code==200 && ("-595620639" == mmh3(base64_py(body)))
        type: dsl
    method: GET
    path:
      - '{{BaseURL}}/ui/login/'
      - '{{BaseURL}}/ui/favicon.ico'
    stop-at-first-match: true
