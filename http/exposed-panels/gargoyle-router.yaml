id: gargoyle-router
info:
  name: Gargoyle Router Management Utility Admin Login Panel - Detect
  author: DhiyaneshDk
  severity: info
  description: Gargoyle Router Management Utility admin login panel was detected.
  reference:
    - https://www.exploit-db.com/ghdb/8004
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:gargoyle-router:gargoyle:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Gargoyle Router Management Utility"})
    max-request: 1
    product: gargoyle
    shodan-query: title:"Gargoyle Router Management Utility"
    vendor: gargoyle-router
    verified: true
  tags: discovery,edb,gargoyle,iot,panel,router
http:
  - matchers:
      - type: word
        words:
          - <title>Gargoyle Router Management Utility</title>
      - part: header
        type: word
        words:
          - text/html
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/login.sh'
