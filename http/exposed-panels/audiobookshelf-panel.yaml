id: audiobookshelf-panel
info:
  name: Audiobookshelf Login Panel - Detect
  author: ritikchaddha
  severity: info
  reference:
    - https://github.com/advplyr/audiobookshelf
  classification:
    cpe: cpe:2.3:a:audiobookshelf:audiobookshelf:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Audiobookshelf"})
    max-request: 2
    product: audiobookshelf
    shodan-query: title:"Audiobookshelf"
    vendor: audiobookshelf
    verified: true
  tags: audiobookshelf,detect,discovery,panel
http:
  - host-redirects: true
    matchers:
      - condition: or
        part: body
        type: word
        words:
          - <title>Audiobookshelf
          - content="Audiobookshelf
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/login'
    stop-at-first-match: true
