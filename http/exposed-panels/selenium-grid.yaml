id: selenium-grid
info:
  name: Selenium Grid Panel - Detect
  author: pussycat0x
  severity: info
  description: Selenium Grid panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:selenium:selenium_grid:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Selenium Grid"})
    max-request: 1
    product: selenium_grid
    shodan-query: http.title:"Selenium Grid"
    vendor: selenium
  tags: discovery,panel,selenium,unauth
http:
  - matchers:
      - part: body
        type: word
        words:
          - <title>Selenium Grid</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/ui/index.html'
