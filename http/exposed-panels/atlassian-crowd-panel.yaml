id: atlassian-crowd-panel
info:
  name: Atlassian Crowd Login Panel
  author: organiccrap,AdamCrosser
  severity: info
  description: An Atlassian Crowd login panel was discovered.
  reference:
    - https://www.atlassian.com/
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:atlassian:crowd:*:*:*:*:*:*:*:*
  metadata:
    category: sso
    max-request: 1
    product: crowd
    shodan-query: http.component:"atlassian crowd"
    vendor: atlassian
  tags: atlassian,crowd,detect,discovery,login,panel,sso
http:
  - extractors:
      - group: 1
        name: version
        part: body
        # digest: 4b0a00483046022100d534401feeb753bb207b34214f2ede6262600956ffaa494cdba1c438b30c320d022100bf54ef5676001e4c6900a28f3e6ec08d7950493639f4639a69bc786272738160:922c64590222798bb761d5b6d8e72950

        regex:
          - Version:&nbsp;([\d.]+)
        type: regex
    matchers:
      - part: body
        type: word
        words:
          - <title>Atlassian Crowd - Login</title>
      - part: body
        type: word
        words:
          - <title>Atlassian Crowd - Log into Atlassian</title>
    matchers-condition: or
    method: GET
    path:
      - '{{BaseURL}}/crowd/console/login.action'
