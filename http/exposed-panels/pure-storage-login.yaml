id: pure-storage-login
info:
  name: Pure Storage Login Panel - Detect
  author: dhiyaneshDK
  severity: info
  description: Pure Storage login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:purestorage:purity:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)pure storage login"})
    fofa-query: title="pure storage login"
    google-query: intitle:"pure storage login"
    max-request: 1
    product: purity
    shodan-query:
      - http.title:"Pure Storage Login"
      - http.title:"pure storage login"
    vendor: purestorage
  tags: discovery,panel,purestorage
http:
  - matchers:
      - type: word
        words:
          - <title>Pure Storage Login</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
