id: axigen-webadmin
info:
  name: Axigen Web Admin Detection
  author: dhiyaneshDk
  severity: info
  description: An Axigen Web Admin panel was discovered.
  reference:
    - https://www.axigen.com/
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:axigen:axigen_mail_server:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Axigen\u00a0WebAdmin"})
    max-request: 1
    product: axigen_mail_server
    shodan-query: http.title:"Axigen WebAdmin"
    vendor: axigen
  tags: axigen,discovery,panel
http:
  - matchers:
      - type: word
        words:
          - <title>Axigen WebAdmin</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
