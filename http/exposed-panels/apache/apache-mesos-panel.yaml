id: apache-mesos-panel
info:
  name: Apache Mesos - Panel Detect
  author: pikpikcu
  severity: info
  description: Apache Mesos panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:apache:mesos:*:*:*:*:jenkins:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)mesos"})
    fofa-query:
      - app="APACHE-MESOS"
      - app="apache-mesos"
      - title="mesos"
    google-query: intitle:"mesos"
    max-request: 2
    product: mesos
    shodan-query:
      - http.title:"Mesos"
      - http.title:"mesos"
    vendor: apache
    verified: true
  tags: apache,discovery,mesos,panel
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - <title>Mesos</title>
          - Apache
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}:5050'
    stop-at-first-match: true
