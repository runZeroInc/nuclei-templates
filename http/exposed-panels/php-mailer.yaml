id: php-mailer
info:
  name: PHPMailer Panel - Detect
  author: ritikchaddha
  severity: info
  description: PHPMailer panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:phpmailer_project:phpmailer:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)PHP Mailer"})
    max-request: 1
    product: phpmailer
    shodan-query: http.title:"PHP Mailer"
    vendor: phpmailer_project
    verified: true
  tags: discovery,mailer,panel,php
http:
  - matchers:
      - part: body
        type: word
        words:
          - <title>PHP Mailer</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
