id: minio-console
info:
  name: MinIO Console Login Panel - Detect
  author: pussycat0x
  severity: info
  description: MinIO Console login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:minio:console:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)MinIO Console"})
    fofa-query: app="MinIO-Console"
    max-request: 1
    product: console
    shodan-query: title:"MinIO Console"
    vendor: minio
  tags: discovery,minio,panel
http:
  - matchers:
      - dsl:
          - contains(tolower(body), '<title>minio console</title>')
        type: dsl
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/login'
