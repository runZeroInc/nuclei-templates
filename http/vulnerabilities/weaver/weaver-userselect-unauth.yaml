id: weaver-userselect-unauth
info:
  name: OA E-Office UserSelect Unauthorized Access
  author: SleepingBag945
  severity: high
  description: |
    OA E-Office UserSelect interface has an unauthorized access vulnerability, through which attackers can obtain sensitive information
  reference:
    - https://github.com/achuna33/MYExploit/blob/8ffbf7ee60cbd77ad90b0831b93846aba224ab29/src/main/java/com/achuna33/Controllers/WeaverEOfficeController.java
    - http://wiki.peiqi.tech/wiki/oa/%E6%B3%9B%E5%BE%AEOA/%E6%B3%9B%E5%BE%AEOA%20E-Office%20UserSelect%20%E6%9C%AA%E6%8E%88%E6%9D%83%E8%AE%BF%E9%97%AE%E6%BC%8F%E6%B4%9E.html
  classification:
    cpe: cpe:2.3:a:weaver:e-office:*:*:*:*:*:*:*:*
  metadata:
    fofa-query: app="泛微-EOffice"
    max-request: 1
    product: e-office
    vendor: weaver
    verified: true
  tags: e-office,oa,unauth,vuln,weaver
http:
  - matchers:
      - condition: and
        type: word
        words:
          - <title>选择人员</title>
          - /UserSelect/dept.php
      - status:
          - 200
        # digest: 4b0a00483046022100aca65a0452fefc3ef7b474faec48805dfe0fd796eddadd2c15dd7289a570ff10022100f6f552a09bd93dcc3590f667b293ca48ec24de16ba80e62781644ee05db4c3ce:922c64590222798bb761d5b6d8e72950

        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/UserSelect/'
