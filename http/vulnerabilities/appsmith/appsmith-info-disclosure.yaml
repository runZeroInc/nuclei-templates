id: appsmith-info-disclosure
info:
  name: Appsmith <= v1.97 - Information Disclosure
  author: ritikchaddha
  severity: medium
  description: |
    Appsmith <= v1.97 instance management API endpoints are accessible without authentication, allowing an attacker to obtain sensitive information such as license plan, instance ID, authentication providers, feature flags, and configuration metadata via unauthenticated requests to specific API endpoints.
  impact: |
    Attackers can extract detailed information about Appsmith enterprise features, authentication methods, and configuration, enabling more focused and effective attacks against the instance and its users.
  remediation: |
    Restrict unauthenticated access to the management API endpoints and ensure that only authorized users can retrieve sensitive configuration information.
  reference:
    - https://github.com/appsmithorg/appsmith/security/advisories/GHSA-qvvc-prjx-f85j
    - https://github.com/appsmithorg/appsmith/pull/41598
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 4.3
    cve-id: CVE-2026-34847
    cwe-id: CWE-200
  metadata:
    fofa-query: title="Appsmith"
    max-request: 1
    product: appsmith
    shodan-query: http.title:"Appsmith"
    vendor: appsmith
    verified: true
  tags: appsmith,disclosure,exposure
http:
  - matchers:
      - condition: or
        part: body
        type: word
        words:
          - '"adminEmailDomainHash":"'
          - '"instanceId":"'
      - condition: and
        part: body
        type: word
        words:
          - '{"responseMeta":{'
          - status":200,"success":true
          # digest: 4a0a0047304502200123334163ee34cee01e6dec09c50e363dd9bc8af184220419240666f784d019022100858e82c44257d1be9ab83263079f2b0c576ed250cff0c82a90bd4d78fbdae1f2:922c64590222798bb761d5b6d8e72950
      - part: content_type
        type: word
        words:
          - application/json
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/api/v1/tenants/current'
      - '{{BaseURL}}/api/v1/consolidated-api/view'
    stop-at-first-match: true
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - '{"responseMeta":{'
          - status":200,"success":true
      - part: content_type
        type: word
        words:
          - application/json
      - status:
          - 200
        # digest: 4b0a00483046022100f525107c3f23ef91fc114575d15cd2a6053a234598fb06d79a93942fc0a074a4022100af8f5cd0e989596c282ba4ccd13b0781ce0528111c0b13be8fdd97954cb898a3:922c64590222798bb761d5b6d8e72950

        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/api/v1/users/features'
