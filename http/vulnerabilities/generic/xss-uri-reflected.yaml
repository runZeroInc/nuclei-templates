id: xss-uri-reflected
info:
  name: Reflected XSS
  author: nadino,geeknik,matejsmycka
  severity: low
  description: |
    Reflected cross-site scripting vulnerability was discovered via generic testing. Manual testing is needed to verify exploitation.
  classification:
    cwe-id:
      - CWE-79
  metadata:
    max-request: 1
  tags: generic,vuln,xss
http:
  - matchers:
      - condition: or
        part: body
        type: word
        words:
          - '"><injectable>'
          - '''><injectable>'
      - part: content_type
        type: word
        words:
          - text/html
      - status:
          - 200
        type: status
      - condition: or
        negative: true
        part: body
        type: word
        words:
          - <title>Access Denied</title>
          - You don't have permission to access
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/a%22%3E%3Cinjectable%3E'
      - '{{BaseURL}}/a%27%3E%3Cinjectable%3E'
    stop-at-first-match: true
