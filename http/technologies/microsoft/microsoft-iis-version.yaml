id: microsoft-iis-version
info:
  name: Microsoft IIS version detect
  author: Wlayzz
  severity: info
  description: Some Microsoft IIS servers have the version on the response header. Useful when you need to find specific CVEs on your targets.
  metadata:
    max-request: 1
  tags: discovery,iis,microsoft,tech
http:
  - extractors:
      - kval:
          - Server
        part: header
        type: kval
    host-redirects: true
    matchers:
      - part: header
        type: word
        words:
          - IIS
    matchers-condition: and
    max-redirects: 4
    method: GET
    path:
      - '{{BaseURL}}'
