id: oracle-webcenter-sites
info:
  name: Oracle WebCenter Sites
  author: leovalcante
  severity: info
  classification:
    cpe: cpe:2.3:a:oracle:webcenter_sites:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    product: webcenter_sites
    shodan-query: http.html:"WebCenter"
    vendor: oracle
    verified: true
  tags: discovery,oracle,tech,webcenter
http:
  - method: GET
    path:
      - '{{BaseURL}}/welcome_webcenter.html'
    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'FOR ORACLE'
          - 'WebCenter Framework'
        condition: and
      - type: status
        status:
          - 200
