id: php-fusion-detect
info:
  name: PHP Fusion Detect
  author: pikpikcu
  severity: info
  classification:
    cpe: cpe:2.3:a:php-fusion:php-fusion:*:*:*:*:*:*:*:*
  metadata:
    fofa-query: title="PHP-Fusion"
    max-request: 1
    product: php-fusion
    vendor: php-fusion
  tags: discovery,php,php-fusion,tech
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "PHP-Fusion"
      - type: status
        status:
          - 200
