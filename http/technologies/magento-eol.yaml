id: eol-magento
info:
  name: Magento End-of-life Detect
  author: dogancanbakir
  severity: info
  description: |
    Magento end of life detection.
  reference:
    - https://www.magento.com/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:magento:magento:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    product: magento
    shodan-query: http.component:"Magento"
    vendor: magento
    verified: true
  tags: cms,discovery,magento,tech
http:
  - extractors:
      - group: 1
        internal: true
        name: version
        part: body
        regex:
          - 'Magento\/([0-9.]+) '
        type: regex
    matchers:
      - dsl:
          - compare_versions(version, '<=2.4')
        type: dsl
      - part: body
        regex:
          - 'Magento\/([0-9.]+) '
        type: regex
    method: GET
    path:
      - '{{BaseURL}}'
