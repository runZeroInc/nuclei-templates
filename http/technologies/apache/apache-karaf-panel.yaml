id: apache-karaf-panel
info:
  name: Apache Karaf Detect
  author: s0obi
  severity: info
  classification:
    cpe: cpe:2.3:a:apache:karaf:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    product: karaf
    shodan-query: realm="karaf"
    vendor: apache
    verified: true
  tags: apache,discovery,karaf,tech
http:
  - method: GET
    path:
      - "{{BaseURL}}/system/console"
    matchers:
      - type: word
        part: header
        words:
          - 'realm="karaf'
