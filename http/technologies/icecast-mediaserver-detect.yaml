id: icecast-mediaserver-detect
info:
  name: Icecast Streaming Media Server Information Panel - Detect
  author: pussycat0x
  severity: info
  description: Icecast Streaming Media Server information panel was detected.
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
    cpe: cpe:2.3:a:xiph:icecast:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    product: icecast
    shodan-query: title:"Icecast Streaming Media Server"
    vendor: xiph
    verified: true
  tags: detect,discovery,icecast,media-server,tech
http:
  - extractors:
      - part: body
        regex:
          - Icecast ([0-9.]+)
        type: regex
    matchers:
      - part: body
        type: word
        words:
          - Icecast Streaming Media Server
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/server_version.xsl'
