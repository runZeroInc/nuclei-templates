id: rseenet-detect
info:
  name: Advantech R-SeeNet Detection
  author: pdteam
  severity: info
  reference:
    - https://icr.advantech.cz/products/software/r-seenet
  classification:
    cpe: cpe:2.3:a:advantech:r-seenet:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    product: r-seenet
    shodan-query: http.title:"R-SeeNet"
    vendor: advantech
  tags: discovery,rseenet,tech
http:
  - extractors:
      - group: 1
        regex:
          - <title>R-SeeNet (.*)</title>
        type: regex
    matchers:
      - part: body
        regex:
          - <title>R-SeeNet (.*)</title>
        type: regex
    method: GET
    path:
      - '{{BaseURL}}'
