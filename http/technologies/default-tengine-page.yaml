id: default-tengine-page
info:
  name: Tengine Default Page
  author: pussycat0x
  severity: info
  classification:
    cpe: cpe:2.3:a:alibaba:tengine:*:*:*:*:nginx:*:*:*
  metadata:
    max-request: 1
    product: tengine
    shodan-query: http.title:"Welcome to tengine"
    vendor: alibaba
    verified: true
  tags: default-page,discovery,tech,tengine
http:
  - method: GET
    path:
      - '{{BaseURL}}'
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Welcome to tengine'
          - 'Thank you for using tengine'
        condition: and
      - type: status
        status:
          - 200
