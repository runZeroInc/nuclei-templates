id: php-detect
info:
  name: PHP Detect
  author: y0no
  severity: info
  classification:
    cpe: cpe:2.3:a:php:php:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    product: php
    shodan-query: 'X-Powered-By: PHP'
    vendor: php
    verified: true
  tags: discovery,php,tech
http:
  - extractors:
      - group: 1
        part: header
        regex:
          - (?i)PHP/([0-9.]+)
        # digest: 4b0a00483046022100d5abafe187b39ebcc616ae3e805934a9ec53c6c3fee06dbc842c13b26d285e68022100e198dfd892a8550cfd0bff457f019e3ca9a93fa193bb3a10b0cb56987d7cad3b:922c64590222798bb761d5b6d8e72950

        type: regex
    host-redirects: true
    matchers:
      - dsl:
          - contains(header, "PHP/") || contains(header, "PHPSESSID") || contains(header, ".php")
        type: dsl
    max-redirects: 2
    raw:
      - |
        GET / HTTP/1.1
        Host: {{Hostname}}
