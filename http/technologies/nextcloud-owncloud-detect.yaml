id: owncloud-status-page
info:
  name: Owncloud StatusPage detection
  author: myztique,invisiblethreat
  severity: info
  classification:
    cpe: cpe:2.3:a:owncloud:owncloud:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    product: owncloud
    shodan-query: http.html:"owncloud"
    vendor: owncloud
    verified: true
  tags: discovery,owncloud,status,tech
http:
  - extractors:
      - json:
          - .version
        type: json
    matchers:
      - condition: and
        part: body
        type: word
        words:
          - '"versionstring":'
          - '"installed":'
          - '"edition":'
    method: GET
    path:
      - '{{BaseURL}}/status.php'
