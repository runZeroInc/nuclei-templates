id: owncloud-status-page

info:
  name: ownCloud Server - Detection
  author: myztique,invisiblethreat
  severity: info
  description: |
    ownCloud Server was detected.
  classification:
    cpe: cpe:2.3:a:owncloud:owncloud:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "(?i)owncloud"
    verified: true
    max-request: 1
    vendor: owncloud
    product: owncloud
    shodan-query: http.html:"owncloud"
  tags: tech,owncloud,status,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/status.php"

    matchers:
      - type: word
        part: body
        words:
          - '"versionstring":'
          - '"installed":'
          - '"edition":'
        condition: and

    extractors:
      - type: json
        name: version
        json:
          - .version

