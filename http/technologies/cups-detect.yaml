id: cups-detect
info:
  name: CUPS - Detect
  author: rxerium
  severity: info
  description: |
    An instance running CUPS was detected.
  metadata:
    max-request: 1
    shodan-query: product:"CUPS (IPP)"
    verified: true
  tags: cups,detect,discovery,tech
http:
  - extractors:
      - group: 1
        name: version
        part: body
        regex:
          - (?i)<title>[^<]*- CUPS v?([0-9][0-9.]*)</title>
        # digest: 490a00463044022068b311f0dfa2633ba6cff5537ef65d031e5f16e89a44b0827f8d84b8714e0e9e02204a41d76a955bfb3e1fa4387f639fd787ed487224aa8d6c21cabcca47b8a3c8ff:922c64590222798bb761d5b6d8e72950

        type: regex
    matchers:
      - part: header
        regex:
          - '(?mi)^Server: CUPS\b'
        type: regex
      - condition: or
        part: body
        type: word
        words:
          - Web Interface is Disabled - CUPS
          - Forbidden - CUPS
    matchers-condition: or
    method: GET
    path:
      - '{{BaseURL}}'
