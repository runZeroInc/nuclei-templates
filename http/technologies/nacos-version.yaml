id: nacos-version
info:
  name: Nacos - Detect
  author: Arm!tage
  severity: info
  description: |
    Nacos was detected.
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:alibaba:nacos:*:*:*:*:*:*:*:*
  metadata:
    max-request: 2
    product: nacos
    shodan-query: title:"Nacos"
    vendor: alibaba
    verified: true
  tags: detect,discovery,nacos,tech
http:
  - extractors:
      - part: body
        regex:
          - '"version":"(\d+\.\d+\.\d+)"'
        type: regex
    matchers:
      - part: body
        regex:
          - '"version":"(\d+\.\d+\.\d+)"'
        type: regex
      - part: content_type
        regex:
          - application/json
        type: regex
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/v1/console/server/state?accessToken=&username='
      - '{{BaseURL}}/nacos/v1/console/server/state?accessToken=&username='
    stop-at-first-match: true
