id: vivotex-web-console-detect
info:
  name: VIVOTEK Web Console Detect
  author: pikpikcu
  severity: info
  classification:
    cpe: cpe:2.3:h:vivotek:ip7361:*:*:*:*:*:*:*:*
  metadata:
    fofa-query: app="VIVOTEK-Web-Console"
    max-request: 1
    product: ip7361
    shodan-query: title:"VIVOTEK Web Console"
    vendor: vivotek
  tags: console,discovery,tech,vivotex
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>VIVOTEK Web Console</title>"
      - type: word
        part: header
        words:
          - "text/html"
      - type: status
        status:
          - 200
