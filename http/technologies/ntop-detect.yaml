id: ntop-detect
info:
  name: Ntop Detect Panel - Detect
  author: pussycat0x
  severity: info
  description: |
    Ntop Detect panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
    cpe: cpe:2.3:a:ntop:ntopng:*:*:*:*:*:*:*:*
  metadata:
    # auto-generated by nuclei-sync — please review before merging
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)welcome to ntop"})
    max-request: 1
    product: ntopng
    shodan-query: http.title:"welcome to ntop"
    vendor: ntop
    verified: true
  tags: discovery,ntop,panel,tech
http:
  - matchers:
      - part: body
        type: word
        words:
          - Welcome to ntop
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
