id: burp-collaborator-detect
info:
  name: Burp Collaborator Server - Detect
  author: lum8rjack
  severity: info
  description: |
    Burp Collaborator server detected.
  reference:
    - https://portswigger.net/burp/documentation/collaborator
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
    cpe: cpe:2.3:a:portswigger:burp_suite:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    product: burp_suite
    shodan-query: 'Server: Burp Collaborator'
    vendor: portswigger
    verified: true
  tags: burp,detect,discovery,tech
http:
  - extractors:
      - group: 1
        part: header
        regex:
          - '(?:X-(Collaborator-Version: [0-9]))'
        type: regex
    matchers:
      - part: header
        type: word
        words:
          - 'Server: Burp Collaborator https://burpcollaborator.net/'
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
