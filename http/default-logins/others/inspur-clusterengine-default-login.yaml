id: inspur-clusterengine-default-login
info:
  name: Inspur Clusterengine 4 - Default Admin Login
  author: ritikchaddha
  severity: high
  description: Inspur Clusterengine version 4 default admin login credentials were successful.
  reference:
    - https://blog.csdn.net/qq_36197704/article/details/115665793
  classification:
    cpe: cpe:2.3:a:inspur:clusterengine:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)TSCEV4\\.0"})
    fofa-query: title="TSCEV4.0"
    max-request: 1
    product: clusterengine
    vendor: inspur
  tags: clusterengine,default-login,inspur,vuln
http:
  - attack: pitchfork
    host-redirects: true
    matchers:
      - part: body
        type: word
        words:
          - '"exitcode":0'
      - condition: and
        part: header
        type: word
        words:
          - username=admin|pwd
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    payloads:
      password:
        - 123456
      username:
        - admin|pwd
    raw:
      - |
        POST /login HTTP/1.1
        Host: {{Hostname}}

        op=login&username={{username}}&password={{password}}
