id: frp-default-login
info:
  name: FRP Default Login
  author: pikpikcu
  severity: high
  description: FRP default login credentials were discovered.
  reference:
    - https://github.com/fatedier/frp/issues/1840
  classification:
    cwe-id: CWE-798
  metadata:
    max-request: 1
  tags: default-login,frp,vuln
http:
  - attack: pitchfork
    matchers:
      - condition: and
        part: body
        type: word
        words:
          - '"proxies":'
      - status:
          - 200
        type: status
    matchers-condition: and
    payloads:
      password:
        - admin
      username:
        - admin
    raw:
      - |
        GET /api/proxy/tcp HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic {{base64(username + ':' + password)}}
