id: supermicro-default-login
info:
  name: Supermicro Ipmi - Default Admin Login
  author: For3stCo1d
  severity: high
  description: Supermicro Ipmi default admin login credentials were successful.
  reference:
    - https://www.gearprimer.com/wiki/supermicro-ipmi-default-username-pasword/
  metadata:
    runzero-match: any(each(service["html.bodies"]), {# matches "/cgi/login.cgi"})
    max-request: 2
  tags: default-login,supermicro,vuln
http:
  - attack: pitchfork
    matchers:
      - condition: and
        part: body
        type: word
        words:
          - self.location=
          - /cgi/url_redirect.cgi?url_name=mainmenu
      - status:
          - 200
        type: status
    matchers-condition: and
    payloads:
      pass:
        - ADMIN
        - admin
      user:
        - ADMIN
        - admin
    raw:
      - |
        POST /cgi/login.cgi HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        name={{user}}&pwd={{pass}}
    stop-at-first-match: true
