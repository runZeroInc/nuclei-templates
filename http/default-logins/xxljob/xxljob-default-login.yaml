id: xxljob-default-login
info:
  name: XXL-JOB Default Login
  author: pdteam,ritikchaddha
  severity: high
  description: XXL-JOB default admin credentials were discovered.
  reference:
    - https://github.com/xuxueli/xxl-job
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    runzero-match: service["favicon.ico.image.mmh3"] == "1691956220"
    fofa-query: icon_hash=1691956220
    max-request: 2
    product: xxl-job
    shodan-query: http.favicon.hash:1691956220
    vendor: xuxueli
    verified: true
  tags: default-login,vuln,xxljob
http:
  - attack: pitchfork
    matchers:
      - condition: and
        type: word
        words:
          - '"code":200'
          - '"msg"'
          - '"content"'
      - condition: and
        part: header
        type: word
        words:
          - application/json
          - XXL_JOB_LOGIN_IDENTITY
      - status:
          - 200
        type: status
    matchers-condition: and
    payloads:
      password:
        - 123456
      username:
        - admin
    raw:
      - |
        POST /xxl-job-admin/login HTTP/1.1
        Host:{{Hostname}}
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8

        userName={{username}}&password={{password}}
      - |
        POST /login HTTP/1.1
        Host:{{Hostname}}
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8

        userName={{username}}&password={{password}}
    stop-at-first-match: true
