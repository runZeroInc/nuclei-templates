id: nagios-default-login
info:
  name: Nagios Default Login
  author: iamthefrogy
  severity: high
  description: Nagios default admin credentials were discovered.
  reference:
    - https://www.nagios.org
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Nagios Core"})
    max-request: 2
  tags: default-login,nagios,vuln
http:
  - attack: pitchfork
    matchers:
      - status:
          - 200
        type: status
      - part: header
        type: word
        words:
          - text/html
      - condition: and
        part: body
        type: word
        words:
          - Current Status
          - Reports
    matchers-condition: and
    payloads:
      password:
        - nagiosadmin
        - nagiosxi
      username:
        - nagiosadmin
        - root
    raw:
      - |
        GET /nagios/side.php HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic {{base64(username + ':' + password)}}
