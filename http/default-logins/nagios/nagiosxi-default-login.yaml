id: nagiosxi-default-login
info:
  name: Nagios XI Default Admin Login - Detect
  author: ritikchaddha
  severity: critical
  description: Nagios XI default admin login credentials were detected.
  reference:
    - https://nagiosxi.demos.nagios.com/nagiosxi/login.php?redirect=/nagiosxi/index.php%3f&noauth=1
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
    cwe-id: CWE-1391
    cpe: cpe:2.3:a:nagios:nagios_xi:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "Nagios XI"})
    max-request: 6
    product: nagios_xi
    shodan-query: title:"Nagios XI"
    vendor: nagios
    verified: true
  tags: default-login,nagios,nagiosxi,vuln
http:
  - attack: pitchfork
    extractors:
      - group: 1
        internal: true
        name: nsp
        part: body
        regex:
          - name="nsp" value="(.*)">
        type: regex
    host-redirects: true
    matchers:
      - condition: and
        part: body_3
        type: word
        words:
          - Home Dashboard</a>
          - Admin</a>
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    payloads:
      password:
        - nagiosadmin
        - nagiosxi
      username:
        - nagiosadmin
        - root
    raw:
      - |
        GET /nagiosxi/login.php HTTP/1.1
        Host: {{Hostname}}
      - |
        POST /nagiosxi/login.php HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        nsp={{nsp}}&page=auth&debug=&pageopt=login&username={{username}}&password={{password}}&loginButton=
      - |
        GET /nagiosxi/index.php HTTP/1.1
        Host: {{Hostname}}
    stop-at-first-match: true
