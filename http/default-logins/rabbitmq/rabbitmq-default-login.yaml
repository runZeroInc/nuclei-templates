id: rabbitmq-default-login
info:
  name: RabbitMQ Default Login
  author: fyoorer,dwisiswant0
  severity: high
  description: RabbitMQ default admin credentials were discovered.
  reference:
    - https://onlinehelp.coveo.com/en/ces/7.0/administrator/changing_the_rabbitmq_administrator_password.htm
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "RabbitMQ Management"})
    max-request: 1
  tags: default-login,rabbitmq,vuln
http:
  - attack: pitchfork
    matchers:
      - part: header
        type: word
        words:
          - application/json
      - part: body
        type: word
        words:
          - '{"name":"guest"'
      - status:
          - 200
        type: status
    matchers-condition: and
    payloads:
      password:
        - guest
      username:
        - guest
    raw:
      - |
        GET /api/whoami HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded
        Authorization: Basic {{base64(username + ':' + password)}}
