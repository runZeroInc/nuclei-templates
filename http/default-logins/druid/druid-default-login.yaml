id: druid-default-login
info:
  name: Alibaba Druid Monitor Default Login
  author: pikpikcu,j4vaovo
  severity: high
  description: Alibaba Druid Monitor default login information (admin/admin) was discovered.
  classification:
    cwe-id: CWE-798
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)druid monitor"})
    fofa-query: title="druid monitor"
    max-request: 2
  tags: alibaba,default-login,druid,vuln
flow: http(1) && http(2)
http:
  - matchers:
      - internal: true
        type: word
        words:
          - error
    raw:
      - |
        GET /druid/submitLogin HTTP/1.1
        Host: {{Hostname}}
  - attack: pitchfork
    matchers:
      - status:
          - 200
        type: status
      - regex:
          - ^success$
        type: regex
    matchers-condition: and
    payloads:
      password:
        - admin
      username:
        - admin
    raw:
      - |
        POST /druid/submitLogin HTTP/1.1
        Host: {{Hostname}}

        loginUsername={{username}}&loginPassword={{password}}
