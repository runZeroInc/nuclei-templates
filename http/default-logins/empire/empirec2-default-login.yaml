id: empirec2-default-login
info:
  name: Empire C2 / Starkiller Interface - Default Login
  author: clem9669,parzival
  severity: high
  description: |
    Empire C2 / Starkiller Default Administrator Credentials Discovered.
  reference:
    - https://github.com/BC-SECURITY/Empire
    - https://github.com/BC-SECURITY/empire-docs/blob/main/restful-api/README.md
  metadata:
    runzero-review: REJECT/2025-11-07/excluding tag intrusive
    max-request: 2
    verified: true
  tags: c2,default-login,empire,intrusive,vuln
http:
  - attack: pitchfork
    matchers:
      - condition: or
        part: body
        type: word
        words:
          - access_token
          - '{"token":".*"}'
      - negative: true
        part: body
        type: word
        words:
          - '"code":1001'
      - part: content_type
        type: word
        words:
          - application/json
      - status:
          - 200
        type: status
    matchers-condition: and
    payloads:
      password:
        - password123
      username:
        - empireadmin
    raw:
      - |
        POST /token HTTP/1.1
        Host: {{Hostname}}
        Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryoZwyedGcQU4FrcFV
        Accept: application/json, text/plain, */*

        ------WebKitFormBoundaryoZwyedGcQU4FrcFV
        Content-Disposition: form-data; name="username"

        {{username}}
        ------WebKitFormBoundaryoZwyedGcQU4FrcFV
        Content-Disposition: form-data; name="password"

        {{password}}
        ------WebKitFormBoundaryoZwyedGcQU4FrcFV--
      - |
        POST /api/admin/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"username":"{{user}}","password":"{{pass}}"}
    stop-at-first-match: true
