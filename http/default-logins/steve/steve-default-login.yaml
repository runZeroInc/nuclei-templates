id: steve-default-login
info:
  name: SteVe Login Panel - Detect
  author: clem9669
  severity: info
  description: |
    SteVe login panel was detected.
  reference:
    - https://github.com/steve-community/steve
    - https://github.com/steve-community/steve/blob/e42ddcf1acf6c4ad2287bb466b2d3550663ce978/src/main/resources/config/test/main.properties
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
    cpe: cpe:2.3:a:steve-community:steve:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "SteVe - Steckdosenverwaltung"})
    google-query: intitle:"SteVe - Steckdosenverwaltung"
    max-request: 2
    product: steve
    shodan-query: http.title:"SteVe - Steckdosenverwaltung"
    vendor: steve-community
    verified: true
  tags: default-login,panel,steve,vuln
http:
  - attack: clusterbomb
    extractors:
      - group: 1
        internal: true
        name: csrf
        part: body
        regex:
          - _csrf" value="(.*?)"/>
        type: regex
    matchers:
      - condition: and
        part: body_2
        type: word
        words:
          - <a>DATA MANAGEMENT
          - SIGN OUT</a>
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    payloads:
      password:
        - 1234
      username:
        - admin
    raw:
      - |
        GET /steve/manager/signin HTTP/1.1
        Host: {{Hostname}}
      - |
        POST /steve/manager/signin HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        username={{username}}&password={{password}}&_csrf={{csrf}}
    redirects: true
