id: gude-default-login
info:
  name: GUDE - Default Login
  author: Bretss,BENZOOgatag
  severity: high
  description: GUDE 2301 and 2302 default administrator or user login credentials (admin:admin or user:user) were detected.
  reference:
    - https://media.distrelec.com/Web/Downloads/_m/an/Gude_2302-1_ger_man.pdf
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    runzero-match: any(each(service["http.bodies"]), {# matches "(?i)Expert Net Control"})
    fofa-query: body="Expert Net Control"
    max-request: 2
    shodan-query: http.html:"Expert Net Control"
  tags: default-login,gude
http:
  - headers:
      Authorization: Basic YWRtaW46YWRtaW4=
    matchers:
      - condition: and
        dsl:
          - contains(body, "Control Panel")
          - status_code == 200
        type: dsl
    method: GET
    path:
      - '{{BaseURL}}/ov.html?'
