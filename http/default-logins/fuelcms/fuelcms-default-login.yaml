id: fuelcms-default-login
info:
  name: Fuel CMS - Default Admin Discovery
  author: Adam Crosser
  severity: high
  description: Fuel CMS default admin credentials were discovered.
  reference:
    - https://docs.getfuelcms.com/general/security
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 2
  tags: default-login,fuelcms,oss,vuln
http:
  - attack: pitchfork
    extractors:
      - group: 1
        internal: true
        name: csrftoken
        part: body
        regex:
          - id="ci_csrf_token_FUEL" value="([0-9a-z]+)" \/>
        type: regex
    matchers:
      - part: header
        type: word
        words:
          - /fuel/dashboard
      - part: header
        regex:
          - fuel_(.*)=
        type: regex
      - status:
          - 302
        type: status
    matchers-condition: and
    payloads:
      password:
        - admin
      username:
        - admin
    raw:
      - |
        GET /fuel/login HTTP/1.1
        Host: {{Hostname}}
      - |
        POST /fuel/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        user_name={{username}}&password={{password}}&Login=Login&forward=&ci_csrf_token_FUEL={{csrftoken}}
