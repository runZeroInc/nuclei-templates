id: kettle-default-login
info:
  name: Kettle - Default Login
  author: For3stCo1d
  severity: medium
  description: Kettle contains a default login vulnerability. An attacker can obtain access to user accounts and access sensitive information, modify data, and/or execute unauthorized operations.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:N/A:N
    cvss-score: 5.8
    cwe-id: CWE-522
  metadata:
    runzero-match: any(each(service["http.head.wwwAuthentications"]), {# contains 'realm="Kettle'})
    max-request: 1
    shodan-query: basic realm="Kettle"
    verified: true
  tags: default-login,kettle,vuln
http:
  - attack: pitchfork
    headers:
      Authorization: Basic {{base64(username + ':' + password)}}
    matchers:
      - part: body
        type: word
        words:
          - Kettle slave server
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/'
    payloads:
      password:
        - cluster
      username:
        - cluster
