id: iptime-default-login
info:
  name: ipTIME Default Login
  author: gy741
  severity: high
  description: ipTIME default admin credentials were discovered.
  reference:
    - https://www.freewebtools.com/IPTIME/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 1
  tags: default-login,iptime,vuln
http:
  - attack: pitchfork
    matchers:
      - status:
          - 200
        type: status
      - condition: and
        part: body
        type: word
        words:
          - setCookie
          - efm_session_id
          - login.cgi
    matchers-condition: and
    payloads:
      password:
        - admin
      username:
        - admin
    raw:
      - |
        POST /sess-bin/login_handler.cgi HTTP/1.1
        Host: {{Hostname}}
        Referer: {{BaseURL}}/sess-bin/login_session.cgi

        username={{username}}&passwd={{password}}
