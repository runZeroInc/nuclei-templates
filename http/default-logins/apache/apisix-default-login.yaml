id: apisix-default-login

info:
  name: Apache Apisix Admin Default Credentials
  author: pdteam
  severity: high
  description: Apache Apisix Admin default login credentials were discovered.
  reference:
    - https://apisix.apache.org/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "Apache APISIX Dashboard"})
    max-request: 1
    product: https://apisix.apache.org
    shodan-query: title:"Apache APISIX Dashboard"
    fofa-query: title="Apache APISIX Dashboard"
  tags: apisix,apache,default-login,vuln

http:
  - raw:
      - |
        POST /apisix/admin/user/login HTTP/1.1
        Host: {{Hostname}}
        Accept: application/json
        Authorization:
        Content-Type: application/json;charset=UTF-8

        {"username":"{{user}}","password":"{{pass}}"}

    attack: pitchfork
    payloads:
      user:
        - admin
      pass:
        - admin

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"data":'
          - '"token":'
          - '{"code":0'
        condition: and

      - type: word
        part: header
        words:
          - application/json

      - type: status
        status:
          - 200

