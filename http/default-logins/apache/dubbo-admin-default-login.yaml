id: dubbo-admin-default-login
info:
  name: Apache Dubbo - Default Admin Discovery
  author: ritikchaddha
  severity: high
  description: Apache Dubbo default admin credentials were discovered.
  reference:
    - https://www.cnblogs.com/wishwzp/p/9438658.html
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    max-request: 2
  tags: apache,default-login,dubbo,vuln
http:
  - attack: pitchfork
    headers:
      Authorization: Basic {{base64(username + ':' + password)}}
      Content-Type: application/x-www-form-urlencoded
    matchers:
      - condition: and
        type: word
        words:
          - <title>Dubbo Admin</title>
          - /sysinfo/versions
          - '{{username}}'', ''/logout'')'
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/'
    payloads:
      password:
        - guest
        - root
      username:
        - guest
        - root
