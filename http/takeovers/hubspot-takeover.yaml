id: hubspot-takeover
info:
  name: hubspot takeover detection
  author: pdteam
  severity: high
  description: hubspot takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/59
    - https://hackerone.com/reports/335330
  metadata:
    max-request: 1
  tags: hackerone,hubspot,takeover,vuln
http:
  - extractors:
      - dsl:
          - cname
        type: dsl
    matchers:
      - dsl:
          - Host != ip
        type: dsl
      - condition: and
        type: word
        words:
          - Domain not found
          - does not exist in our system
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
  - extractors:
      - kval:
          - x_hs_reason
        name: hubspot-reason
        type: kval
    host-redirects: true
    matchers:
      - condition: and
        dsl:
          - status_code == 404
          - contains(to_lower(header), "x-hubspot-notfound")
          - contains_all(to_lower(header), "x-hs-cfworker-meta", "{\"resolver\":\"notfoundresolver\"}")
        type: dsl
    matchers-condition: and
    max-redirects: 3
    method: GET
    path:
      - '{{BaseURL}}'
